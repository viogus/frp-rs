# Toolchain pin — the source of truth for the compiler of every rustup-based job
# that builds the checked-out tree (local dev included), and for the `rustc`,
# `cargo`, `cargo clippy` and `cargo fmt` shims run anywhere under this
# directory. It is the file that does the selecting, not any workflow step: a job
# only has to make sure the toolchain exists, by running
# `rustup toolchain install --no-self-update` (with no argument it installs
# exactly what this file asks for). `.github/workflows/ci.yml` does that, and the
# other workflows' `actions-rust-lang/setup-rust-toolchain@v1` steps pass no
# `toolchain:` input, so they install what this file specifies (the action's
# documented behaviour). Result: a rustc/clippy bump must be a deliberate,
# reviewable change to this file instead of a race with whatever `stable` a
# runner image or a developer's `rustup default` happens to carry.
#
# NOT covered: the Docker source build. `docker/Dockerfile.source` starts from a
# floating `rust:1-slim-bookworm` and never copies this file into the build
# context, so images built from it are compiled by a toolchain this pin does not
# reach. That is a recorded open item — see the "Docker source build" entry in
# `TODO.md`.
#
# `channel` is an EXACT version on purpose. `channel = "stable"` — or a floating
# `"1.98"` — would follow new releases, which is the hazard this file exists to
# close: a new rustc/clippy can add a lint that fires on untouched code, so the
# `Lint` gate would go red on a commit that changed nothing.
#
# `profile = "minimal"` installs rustc, cargo and rust-std only; `components`
# adds exactly the two tools the documented gates need — `rustfmt` for
# `cargo fmt --all -- --check`, and `clippy` for
# `cargo clippy --workspace --all-targets --all-features -- -D warnings`.
# Measured on rustup 1.29.1 with an empty `RUSTUP_HOME` (no toolchain at all):
# `rustup toolchain install --no-self-update` resolves this file, downloads
# 5 components, installs no rust-docs, and reports the toolchain active
# "because: overridden by <repo>/rust-toolchain.toml". A bare `rustup show` also
# auto-installs it, but rustup 1.29.1 prints that auto-installation is deprecated
# for most commands and that `rustup install` should be used instead.
#
# Two caveats, both measured on rustup 1.29.1. A misspelled component is the one
# degenerate case that does NOT fail loudly: `components = ["rustfm"]` prints
# `warn: skipping unavailable component rustfm` and exits 0 (a malformed file and
# an unknown `profile` both exit 1), so a typo there is caught by review, not by
# the command. And keep the standard `[toolchain]` section form below: rustup
# also honours an inline table and a dotted key, but `scripts/repo-health.sh`
# parses the section form only and fails closed on those.
#
# To bump:
#   1. edit `channel` below to the new exact version;
#   2. run `rustup toolchain install --no-self-update` (installs it and its two
#      components);
#   3. run `cargo fmt --all -- --check` and
#      `cargo clippy --workspace --all-targets --all-features -- -D warnings`;
#   4. fix any lint the new compiler reports in that same PR — that diff is the
#      point of the pin, not a separate chore.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
