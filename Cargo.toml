[workspace]
resolver = "2"
members = [
    "frp-core",
    "frp-server",
    "frp-client",
    "frp-vnet",
    "frps",
    "frpc",
]

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread", "signal"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bpaf = "0.9"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = "0.24"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
data-encoding = "2"
aes = "0.8"
cfb-mode = "0.8"
pbkdf2 = "0.12"
snap = "1"
rand = "0.8"
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "sink"] }
rustls-platform-verifier = "0.6"
ring = "0.17"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
axum = "0.8.9"
prometheus = "0.13"
yamux = "0.14"
russh = { version = "0.61", default-features = false, features = ["ring", "rsa"] }
tokio-util = { version = "0.7", features = ["compat"] }
kcp = "0.6"
rust_tokio_kcp = { version = "0.2.1", default-features = false }
quinn = "0.11"

frp-vnet = { path = "frp-vnet" }

socket2 = "0.5"
chacha20poly1305 = "0.10"
criterion = "0.5"

# Release profile: slim, LTO, single codegen unit, stripped symbols, abort on panic.
# After cargo build --release, compress further with:
#   upx --best --lzma target/release/frps target/release/frpc
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Patched kcp crate — kcp-go v5.6.13 compat fixes:
#   1. RTO linear backoff (rto += rx_rto/2, not rto += rto/2)
#   2. Flush ordering: fast_retransmit before RTO
#   3. Early retransmit: fastack>0 && new_segs==0
[patch.crates-io]
kcp = { path = "frp-core/vendored/kcp-0.6.0" }
rust_tokio_kcp = { path = "frp-core/vendored/rust_tokio_kcp" }
