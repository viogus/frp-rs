[workspace]
resolver = "2"
members = [
    "frp-core",
    "frp-server",
    "frp-client",
    "frp-vnet",
    "frps",
    "frpc",
]

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread", "signal", "process"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML config support (Go frp v0.70.1 accepts TOML/YAML/JSON/INI configs via
# Viper). Needed: serde_json/toml cannot parse YAML, so a YAML parser is
# required for parity with Go frp. Alternatives rejected: `serde_yaml`
# (deprecated upstream, archived) and `serde_yml` (unmaintained fork);
# `serde_yaml_ng` is the actively maintained fork of serde_yaml 0.9 with the
# same API. Binary impact: +~250KB to both frps and frpc release binaries —
# it is a non-optional dep of frp-core, and config loading is always compiled
# in, so both binaries carry it.
serde_yaml_ng = "0.10"
bpaf = "0.9"
toml = "0.8"
anyhow = { version = "1", default-features = false, features = ["std"] }
tracing = "0.1"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
sha1 = "0.10"
md-5 = "0.10"
aes = "0.9"
cfb-mode = "0.9"
pbkdf2 = "0.12"
snap = "1"
rand = "0.10"
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
rustls-platform-verifier = "0.7"
ring = "0.17"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hyper = { version = "1", default-features = false, features = ["http1", "client"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1"] }
# Needed for the OIDC HTTP client's custom hyper connector: hyper-util's
# legacy `Connect` bound is `tower::Service`, which hyper 1.x does not
# re-export (its own `service::Service` takes `&self`). tower-service 0.3
# is already in the tree via axum/hyper; zero additional size.
tower-service = "0.3"
http-body-util = "0.1"
webpki-roots = "1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "tracing"] }
prometheus = { version = "0.14", default-features = false }
yamux = "0.14"
russh = { version = "0.62.5", default-features = false, features = ["ring", "rsa"] }
tokio-util = { version = "0.7", features = ["compat"] }
h2 = "0.4"
http = "1"
bytes = "1"
# Lock-free bounded queue for the bridge buffer pool: the data plane takes
# one acquire + one release per bridge chunk, and concurrent releases during
# connection churn must not serialize on a std Mutex. ArrayQueue is MPMC and
# only pulls in crossbeam-utils (already in the tree via crossbeam-channel).
crossbeam-queue = "0.3"
# Only used by frp-server: replaces the tokio RwLock around
# `state.run_id_to_ctl_tx` so every work-conn dispatch no longer contends on
# one global read lock. DashMap shards the map across per-bucket locks.
# Binary impact: ~+50KB.
dashmap = "6"
quinn = "0.11"

frp-vnet = { path = "frp-vnet" }

socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
chacha20poly1305 = "0.10"
pprof = { version = "0.15", features = ["flamegraph"] }
mimalloc = "0.1.52"

# Release profile: slim, LTO, single codegen unit, stripped symbols, abort on panic.
# After cargo build --release, compress further with:
#   upx --best --lzma target/release/frps target/release/frpc
# Vendored rustls 0.23.43 with a server-side patch: Go frp XTCP QUIC visitors
# send "ip:port" as the TLS SNI, which upstream rustls 0.23 rejects with a
# fatal alert (ServerNamePayload::Invalid). The patch treats invalid SNI as
# "no SNI" (upstream 0.24 `invalid_sni_policy = IgnoreAll`). See
# docs/superpowers/notes/2026-08-04-mimalloc-throughput-ab.md §6. Drop when
# the workspace moves past rustls 0.23.
[patch.crates-io]
rustls = { path = "vendor/rustls" }
# yamux 0.14.0 with a per-stream RST on inbound stream-cap hits (instead
# of a session-killing GoAway) — see vendor/yamux/README-FRP-RS.md.
yamux = { path = "vendor/yamux" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Throughput/latency-first build: same LTO/strip/abort discipline as
# `release`, but with -O3 instead of -Oz for the hot data plane. Binary is
# a few hundred KB larger; use `cargo build --profile release-perf`.
[profile.release-perf]
inherits = "release"
opt-level = 3
