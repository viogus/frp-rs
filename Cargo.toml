[workspace]
resolver = "2"
members = [
    "frp-core",
    "frp-server",
    "frp-client",
    "frps",
    "frpc",
]

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = "0.24"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
aes-gcm = { version = "0.10", features = ["aes"] }
flate2 = "1.0"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
http = "1"
hyper = "1"
hyper-util = "0.1"
pin-project = "1"
futures-util = "0.3"
webpki-roots = "0.26"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
