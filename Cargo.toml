[workspace]
resolver = "2"
members = [
    "frp-core",
    "frp-server",
    "frp-client",
    "frp-vnet",
    "frps",
    "frpc",
]

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread", "signal", "process"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML config support. Go frp reads `.yaml`/`.yml` with `gopkg.in/yaml.v2`
# v2.4.0 (`pkg/config/load.go:176 LoadConfigure` tries TOML for every extension
# first, then JSON, then yaml.v2, and JSON-marshals the result into a decoder
# with `DisallowUnknownFields`; there is no Viper and no mapstructure in the
# frp v0.71.0 binary). Neither serde_json nor toml parses YAML, so a YAML parser
# is required for that parity.
#
# Needed: `yaml-rust2` 0.13 replaces `serde_yaml_ng` 0.10, whose `unsafe-libyaml`
# dependency carries the unmaintained advisory RUSTSEC-2024-0449. The advisory
# has no upstream fix, and both its `patched` and `unaffected` fields are empty,
# so replacing the reader is the only way to remove the documented `cargo audit`
# ignore (verified: the release binary no longer contains `unsafe-libyaml`).
#
# Alternatives rejected (all measured on this host with the declared release
# profile, against the pre-migration frpc 4,428,432 B / frps 5,428,304 B):
# `serde-saphyr` 1.3.0 clears the advisory but costs frpc +216,576 B (+4.891 %)
# and adds 7 packages to Cargo.lock; `serde_norway` 0.9.42 (+16 B) renames the
# same c2rust code to `unsafe-libyaml-norway`, hiding the advisory instead of
# clearing it; `serde_yml` 0.0.13 (-16,576 B) is deprecated and fails
# `cargo deny` (RUSTSEC-2025-0068, unsound); patching or vendoring a copy of
# libyaml in-tree leaves the advisory matching by name. `yaml-rust2` is pure safe
# Rust (no c2rust, no unsafe-libyaml), maintained, with no open advisories.
#
# Binary size: smaller than the dependency it replaces — frpc 4,411,648 B and
# frps 5,411,568 B, i.e. -16,784 B (-0.379 %) and -16,736 B (-0.308 %). This is a
# net saving, not the ~+250 KB the previous YAML dependency was recorded as.
# Cargo.lock: adds `yaml-rust2`, `hashlink` and `arraydeque`, removes
# `serde_yaml_ng` and `unsafe-libyaml` (445 -> 446 `[[package]]` entries).
# The event-stream API is used directly (see `frp-core/src/config/format.rs`)
# because scalar style and tags are only visible there.
#
# `default-features = false` drops yaml-rust2's `encoding` feature, which only
# `encoding_rs` backs and only its `YamlDecoder` (BOM/UTF-16) path uses — a path
# this port does not call (the parser, scanner and loader APIs used here are not
# feature-gated). It removes `encoding_rs` from the lock and is verified by the
# frp-core suite.
yaml-rust2 = { version = "0.13", default-features = false }
bpaf = "0.9"
toml = "1.1"
anyhow = { version = "1", default-features = false, features = ["std"] }
tracing = "0.1"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
sha1 = "0.11"
md-5 = "0.11"
aes = "0.9"
cfb-mode = "0.9"
pbkdf2 = "0.13"
snap = "1"
rand = "0.10"
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
rustls-platform-verifier = "0.7"
ring = "0.17"
jsonwebtoken = "9"
# Dev-only (frp-server dashboard integration tests). reqwest 0.13's TLS
# features either force aws-lc-rs (`rustls`, the banned backend) or panic at
# `Client::build()` without an installed crypto provider
# (`rustls-no-provider`), and the tests only hit `http://` localhost URLs —
# so no TLS feature is enabled at all.
reqwest = { version = "0.13", default-features = false }
hyper = { version = "1", default-features = false, features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1"] }
# Needed for the OIDC HTTP client's custom hyper connector: hyper-util's
# legacy `Connect` bound is `tower::Service`, which hyper 1.x does not
# re-export (its own `service::Service` takes `&self`). tower-service 0.3
# is already in the tree via axum/hyper; zero additional size.
tower-service = "0.3"
http-body-util = "0.1"
webpki-roots = "1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "tracing"] }
prometheus = { version = "0.14", default-features = false }
yamux = "0.14"
russh = { version = "0.65.0", default-features = false, features = ["ring", "rsa"] }
tokio-util = { version = "0.7", features = ["compat"] }
h2 = "0.4"
http = "1"
bytes = "1"
# Lock-free bounded queue for the bridge buffer pool: the data plane takes
# one acquire + one release per bridge chunk, and concurrent releases during
# connection churn must not serialize on a std Mutex. ArrayQueue is MPMC and
# only pulls in crossbeam-utils (already in the tree via crossbeam-channel).
crossbeam-queue = "0.3"
# Only used by frp-server: replaces the tokio RwLock around
# `state.run_id_to_ctl_tx` so every work-conn dispatch no longer contends on
# one global read lock. DashMap shards the map across per-bucket locks.
# Binary impact: ~+50KB.
dashmap = "6"
quinn = "0.11"

frp-vnet = { path = "frp-vnet" }

socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
chacha20poly1305 = "0.11"
pprof = { version = "0.15", features = ["flamegraph"] }
mimalloc = "0.1.52"

# Release profile: slim, LTO, single codegen unit, stripped symbols, abort on panic.
# After cargo build --release, compress further with:
#   upx --best --lzma target/release/frps target/release/frpc
# Vendored rustls 0.23.46 with a server-side patch: Go frp XTCP QUIC visitors
# send "ip:port" as the TLS SNI, which upstream rustls 0.23 rejects with a
# fatal alert (ServerNamePayload::Invalid). The patch treats invalid SNI as
# "no SNI" (upstream 0.24 `invalid_sni_policy = IgnoreAll`). 0.23.46 is the
# security fix for RUSTSEC-2026-0346/-0347/-0348/-0349 (published 2026-10-14);
# see vendor/rustls/README-FRP-RS.md for the full bump history.
# See docs/archive/notes/2026-08-04-xtcp-quic-sni-compat.md. Drop when
# the workspace moves past rustls 0.23.
[patch.crates-io]
rustls = { path = "vendor/rustls" }
# yamux 0.14.0 with a per-stream RST on inbound stream-cap hits (instead
# of a session-killing GoAway) — see vendor/yamux/README-FRP-RS.md.
yamux = { path = "vendor/yamux" }
# russh 0.65.0 with ssh-key's `encryption` + `ppk` features dropped (dead
# code in the frp-rs SSH gateway) — see vendor/russh/README-FRP-RS.md.
russh = { path = "vendor/russh" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Throughput/latency-first build: same LTO/strip/abort discipline as
# `release`, but with -O3 instead of -Oz for the hot data plane. Binary is
# a few hundred KB larger; use `cargo build --profile release-perf`.
[profile.release-perf]
inherits = "release"
opt-level = 3
