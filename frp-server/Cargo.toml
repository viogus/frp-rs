[package]
name = "frp-server"
version = "0.69.1"
edition = "2021"

[dependencies]
frp-core = { path = "../frp-core", default-features = false }
frp-vnet = { workspace = true, optional = true }
russh = { workspace = true, optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
data-encoding.workspace = true
tokio-tungstenite = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
tokio-util.workspace = true
axum = { workspace = true, optional = true, features = ["ws"] }
prometheus = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rand = { version = "0.10" }
ring.workspace = true

[features]
default = ["ssh", "dashboard", "websocket", "quic", "kcp", "oidc", "tls", "http-proxy", "vnet", "compression", "chacha20", "tcp-mux"]
ssh = ["dep:russh"]
dashboard = ["dep:prometheus", "dep:axum", "frp-core/admin-auth"]
websocket = ["dep:tokio-tungstenite", "frp-core/websocket"]
quic = ["frp-core/quic"]
kcp = ["frp-core/kcp"]
oidc = ["frp-core/oidc"]
tls = ["frp-core/tls", "dep:tokio-rustls"]
http-proxy = ["dep:reqwest"]
vnet = ["frp-core/vnet", "dep:frp-vnet"]
compression = ["frp-core/compression"]
chacha20 = ["frp-core/chacha20"]
tcp-mux = ["frp-core/tcp-mux"]

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
axum = { workspace = true }
jsonwebtoken = { workspace = true }
criterion.workspace = true

[[bench]]
name = "nathole"
harness = false
