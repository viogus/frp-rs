[package]
name = "frp-server"
version = "0.3.1"
edition = "2021"

[dependencies]
frp-core = { path = "../frp-core", default-features = false }
russh = { workspace = true, optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
data-encoding.workspace = true
tokio-tungstenite = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
tokio-util.workspace = true
axum = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rand = "0.10"

[features]
default = ["ssh", "dashboard", "websocket", "quic", "kcp", "oidc", "tls", "http-proxy"]
ssh = ["dep:russh"]
dashboard = ["dep:prometheus", "dep:axum"]
websocket = ["dep:tokio-tungstenite", "frp-core/websocket"]
quic = ["frp-core/quic"]
kcp = ["frp-core/kcp"]
oidc = ["frp-core/oidc"]
tls = ["frp-core/tls", "dep:tokio-rustls"]
http-proxy = ["dep:reqwest"]

[dev-dependencies]
tempfile = "3"
