[package]
name = "frp-server"
version = "0.7.0"
edition = "2021"
license = "MIT"

[dependencies]
frp-core = { path = "../frp-core", default-features = false }
frp-vnet = { workspace = true, optional = true }
russh = { workspace = true, optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
data-encoding.workspace = true
tokio-tungstenite = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
tokio-util.workspace = true
# ws feature pulls tokio-tungstenite 0.29 alongside frp-core's 0.24.
# Remove when v1 dashboard WebSocket is fully supplanted by v2 REST polling.
axum = { workspace = true, optional = true, features = ["ws"] }
prometheus = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rand.workspace = true
rand010 = { package = "rand", version = "0.10", optional = true }  # SSH compat (russh expects rand 0.10 RNG traits)
ring.workspace = true

[features]
default = ["ssh", "dashboard", "websocket", "quic", "kcp", "oidc", "tls", "http-proxy", "vnet", "compression", "chacha20", "tcp-mux"]
ssh = ["dep:russh", "dep:rand010"]
dashboard = ["dep:prometheus", "dep:axum", "frp-core/admin-auth"]
websocket = ["dep:tokio-tungstenite", "frp-core/websocket"]
quic = ["frp-core/quic"]
kcp = ["frp-core/kcp"]
oidc = ["frp-core/oidc"]
tls = ["frp-core/tls", "dep:tokio-rustls"]
http-proxy = ["dep:reqwest"]
vnet = ["frp-core/vnet", "dep:frp-vnet"]
compression = ["frp-core/compression"]
chacha20 = ["frp-core/chacha20"]
tcp-mux = ["frp-core/tcp-mux"]
mem-profile = ["frp-core/mem-profile"]
profiling = ["frp-core/profiling"]

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
axum = { workspace = true }
jsonwebtoken = { workspace = true }
criterion.workspace = true

[[bench]]
name = "nathole"
harness = false

[[bench]]
name = "proxy_registration"
harness = false
