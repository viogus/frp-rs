[package]
name = "frp-server"
version = "0.71.0"
edition = "2021"
license = "MIT"

[dependencies]
bytes = { workspace = true }
frp-core = { path = "../frp-core", default-features = false }
frp-vnet = { workspace = true, optional = true }
# h2c HTTP vhost support: the byte-level bridge cannot decode HTTP/2 frames; h2
# is the tokio-official HTTP/2 implementation (Go uses net/http's h2c; Rust has
# no std HTTP/2). No existing dep fits (axum/hyper are dashboard-only and
# opt-in). Optional — only compiled with the `http-proxy` feature (audit round
# 5, MEDIUM): vhost_h2c.rs + h2's dependency tree (indexmap/hashbrown/fnv)
# were previously forced into micro/tiny builds that never serve vhosts.
h2 = { workspace = true, optional = true }
http = { workspace = true }
# catch_unwind for the single-spawn bridge panic surfacing (audit round 5,
# MEDIUM); already a workspace dep (frp-core/frp-client) — no new crate.
futures-util.workspace = true
# Lock-free sharded map for run_id → control-channel routing (D3-3: eliminates
# the global RwLock read-lock contention on every work-conn dispatch).
dashmap.workspace = true
russh = { workspace = true, optional = true }
# NOTE: russh → ssh-cipher → aes-gcm 0.11.0-rc.4 is a pre-release. Only used for
# SSH feature. Monitor upstream for stable release.
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio-rustls = { workspace = true, optional = true }
tokio-util.workspace = true
# TARGET: Remove the axum "ws" feature (dashboard WebSocket) when v1
# dashboard WebSocket is fully supplanted by v2 REST polling (target: v0.8.0).
axum = { workspace = true, optional = true, features = ["ws"] }
prometheus = { workspace = true, optional = true }
rand.workspace = true
rand010 = { package = "rand", version = "0.10", optional = true }  # NOTE: rand 0.10 required by russh 0.61 for SSH feature. Workspace uses rand 0.8. Track russh upstream migration to unified rand version.
md-5.workspace = true

[features]
default = ["websocket", "kcp", "quic", "oidc", "tls", "http-proxy", "compression", "chacha20", "tcp-mux", "ssh"]
ssh = ["dep:russh", "dep:rand010"]
dashboard = ["dep:prometheus", "dep:axum", "frp-core/admin-auth"]
websocket = ["frp-core/websocket"]
quic = ["frp-core/quic"]
kcp = ["frp-core/kcp"]
oidc = ["frp-core/oidc"]
tls = ["frp-core/tls", "dep:tokio-rustls"]
http-proxy = ["frp-core/http-client", "dep:h2"]
vnet = ["frp-core/vnet", "dep:frp-vnet"]
compression = ["frp-core/compression"]
chacha20 = ["frp-core/chacha20"]
tcp-mux = ["frp-core/tcp-mux"]
mem-profile = ["frp-core/mem-profile"]
profiling = ["frp-core/profiling"]

[dev-dependencies]
# flock(2) for the cross-process port-allocation guard shared by the
# integration-test bins (see common::allocate_port). Already a workspace dep
# pulled in transitively by frp-core — only the direct test reference is new.
libc.workspace = true
tracing-subscriber.workspace = true
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
axum = { workspace = true }
jsonwebtoken = { workspace = true }
bytes = { workspace = true }
criterion = "0.5"

[[bench]]
name = "nathole"
harness = false

[[bench]]
name = "proxy_registration"
harness = false
