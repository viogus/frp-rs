[package]
name = "frpc"
version = "0.71.0"
edition = "2021"
license = "MIT"

[features]
default = ["full"]
full = ["frp-client/default"]
# Feature forwarding: enable the corresponding frp-client feature.
quic = ["frp-client/quic"]
kcp = ["frp-client/kcp"]
websocket = ["frp-client/websocket"]
oidc = ["frp-client/oidc"]
tls = ["frp-client/tls"]
http2http = ["frp-client/http2http"]
vnet = ["frp-client/vnet"]
admin = ["frp-client/admin"]
compression = ["frp-client/compression"]
chacha20 = ["frp-client/chacha20"]
tcp-mux = ["frp-client/tcp-mux"]
# Tiny: removes heavy protocols (QUIC/KCP/WS/OIDC) but keeps TLS + tcp-mux
tiny = ["frp-client/tls", "frp-client/tcp-mux"]
# Micro: absolutely minimal — just TCP + V1/V2 core, no optional deps
micro = []
# Enable debug/trace logging for development. Default: info only.
debug-logs = ["frp-core/debug-logs"]
# OpenTelemetry: structured tracing + OTLP export
# Dep justification (CLAUDE.md policy):
# - opentelemetry: OTel API (traces) — std, no alternative for OTLP export
# - opentelemetry_sdk: span processor + batch exporter — no alternative
# - opentelemetry-otlp: OTLP/HTTP exporter — no alternative
# - tracing-opentelemetry: bridge from tracing spans to OTel — no alternative
# All optional; zero binary size impact when `otel` feature disabled.
# Estimated binary size impact with otel: +2-3 MB (http-proto only, no tonic).
# Carries the full OTel dep tree via frp-core/otel (logging.rs owns the init);
# the binary itself never names an opentelemetry crate.
otel = ["frp-core/otel"]
# Measurement-only counting global allocator. OFF in all shipped builds.
mem-profile = ["frp-client/mem-profile"]
profiling = ["frp-client/profiling"]
# Use mimalloc global allocator (~10-20% throughput gain for network workloads).
# Mutually exclusive with mem-profile (only one #[global_allocator] allowed).
mimalloc = ["dep:mimalloc"]

[dependencies]
frp-core = { path = "../frp-core", default-features = false }
frp-client = { path = "../frp-client", default-features = false }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
mimalloc = { workspace = true, optional = true }

[[bin]]
name = "frpc"
path = "src/main.rs"
required-features = ["full"]

[[bin]]
name = "frpc-tiny"
path = "src/main-tiny.rs"
required-features = ["tiny"]

[[bin]]
name = "frpc-micro"
path = "src/main-micro.rs"
required-features = ["micro"]
