[package]
name = "frpc"
version = "0.1.5"
edition = "2021"

[features]
# Enable debug/trace logging for development. Default: info only.
debug-logs = []

[dependencies]
frp-core = { path = "../frp-core" }
frp-client = { path = "../frp-client" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
toml.workspace = true
serde.workspace = true

[[bin]]
name = "frpc"
path = "src/main.rs"
