[package]
name = "frps"
version = "0.71.0"
edition = "2021"
license = "MIT"

[features]
default = ["full"]
full = ["frp-server/default"]
# Feature forwarding: enable the corresponding frp-server feature.
ssh = ["frp-server/ssh"]
dashboard = ["frp-server/dashboard"]
websocket = ["frp-server/websocket"]
quic = ["frp-server/quic"]
kcp = ["frp-server/kcp"]
oidc = ["frp-server/oidc"]
tls = ["frp-server/tls"]
http-proxy = ["frp-server/http-proxy"]
vnet = ["frp-server/vnet"]
compression = ["frp-server/compression"]
chacha20 = ["frp-server/chacha20"]
tcp-mux = ["frp-server/tcp-mux"]
# Tiny: removes heavy protocols (QUIC/KCP/WS/SSH/OIDC/dashboard) but keeps TLS + http-proxy + tcp-mux
tiny = ["frp-server/tls", "frp-server/http-proxy", "frp-server/tcp-mux"]
# Micro: absolutely minimal — just TCP + V1/V2 core, no optional deps
micro = []
# Enable debug/trace logging for development. Default: info only.
debug-logs = ["frp-core/debug-logs"]
# OpenTelemetry: structured tracing + OTLP export.
# Carries the full OTel dep tree via frp-core/otel (logging.rs owns the init);
# the binary itself never names an opentelemetry crate. Optional; zero binary
# size impact when `otel` disabled (with otel: ~0.1 MB over dashboard-only).
otel = ["frp-core/otel"]
# Measurement-only counting global allocator. OFF in all shipped builds.
mem-profile = ["frp-server/mem-profile"]
profiling = ["frp-server/profiling"]
# Use mimalloc global allocator (~10-20% throughput gain for network workloads).
# Mutually exclusive with mem-profile (only one #[global_allocator] allowed).
mimalloc = ["dep:mimalloc"]

[dependencies]
frp-core = { path = "../frp-core", default-features = false }
frp-server = { path = "../frp-server", default-features = false }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
mimalloc = { workspace = true, optional = true }

[[bin]]
name = "frps"
path = "src/main.rs"
required-features = ["full"]

[[bin]]
name = "frps-tiny"
path = "src/main-tiny.rs"
required-features = ["tiny"]

[[bin]]
name = "frps-micro"
path = "src/main-micro.rs"
required-features = ["micro"]
