[package]
name = "frps"
version = "0.3.1"
edition = "2021"

[features]
default = ["full"]
full = ["frp-server/default"]
# Enable debug/trace logging for development. Default: info only.
debug-logs = []

[dependencies]
frp-core = { path = "../frp-core", default-features = false }
frp-server = { path = "../frp-server", default-features = false }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
toml.workspace = true
serde.workspace = true

[[bin]]
name = "frps"
path = "src/main.rs"
required-features = ["full"]

[[bin]]
name = "frps-tiny"
path = "src/main.rs"
