[package]
name = "frps"
version = "0.2.1"
edition = "2021"

[features]
# Enable debug/trace logging for development. Default: info only.
debug-logs = []

[dependencies]
frp-core = { path = "../frp-core" }
frp-server = { path = "../frp-server" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
toml.workspace = true
serde.workspace = true

[[bin]]
name = "frps"
path = "src/main.rs"
