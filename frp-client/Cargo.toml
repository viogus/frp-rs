[package]
name = "frp-client"
version = "0.7.1"
edition = "2021"
license = "MIT"

[dev-dependencies]
frp-server = { path = "../frp-server" }
tracing-subscriber.workspace = true
md-5.workspace = true
tower = "0.5"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
tempfile = "3"

[dependencies]
frp-core = { path = "../frp-core", default-features = false }
frp-vnet = { workspace = true, optional = true }
futures-util.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
axum = { workspace = true, optional = true }
toml.workspace = true
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
h2 = { workspace = true, optional = true }
http = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
rand.workspace = true

[features]
# admin is OPT-IN (was default): the axum-based admin API adds ~1 MB to the
# default frpc. Build with `--features admin` (or `cargo build -p frpc --features admin`)
# to enable the admin API; `frpc reload`/`status` talk to a running frpc built
# with this feature and `web_server.port > 0` configured.
default = ["tls", "kcp", "quic", "websocket", "oidc", "compression", "chacha20", "tcp-mux"]
admin = ["dep:axum", "frp-core/admin-auth"]
tls = ["frp-core/tls", "dep:rustls", "dep:tokio-rustls", "dep:h2", "dep:http", "dep:bytes"]
quic = ["frp-core/quic"]
kcp = ["frp-core/kcp", "frp-core/stun"]
websocket = ["frp-core/websocket"]
oidc = ["frp-core/oidc"]
vnet = ["frp-core/vnet", "frp-core/stun", "dep:frp-vnet"]
compression = ["frp-core/compression"]
chacha20 = ["frp-core/chacha20"]
tcp-mux = ["frp-core/tcp-mux"]
mem-profile = ["frp-core/mem-profile"]
profiling = ["frp-core/profiling"]
