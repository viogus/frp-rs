[package]
name = "frp-client"
version = "0.71.0"
edition = "2021"
license = "MIT"

[dev-dependencies]
frp-server = { path = "../frp-server" }
tracing-subscriber.workspace = true
md-5.workspace = true
tower = "0.5"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
tempfile = "3"
# test-util enables `#[tokio::test(start_paused = true)]` + time::pause for
# the socks5 handshake-deadline audit test — same pattern as frp-server's
# dev-dependencies; never compiled into non-test builds.
tokio = { workspace = true, features = ["test-util"] }

[dependencies]
frp-core = { path = "../frp-core", default-features = false }
frp-vnet = { workspace = true, optional = true }
futures-util.workspace = true
# "fs": static_file.rs wraps a std file handle via tokio::fs::File::from_std
# (round-8 static_file streaming change); the workspace tokio features do not
# include "fs" and no other crate requests it, so enable it here — client-only,
# keeps frps/frpc-server graphs free of the fs module.
tokio = { workspace = true, features = ["fs"] }
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
axum = { workspace = true, optional = true }
toml.workspace = true
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
h2 = { workspace = true, optional = true }
http = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
rand.workspace = true

[features]
# admin is OPT-IN (was default): the axum-based admin API adds ~1 MB to the
# default frpc. Build with `--features admin` (or `cargo build -p frpc --features admin`)
# to enable the admin API; `frpc reload`/`status` talk to a running frpc built
# with this feature and `web_server.port > 0` configured.
default = ["tls", "kcp", "quic", "websocket", "oidc", "compression", "chacha20", "tcp-mux", "http2http"]
admin = ["dep:axum", "frp-core/admin-auth"]
tls = ["frp-core/tls", "dep:rustls", "dep:tokio-rustls"]
# HTTP/2 (h2) support for the https2http/https2https plugins (enableHTTP2
# path). Implies `tls` — h2 only makes sense on a TLS listener. Kept out of
# `tls` itself so tiny builds (tls without http2http) skip h2/indexmap/bytes
# (audit v0.70.1 P2-A3).
http2http = ["dep:h2", "dep:http", "dep:bytes", "tls"]
quic = ["frp-core/quic"]
kcp = ["frp-core/kcp", "frp-core/stun"]
websocket = ["frp-core/websocket"]
oidc = ["frp-core/oidc"]
vnet = ["frp-core/vnet", "frp-core/stun", "dep:frp-vnet"]
compression = ["frp-core/compression"]
chacha20 = ["frp-core/chacha20"]
tcp-mux = ["frp-core/tcp-mux"]
mem-profile = ["frp-core/mem-profile"]
profiling = ["frp-core/profiling"]
