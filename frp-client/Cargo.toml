[package]
name = "frp-client"
version = "0.3.1"
edition = "2021"

[dev-dependencies]
frp-server = { path = "../frp-server" }
tracing-subscriber.workspace = true
md-5.workspace = true

[dependencies]
frp-core = { path = "../frp-core", default-features = false }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
axum.workspace = true
toml.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rand.workspace = true

[features]
default = ["quic", "kcp", "websocket", "oidc"]
quic = ["frp-core/quic"]
kcp = ["frp-core/kcp"]
websocket = ["frp-core/websocket"]
oidc = ["frp-core/oidc"]
