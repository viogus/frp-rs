[package]
name = "frp-client"
version = "0.3.1"
edition = "2021"

[dev-dependencies]
frp-server = { path = "../frp-server" }
tracing-subscriber.workspace = true
md-5.workspace = true

[dependencies]
frp-core = { path = "../frp-core", default-features = false }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
axum.workspace = true
toml.workspace = true
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rand.workspace = true

[features]
default = ["tls", "quic", "kcp", "websocket", "oidc"]
tls = ["frp-core/tls", "dep:rustls", "dep:tokio-rustls"]
quic = ["frp-core/quic"]
kcp = ["frp-core/kcp"]
websocket = ["frp-core/websocket"]
oidc = ["frp-core/oidc"]
