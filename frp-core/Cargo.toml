chacha20poly1305.workspace = true

[features]
default = ["quic", "kcp", "websocket", "oidc"]
quic = ["dep:quinn"]
kcp = ["dep:kcp"]
websocket = ["dep:tokio-tungstenite"]
oidc = ["dep:jsonwebtoken"]


[dev-dependencies]
tower = "0.5"
