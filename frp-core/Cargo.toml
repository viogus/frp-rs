[package]
name = "frp-core"
version = "0.7.1"
edition = "2021"
license = "MIT"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
bpaf.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "registry"] }
tracing-appender.workspace = true
thiserror.workspace = true
async-trait.workspace = true
axum = { workspace = true, optional = true }
uuid.workspace = true
tokio-tungstenite = { workspace = true, optional = true }
sha1.workspace = true
md-5.workspace = true
data-encoding.workspace = true
aes.workspace = true
cfb-mode.workspace = true
pbkdf2.workspace = true
snap = { workspace = true, optional = true }
rand.workspace = true
futures-util.workspace = true
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
ring = { workspace = true }
yamux = { workspace = true, optional = true }
tokio-util.workspace = true
quinn = { workspace = true, optional = true }

socket2.workspace = true
jsonwebtoken = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-rustls = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
rcgen = { version = "0.13", optional = true, default-features = false, features = ["ring"] }
pprof = { workspace = true, optional = true }
opentelemetry = { version = "0.27", optional = true, default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.27", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", optional = true, features = ["http-proto"] }
tracing-opentelemetry = { version = "0.28", optional = true }
[features]
default = ["kcp", "quic", "websocket", "oidc", "tls", "compression", "chacha20", "vnet", "tcp-mux"]
tcp-mux = ["dep:yamux"]
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-platform-verifier", "dep:rcgen"]
admin-auth = ["dep:axum"]
compression = ["dep:snap"]
chacha20 = ["dep:chacha20poly1305"]
quic = ["dep:quinn", "tls"]
kcp = []
websocket = ["dep:tokio-tungstenite"]
oidc = ["dep:jsonwebtoken", "http-client"]
vnet = []
mem-profile = []
profiling = ["dep:pprof"]
debug-logs = []
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
http-client = ["dep:hyper", "dep:hyper-rustls", "dep:hyper-util", "dep:http-body-util", "dep:webpki-roots", "dep:rustls-pemfile", "dep:rustls", "dep:bytes", "dep:http"]

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = "0.5"
criterion.workspace = true
proptest = "1.6"
tempfile = "3"

[[bench]]
name = "crypto_bridge"
harness = false
