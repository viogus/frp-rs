[package]
name = "frp-core"
version = "0.71.1"
edition = "2021"
license = "MIT"
description = "Shared protocol, transport and configuration library for frp-rs"
repository = "https://github.com/viogus/frp-rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
# YAML config support. The full justification (why a YAML parser is needed, the
# rejected alternatives with their measured cost, and the lock delta) is recorded
# at the workspace dependency, `[workspace.dependencies].yaml-rust2`.
#
# Non-optional because config loading is compiled into both frps and frpc, so
# every release tier carries it. Measured on this host (macOS arm64, rustc 1.98.0,
# the declared release profile: fat LTO, opt-level=z, strip=symbols,
# panic=abort) against the pre-migration baseline at `1357b7dc`
# (frps 5,428,304 B / frpc 4,428,432 B): frps 5,411,568 B and frpc 4,411,648 B,
# i.e. -16,736 B (-0.308 %) and -16,784 B (-0.379 %). The swap is therefore
# size-neutral-or-smaller, not the ~+250 KB the previous YAML dependency cost.
yaml-rust2.workspace = true
bpaf.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["registry", "json"] }
tracing-appender.workspace = true
thiserror.workspace = true
async-trait.workspace = true
axum = { workspace = true, optional = true }
uuid.workspace = true
sha1.workspace = true
md-5.workspace = true
aes.workspace = true
cfb-mode.workspace = true
pbkdf2.workspace = true
snap = { workspace = true, optional = true }
rand.workspace = true
futures-util.workspace = true
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
ring = { workspace = true }
yamux = { workspace = true, optional = true }
tokio-util.workspace = true
crossbeam-queue.workspace = true
quinn = { workspace = true, optional = true }

socket2.workspace = true
jsonwebtoken = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true, features = ["full"] }
webpki-roots = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
rcgen = { version = "0.14", optional = true, default-features = false, features = ["ring"] }
pprof = { workspace = true, optional = true }
opentelemetry = { version = "0.33", optional = true, default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", optional = true, default-features = false, features = ["trace", "rt-tokio"] }
# `hyper-client` is required: in 0.33 `http-proto` no longer implies an HTTP
# client (0.27 pulled reqwest through it). The hyper backend reuses the
# hyper/hyper-util/http-body-util/tokio crates already in the tree — no
# reqwest (and no aws-lc-rs) enters the otel build.
opentelemetry-otlp = { version = "0.33", optional = true, default-features = false, features = ["http-proto", "hyper-client"] }
tracing-opentelemetry = { version = "0.34", optional = true, default-features = false }
[features]
default = ["kcp", "quic", "websocket", "oidc", "tls", "compression", "chacha20", "vnet", "tcp-mux", "stun"]
tcp-mux = ["dep:yamux"]
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-platform-verifier", "dep:rcgen"]
admin-auth = ["dep:axum"]
compression = ["dep:snap"]
chacha20 = ["dep:chacha20poly1305"]
quic = ["dep:quinn", "tls"]
kcp = []
# WebSocket transport: manual RFC 6455 frame handling only (the
# tungstenite variant was removed 2026-08-09 — it had no callers).
websocket = []
oidc = ["dep:jsonwebtoken", "http-client"]
vnet = []
# STUN binding helpers (`stun.rs`): client-only NAT traversal (XTCP/STCP),
# ~900 lines never linked into frp-server. Default on so existing builds are
# unchanged; frp-client forwards `frp-core/stun` from its `kcp`/`vnet`
# features so XTCP builds keep it, while micro/tiny (`--no-default-features`)
# builds drop it.
stun = []
mem-profile = []
profiling = ["dep:pprof"]
debug-logs = []
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
http-client = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:webpki-roots", "dep:rustls", "dep:tokio-rustls", "dep:tower-service", "dep:bytes", "dep:http"]

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = "0.5"
criterion = "0.8"
proptest = "1.6"
tempfile = "3"

[[bench]]
name = "crypto_bridge"
harness = false
