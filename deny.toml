# cargo-deny configuration for frp-rs
# Run: cargo deny --all-features check

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
# All prior ignores retired:
# - RUSTSEC-2024-0449 (unsafe-libyaml via serde_yaml_ng) → yaml-rust2 0.13
# - RUSTSEC-2023-0071 (rsa via vendored russh) → russh 0.65.4 / rsa 0.10.0
# - RUSTSEC-2026-0194/0195 (quick-xml via pprof/inferno 0.11) → dropped `flamegraph` feature in favor of `frp-core/src/profiling.rs` SVG renderer
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
exceptions = [
    # ring: ISC-style with OpenSSL exception for BoringSSL-derived code
    { name = "ring", allow = ["ISC", "OpenSSL"] },
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    "aws-lc-rs",
    "aws-lc-sys",
    "hickory-resolver",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
