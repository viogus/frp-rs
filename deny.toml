# cargo-deny configuration for frp-rs
# Run: cargo deny check

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
ignore = [
    # rsa 0.10.0-rc.18: Marvin Attack timing sidechannel (RUSTSEC-2023-0071)
    # No fixed version available. Dependency chain: russh → ssh-key → rsa.
    # Medium severity (5.9). russh upgrade to stable rsa blocked on ecosystem.
    "RUSTSEC-2023-0071",
    # rustls-pemfile is unmaintained (RUSTSEC-2025-0134)
    # Pending migration to rustls-pki-types::pem::PemObject.
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
exceptions = [
    # ring: ISC-style with OpenSSL exception for BoringSSL-derived code
    { name = "ring", allow = ["ISC", "OpenSSL"] },
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    "aws-lc-rs",
    "aws-lc-sys",
    "hickory-resolver",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
