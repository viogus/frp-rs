name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/*.rs'
      - '**/*.c'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - frps
          - frpc

    steps:
      - uses: actions/checkout@v4

      - name: Determine tags and version
        id: meta
        run: |
          OWNER="${{ github.repository_owner }}"
          # Lowercase the owner for Docker image names (GitHub may have uppercase)
          OWNER_LOWER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${OWNER_LOWER}/${{ matrix.component }}"

          if [ "${{ github.event_name }}" = "release" ]; then
            # Release: tag with version (e.g. v0.1.4) and update latest
            VER="${{ github.event.release.tag_name }}"
            echo "version=${VER}" >> $GITHUB_OUTPUT
            echo "tags=${IMAGE}:${VER},${IMAGE}:latest" >> $GITHUB_OUTPUT
          else
            # Push / manual: tag as test
            echo "version=test" >> $GITHUB_OUTPUT
            echo "tags=${IMAGE}:test" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.source
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            FRP_COMPONENT=${{ matrix.component }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
