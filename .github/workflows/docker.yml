name: Docker

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  # release:published kept as fallback — but GITHUB_TOKEN-created
  # releases don't chain-trigger other workflows, so we also listen
  # on tag pushes above.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.6). Leave empty for test.'
        required: false
        default: ''

# Use write-all for GITHUB_TOKEN — workaround for GHCR push from
# user-owned repos where packages:write alone may not permit first-time
# package creation under the user namespace.
permissions: write-all

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - frps
          - frpc

    steps:
      - uses: actions/checkout@v4

      - name: Determine tags and version
        id: meta
        run: |
          OWNER="${{ github.repository_owner }}"
          # Lowercase the owner for Docker image names (GitHub may have uppercase)
          OWNER_LOWER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${OWNER_LOWER}/${{ matrix.component }}-rs"
          SHA="$(git rev-parse --short=7 HEAD)"

          if [ "${{ github.event_name }}" = "release" ]; then
            # Release published: tag with version (e.g. v0.1.4), SHA, and update latest
            VER="${{ github.event.release.tag_name }}"
            echo "version=${VER}" >> $GITHUB_OUTPUT
            echo "tags=${IMAGE}:${VER},${IMAGE}:${VER}-${SHA},${IMAGE}:latest" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            # Tag push (e.g. v0.1.6): same as release — GITHUB_TOKEN-created
            # releases don't chain-trigger workflows, so we also listen on tags.
            VER="${{ github.ref_name }}"
            echo "version=${VER}" >> $GITHUB_OUTPUT
            echo "tags=${IMAGE}:${VER},${IMAGE}:${VER}-${SHA},${IMAGE}:latest" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.version }}" ]; then
            # Manual dispatch with explicit version (e.g. backfill missing release)
            VER="${{ inputs.version }}"
            echo "version=${VER}" >> $GITHUB_OUTPUT
            echo "tags=${IMAGE}:${VER},${IMAGE}:${VER}-${SHA},${IMAGE}:latest" >> $GITHUB_OUTPUT
          else
            # Push / manual: tag as test-SHA
            echo "version=test" >> $GITHUB_OUTPUT
            echo "tags=${IMAGE}:test,${IMAGE}:${SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.source
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            FRP_COMPONENT=${{ matrix.component }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
