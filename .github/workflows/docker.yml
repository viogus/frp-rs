name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/*.rs'
      - '**/*.c'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        default: 'source'
        type: choice
        options:
          - source
          - release
      version:
        description: 'Version to build (release mode only, e.g. 0.1.4)'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component:
          - frps
          - frpc

    steps:
      - uses: actions/checkout@v4

      - name: Determine mode and version
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "mode=release" >> $GITHUB_OUTPUT
            TAG="${{ github.event.release.tag_name }}"
            VER="${TAG#v}"
            echo "version=$VER" >> $GITHUB_OUTPUT
            echo "dockerfile=docker/Dockerfile" >> $GITHUB_OUTPUT
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.mode }}" = "release" ]; then
            echo "mode=release" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "dockerfile=docker/Dockerfile" >> $GITHUB_OUTPUT
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          else
            echo "mode=source" >> $GITHUB_OUTPUT
            echo "version=test" >> $GITHUB_OUTPUT
            echo "dockerfile=docker/Dockerfile.source" >> $GITHUB_OUTPUT
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.component }}-rs
          tags: |
            type=raw,value=latest,enable=${{ steps.mode.outputs.mode == 'release' }}
            type=raw,value=${{ steps.mode.outputs.version }},enable=${{ steps.mode.outputs.mode == 'release' }}
            type=raw,value=test,enable=${{ steps.mode.outputs.mode == 'source' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.mode.outputs.dockerfile }}
          platforms: ${{ steps.mode.outputs.platforms }}
          build-args: |
            FRP_VERSION=${{ steps.mode.outputs.version }}
            FRP_COMPONENT=${{ matrix.component }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          provenance: false
