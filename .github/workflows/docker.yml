name: Docker

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened]
  # release:published kept as fallback — but GITHUB_TOKEN-created
  # releases don't chain-trigger other workflows, so we also listen
  # on tag pushes above.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.6). Leave empty for test.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - frps
          - frpc
          - frps-tiny
          - frpc-tiny
          - frps-micro
          - frpc-micro

    steps:
      - uses: actions/checkout@v4

      - name: Determine tags and version
        id: meta
        run: |
          OWNER="${{ github.repository_owner }}"
          # Lowercase the owner for Docker image names (GitHub may have uppercase)
          OWNER_LOWER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHA="$(git rev-parse --short=7 HEAD)"

          # Parse component: frps-tiny → base=frps, variant=-tiny; frps → base=frps, variant=""
          COMPONENT="${{ matrix.component }}"
          if [[ "${COMPONENT}" == *-* ]]; then
            BASE="${COMPONENT%-*}"
            SUFFIX="$(echo "${COMPONENT}" | sed 's/^[^-]*-//')"   # frps-tiny → tiny, frps-micro → micro
            VARIANT="-${SUFFIX}"
          else
            BASE="${COMPONENT}"
            VARIANT=""
          fi
          IMAGE="${REGISTRY}/${OWNER_LOWER}/${BASE}-rs"

          # Derive Cargo feature flags
          case "${COMPONENT}" in
            frps|frpc)           FEATURES="" ;;
            frps-tiny|frpc-tiny) FEATURES="--no-default-features --features tiny" ;;
            frps-micro|frpc-micro) FEATURES="--no-default-features --features micro" ;;
          esac
          echo "features=${FEATURES}" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "release" ]; then
            # Release published: tag with version (e.g. v0.1.4), SHA, and update latest
            VER="${{ github.event.release.tag_name }}"
            echo "version=${VER}" >> $GITHUB_OUTPUT
            if [ -z "${VARIANT}" ]; then
              echo "tags=${IMAGE}:${VER},${IMAGE}:${VER}-${SHA},${IMAGE}:latest" >> $GITHUB_OUTPUT
            else
              echo "tags=${IMAGE}:${VER}${VARIANT},${IMAGE}:${VER}-${SHA}${VARIANT}" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            # Tag push (e.g. v0.1.6): same as release — GITHUB_TOKEN-created
            # releases don't chain-trigger workflows, so we also listen on tags.
            VER="${{ github.ref_name }}"
            echo "version=${VER}" >> $GITHUB_OUTPUT
            if [ -z "${VARIANT}" ]; then
              echo "tags=${IMAGE}:${VER},${IMAGE}:${VER}-${SHA},${IMAGE}:latest" >> $GITHUB_OUTPUT
            else
              echo "tags=${IMAGE}:${VER}${VARIANT},${IMAGE}:${VER}-${SHA}${VARIANT}" >> $GITHUB_OUTPUT
            fi
          elif [ -n "${{ inputs.version }}" ]; then
            # Manual dispatch with explicit version (e.g. backfill missing release)
            VER="${{ inputs.version }}"
            echo "version=${VER}" >> $GITHUB_OUTPUT
            if [ -z "${VARIANT}" ]; then
              echo "tags=${IMAGE}:${VER},${IMAGE}:${VER}-${SHA},${IMAGE}:latest" >> $GITHUB_OUTPUT
            else
              echo "tags=${IMAGE}:${VER}${VARIANT},${IMAGE}:${VER}-${SHA}${VARIANT}" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            echo "version=pr-${PR_NUM}" >> $GITHUB_OUTPUT
            if [ -z "${VARIANT}" ]; then
              echo "tags=${IMAGE}:pr-${PR_NUM},${IMAGE}:pr-${PR_NUM}-${SHA},${IMAGE}:pr" >> $GITHUB_OUTPUT
            else
              echo "tags=${IMAGE}:pr-${PR_NUM}${VARIANT},${IMAGE}:pr-${PR_NUM}-${SHA}${VARIANT},${IMAGE}:pr${VARIANT}" >> $GITHUB_OUTPUT
            fi
          else
            # Push / manual: tag as test-SHA
            echo "version=test" >> $GITHUB_OUTPUT
            if [ -z "${VARIANT}" ]; then
              echo "tags=${IMAGE}:test,${IMAGE}:${SHA}" >> $GITHUB_OUTPUT
            else
              echo "tags=${IMAGE}:test${VARIANT},${IMAGE}:${SHA}${VARIANT}" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.source
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            FRP_COMPONENT=${{ matrix.component }}
            FRP_FEATURES=${{ steps.meta.outputs.features }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          provenance: false
          cache-from: type=gha
