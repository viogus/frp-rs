      FRPC_TINY_CLI_TESTS: "24"
      # frpc/tests/cli_inputs.rs under `--features admin` — "Run frpc's CLI-input
      # tests with the admin feature". The `admin` flag changes the linked
      # client: the child binds its `[webServer]` and announces it
      # (`frp-client/src/service.rs:4414`), which is what made the pre-fix
      # assertion in `a_config_file_named_after_a_subcommand_stays_a_config_file`
