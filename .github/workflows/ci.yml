      # 15 → 17 with the corrected narrowing: +2
      # (`typed_camelcase_v1_root_ini_sections_verify_as_proxies`,
      # `bogus_type_on_a_camelcase_legacy_proxy_is_refused`) — the mirror-image
      # rows for a *typed* camelCase v1-root header, both un-gated.
      # 17 → 18 with the pin for the exclusion clause itself: +1
      # (`typeless_ini_visitor_is_refused_like_go` — a typeless `role = "visitor"`
      # section, port-carrying and portless, un-gated; rewritten in place from
