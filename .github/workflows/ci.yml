      - name: A/B gate — measurable-delta classifier + verdict fixture checks
        # TODO.md:11697 ("The A/B throughput gate fires on changes with no
        # runtime code, so a red gate on `main` is not evidence of a
        # regression"). This step pins the suite that guards the delta
        # classifier and the gate arithmetic, AND the three files that suite
        # drives at runtime: the classifier, the gate arithmetic, and the
        # remote transport that carries the two gate switches to the VPS. An
        # edit to any one of them alone could stub the behaviour while the
        # suite stayed byte-identical, so weakening one is a two-file change a
        # reviewer sees. ab-remote.sh is hashed AND witnessed: ssh forwards no
        # environment, so a deleted splice would silently disable the enforce
        # re-arm, which is why the suite runs it against a stub `ssh` and then
        # REPLAYS the recorded remote command in front of a stub `flock` and a
        # probe harness — the witness is what the harness receives, not what
        # the command text contains, so a trailing `#` comment or an extra ssh
        # argv cannot satisfy it.
        #
        # Why an external count at all: the suite floors its own check count in
        # its EXIT trap, but `exec true` planted before the trap arms exits 0
        # with no output, and a suite that stopped running its scenarios looks
        # exactly like a clean tree. So the summary line is pinned verbatim
        # here, the `  ok` line count is compared for equality with
        # `guard_exact`, and eighteen substantive evidence lines are matched
        # individually. guard_exact/guard_floor are 53: the 12 measured-path
        # class fixtures, the 3 nothing-measurable fixtures, the 3
        # mixed/deletion/rename fixtures, the 4 error-surface fixtures, the 5
        # gate-arithmetic fixtures, the 6 gate-reporting fixtures, the 5
        # measurement-loop fixtures, the 7 remote-transport fixtures and the 8
        # sabotage-converse checks (six mutants, the splice-reason control and
        # the revert proof). A scenario added or removed moves the total —
        # restore the checks rather than lowering it.
        #
        # Residues, named rather than denied: the suite shells out to `git`,
        # `sed`, `cmp`, `tar`, `env` and `python3` from `$PATH`, and runs
        # ab-remote.sh with a stub `ssh` earlier on `$PATH`, so a shim planted
        # by an unpinned in-repo file can answer a probe the way a scenario
        # wants. That is a false negative in a scenario, never a defeated pin:
        # all four subjects are hashed with an absolute, vector-proven hasher
        # before anything runs.
        shell: bash
        run: |
          # One log file per invocation, for the port-ownership step's reason: a
          # fixed path lets a retry truncate the file while the first run is
          # still reading it, which the pinned-count checks would call red.
          log="${TMPDIR:-/tmp}/frp-ab-measurable-delta-fixtures.$$.log"
          status=0
          # The suite honours AB_MD_CLASSIFIER / AB_MD_MATRIX / AB_MD_REMOTE /
          # AB_MD_SABOTAGE_CHILD as seams so its own mutant matrix and accident
          # fixtures can point it at copies. This step must exercise the real
          # tree, so it scrubs them: an ambient value (a workflow `env:`, a
          # caller's export) would otherwise let a surviving mutant or a
          # stand-in file green the step while the pinned subjects are never
          # run (review round 3, F3).
          unset AB_MD_CLASSIFIER AB_MD_MATRIX AB_MD_REMOTE AB_MD_SABOTAGE_CHILD
          guard_file=scripts/tests/ab-measurable-delta.sh
          guard_pin=fe91b55eb27f5555d5e751c6ed4786df1a16d0b3d46de43b55c83e27aaaf67d6
          guard_exact=53
          guard_floor=53
          guard_cls=scripts/ab-measurable-delta.sh
          guard_cls_pin=38e809a68a06dda8b33479be2b31dfaee4f803f1bb8ce5858902ecc368d02640
          guard_matrix=scripts/ab-matrix.sh
          guard_matrix_pin=a9e5020ff9a95dce967170475f6251ce59da694fd5f0e6d5e1147ab051642b6f
          guard_remote=scripts/ab-remote.sh
          guard_remote_pin=6a1ba8c695f9f984e39d28b9decea3b53271f881d25c49726fe06930d5c2559c
          # Every hashed subject must actually be verified, and it must be the
          # subject the pin names. The closing summary used to assert "pins
          # verified 4/4" as a literal, so deleting one verify_guard call kept
          # the step green while that subject went unchecked (review round 2,
          # V3); a count alone still lets a substitute line — another subject's
          # verify_guard, duplicated — report 4/4 while one pinned file is never
          # hashed (review round 3, V1). So verify_guard records the path it
          # hashed and the closing check compares the SET of hashed paths with
          # the four the pins name.
          guard_pins_verified=0
          guard_pins_expected=4
          guard_pins_seen=''
          guard_hasher=''
          guard_abc=ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
          for cand in /usr/bin/sha256sum /bin/sha256sum /sbin/sha256sum /usr/sbin/sha256sum /usr/local/bin/sha256sum; do
            [ -x "$cand" ] || continue
            guard_probe=$(printf 'abc' | "$cand" 2>/dev/null)
            [ "${guard_probe%% *}" = "$guard_abc" ] || continue
            guard_hasher=$cand
            break
          done
          if [ -z "$guard_hasher" ]; then
            for cand in /usr/bin/shasum /bin/shasum /usr/local/bin/shasum; do
              [ -x "$cand" ] || continue
              guard_probe=$(printf 'abc' | "$cand" -a 256 2>/dev/null)
              [ "${guard_probe%% *}" = "$guard_abc" ] || continue
              guard_hasher="$cand -a 256"
              break
            done
          fi
          if [ -z "$guard_hasher" ]; then
            echo "::error::no sha256 tool at an absolute path reproduces the known sha256 vector (need sha256sum or shasum); cannot verify $guard_file"
            exit 1
          fi
          # $1 = file, $2 = its expected digest, $3 = the variable holding that
          # digest (named in the failure message).
          # shellcheck disable=SC2086  # $guard_hasher is the word-split "<abs path> [-a 256]"
          verify_guard() {
            local out sha
            out=$($guard_hasher "$1" 2>/dev/null) || true
            sha=${out%% *}
            if [ "$sha" != "$2" ]; then
              echo "::error::$1 is not the pinned revision (sha256 ${sha:-<none>}; expected $2)"
              echo "::error::an edit to the A/B measurable-delta check — including one that weakens its own assertions — must also update $3 in the 'A/B gate — measurable-delta classifier + verdict fixture checks' step of .github/workflows/ci.yml, so the change is visible to a reviewer; paste the sha256 above if the edit is intended, otherwise revert it"
              return 1
            fi
            guard_pins_verified=$((guard_pins_verified + 1))
            guard_pins_seen="${guard_pins_seen}${1}"$'\n'
            return 0
          }
          verify_guard "$guard_file" "$guard_pin" guard_pin || exit 1
          verify_guard "$guard_cls" "$guard_cls_pin" guard_cls_pin || exit 1
          verify_guard "$guard_matrix" "$guard_matrix_pin" guard_matrix_pin || exit 1
          verify_guard "$guard_remote" "$guard_remote_pin" guard_remote_pin || exit 1
          guard_pins_seen=$(printf '%s' "$guard_pins_seen" | LC_ALL=C sort -u)
          guard_pins_expected_paths=$(printf '%s\n' \
            "$guard_file" "$guard_cls" "$guard_matrix" "$guard_remote" | LC_ALL=C sort -u)
          bash scripts/tests/ab-measurable-delta.sh > "$log" 2>&1 || status=1
          guard_log=$(<"$log")
          printf '%s\n' "$guard_log"
          guard_ok=0
          guard_result=0
          guard_fail=0
          guard_evidence=0
          guard_fail_text=''
          while IFS= read -r guard_line; do
            case $guard_line in
              '  ok '*) guard_ok=$((guard_ok + 1)) ;;
              'FAIL'*|'  FAIL'*)
                guard_fail=$((guard_fail + 1))
                guard_fail_text="${guard_fail_text}${guard_line}"$'\n'
                ;;
            esac
          done <<< "$guard_log"
          case $guard_log in
            *"RESULT: $guard_exact fixture check(s) hold"*) guard_result=1 ;;
          esac
          # The substantive evidence, in the suite's own wording, so a suite that
          # still prints 53 `  ok` lines while no longer witnessing the property
          # cannot pass. The first eight are the sabotage converse (each of the
          # six mutations must turn the child red, the splice deletion must red
          # *for the named reason* while the same tree with an unmutated
          # transport passes, and the mutations must only ever have written
          # copies); the last ten pin the behaviour this round is about — the
          # skip on a docs/records-only delta, the published figure being the
          # median rather than the minimum (both the arithmetic and the real
          # measurement loop that produces it), the informational default with
          # its AB_GATE_ENFORCE re-arm, and the remote transport really handing
          # both switches to the harness (the recorded command is replayed in
          # front of a probe, so a comment or an extra argv cannot satisfy it,
          # while the two accepted rewrites keep the witness from being
          # over-strict).
          guard_evidence_exact=18
          guard_evidence_floor=18
          for guard_evidence_probe in \
            'mutant: classifier forced to always skip -> child red' \
            'mutant: gate_verdict forced to always pass -> child red' \
            'mutant: gate_median forced to min -> child red' \
            'mutant: AB_GATE_ENFORCE path removed -> child red' \
            'mutant: ab-remote.sh enforce/force splice deleted -> child red for the stated reason' \
            'mutant: ab-remote.sh switches deleted, blessed chain left as a comment -> child red for the stated reason' \
            'control: the mutant'"'"'s tree with an unmutated ab-remote.sh passes' \
            'real scripts are byte-identical after the mutant matrix' \
            'classifier: CHANGELOG.md + TODO.md + docs/history/development-log.md -> rc 1, no output' \
            'gate_median(18.0 15.2 19.5) = 18.0 (not the minimum 15.2)' \
            'measure_pair_deltas: 3 samples published as median -25.0, not the minimum -40.0' \
            'gate_report REGRESSED without enforce -> rc 0' \
            'gate_final: FAIL=1 under AB_GATE_ENFORCE=1 -> rc 1 (hard failure restored)' \
            'ab-remote.sh: the replayed run command hands the harness AB_GATE_ENFORCE=1 AB_FORCE_MEASURE=0 and the args 3 8' \
            'ab-remote.sh: unset switches default to AB_GATE_ENFORCE=0 AB_FORCE_MEASURE=0 in the replayed run command (previous behaviour)' \
            'ab-remote.sh: a rewrite that quotes the args still EXECUTES the switches (the witness accepts working code)' \
            'ab-remote.sh: a rewrite that prefixes env still EXECUTES the switches (the witness accepts working code)' \
            'ab-remote.sh: refuses AB_GATE_ENFORCE=2 with rc 2 before shipping anything'
          do
            case $guard_log in
              *"$guard_evidence_probe"*) guard_evidence=$((guard_evidence + 1)) ;;
            esac
          done
          [ "$guard_result" = "1" ] || status=1
          [ "$guard_ok" = "$guard_exact" ] || status=1
          [ "$guard_exact" -ge "$guard_floor" ] || status=1
          [ "$guard_evidence" = "$guard_evidence_exact" ] || status=1
          [ "$guard_evidence_exact" -ge "$guard_evidence_floor" ] || status=1
          [ "$guard_fail" = "0" ] || status=1
          [ "$guard_pins_verified" = "$guard_pins_expected" ] || status=1
          [ "$guard_pins_seen" = "$guard_pins_expected_paths" ] || status=1
          if [ "$guard_fail" != "0" ]; then
            echo "::error::the A/B measurable-delta fixture suite printed $guard_fail failure line(s); a run that reported a failure cannot be reported as a green step:"
            printf '%s' "$guard_fail_text"
          fi
          if [ "$guard_pins_verified" != "$guard_pins_expected" ]; then
            echo "::error::only $guard_pins_verified of $guard_pins_expected guarded files were verified against their pinned sha256 — a verify_guard call is missing from the 'A/B gate — measurable-delta classifier + verdict fixture checks' step of .github/workflows/ci.yml; this step must hash the suite and every file the suite drives"
          fi
          if [ "$guard_pins_seen" != "$guard_pins_expected_paths" ]; then
            echo "::error::the pins were checked against the wrong set of files: a verify_guard call is missing, duplicated or repointed, so a pinned subject was never hashed against its digest"
            echo "::error::hashed: $(printf '%s' "$guard_pins_seen" | tr '\n' ' ')"
            echo "::error::pins name: $(printf '%s' "$guard_pins_expected_paths" | tr '\n' ' ')"
          fi
          if [ "$status" != "0" ]; then
            echo "::error::the A/B measurable-delta fixture suite did not report $guard_exact checks, all $guard_evidence_exact pinned evidence lines, all $guard_pins_expected verified pins (four distinct paths) and no failure line (evidence seen: $guard_evidence/$guard_evidence_exact, pins verified: $guard_pins_verified/$guard_pins_expected)"
            echo "::error::scripts/tests/ab-measurable-delta.sh must print $guard_exact '  ok' lines, end with 'RESULT: $guard_exact fixture check(s) hold', and prove (a) the classifier skips a docs/records-only delta with rc 1 and no output, (b) the published gate figure is the median and never the minimum, (c) a beyond-gate regression is informational by default and exits 1 only under AB_GATE_ENFORCE=1, (d) the recorded remote command is REPLAYED, so the harness must receive AB_GATE_ENFORCE=1 AB_FORCE_MEASURE=0 and the two args — a `#` comment or an extra ssh argv cannot satisfy that witness, while the two accepted rewrites keep it from being over-strict — and (e) each of the six mutants — classifier forced to always skip, verdict forced to always pass, median replaced by the minimum, enforce path removed, the ab-remote.sh enforce/force splice deleted, and the switches deleted with the blessed chain left behind as a `#` comment — turns the suite red for the named reason while the same tree with an unmutated transport passes and the three real scripts stay byte-identical; a smaller total, a missing evidence line or a failure line means the fixture stopped witnessing that property — restore it rather than lowering this literal"
            exit 1
          fi
          echo "A/B measurable-delta fixture checks ok: $guard_exact checks hold, all $guard_evidence_exact evidence lines live, pins verified $guard_pins_verified/$guard_pins_expected"

      - name: Live path:line cites — guard + expectation-table fixture checks
        # The TODO.md item filed at line 10540 ("A `path:line` cite in a live
        # file is not machine-checked, so a change that inserts lines rots every
        # cite into the file it touched"). `scripts/tests/todo-cite-guard.sh`
        # checks only cites of TODO.md lines and `scripts/repo-health.sh` never
        # reads the `:line` suffix, so before this step no job could see the class: one
        # PR's insertions shifted 75 cites into its own six files, and the
        # renumbering that followed moved the repairs themselves.
        #
        # Same shape as the classifier step above: the suite's bytes are pinned
        # before it runs (`guard_pin`), the file the suite drives is pinned
        # beside it (`guard_file`), the guard under test and its expectation
        # table are pinned too, the suite's exact `RESULT:` total and `ok`-line
        # count are compared, an absolute floor sits under them, and any `FAIL`
        # line fails the step.
        #
        # The pins carry the same claim the classifier's `guard_lf_pin` does,
        # twice over: `guard_subject_pin` pins `scripts/tests/pathline-cite-guard.sh`
        # (the thing the fixture suite drives) so a guard whose scan stopped
        # finding cites cannot keep the fixture count, and `guard_data_pin` pins
        # `scripts/tests/pathline-cite-expectations.txt` so a regeneration —
        # which is what `--write` does, and what laundering a rotten cite looks
        # like — is a two-file change a reviewer sees. Every one of the four
        # pinned files therefore reds this step when edited alone.
        #
        # The canary is the fixture suite's M1 witness, the falsification the
        # item asks for: `witness M1: one-line insert reddened notes.md:1` is
        # printed only by a run that actually mutated a synthetic tree, watched
        # the guard name the citing file:line, and read the fingerprint reason
        # back. Its absence means the mutation scenarios were skipped or their
        # verdicts neutered, even if the total looks intact.
        #
        # The sabotage converse is the real guard run against the real tree: its
        # `RESULT:` line must carry exactly `guard_cites` checked cites with
        # `0 violation(s)` (a floor under `guard_cites` rejects a shrunken
        # inventory), and a second run against an expectation table stripped to
        # its header must *fail* — a table with no record must never read as a
        # clean tree. Builtins only on the read-back paths, for the round-14
        # reason the sibling steps record.
        shell: bash
        run: |
          set -o pipefail
          log=/tmp/frp-pathline-cite-fixtures.log
          real_log=/tmp/frp-pathline-cite.log
          sabotage_table=/tmp/frp-pathline-cite-sabotage.txt
          status=0
          guard_file=scripts/tests/pathline-cite-fixtures.sh
          guard_pin=e5a08315caa259e8bcc01030a631e966dde108528eedb12e2b0a675193f968ee
          guard_subject=scripts/tests/pathline-cite-guard.sh
          guard_subject_pin=dfd3d7399f48bce9189b8c40b51a856d035e54e2a529a44010798b542ce04220
          guard_data_file=scripts/tests/pathline-cite-expectations.txt
          guard_data_pin=f95685384b14bcb9f115e1491365b0b349ff1a99014e62d9a1044b5c23e4748b
          guard_exact=86
          guard_floor=86
          guard_canary='witness M1: one-line insert reddened notes.md:1'
          # The measured live inventory at this head and a floor under it, the
          # `guard_cites`/`guard_cites_floor` pair the TODO.md citation step
          # uses: a *falling* count has to move both literals.
          guard_cites=580
          guard_cites_floor=580
          guard_hasher=''
          guard_abc=ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
          for cand in /usr/bin/sha256sum /bin/sha256sum /sbin/sha256sum /usr/sbin/sha256sum /usr/local/bin/sha256sum; do
            [ -x "$cand" ] || continue
            guard_probe=$(printf 'abc' | "$cand" 2>/dev/null)
            [ "${guard_probe%% *}" = "$guard_abc" ] || continue
            guard_hasher=$cand
            break
          done
          if [ -z "$guard_hasher" ]; then
            for cand in /usr/bin/shasum /bin/shasum /usr/local/bin/shasum; do
              [ -x "$cand" ] || continue
              guard_probe=$(printf 'abc' | "$cand" -a 256 2>/dev/null)
              [ "${guard_probe%% *}" = "$guard_abc" ] || continue
              guard_hasher="$cand -a 256"
              break
            done
          fi
          if [ -z "$guard_hasher" ]; then
            echo "::error::no sha256 tool at an absolute path reproduces the known sha256 vector; cannot verify $guard_file"
            exit 1
          fi
          # shellcheck disable=SC2086  # $guard_hasher is the word-split "<abs path> [-a 256]"
          verify_guard() {
            local out sha
            out=$($guard_hasher "$1" 2>/dev/null) || true
            sha=${out%% *}
            if [ "$sha" != "$2" ]; then
              echo "::error::$1 is not the pinned revision (sha256 ${sha:-<none>}; expected $2)"
              echo "::error::an edit to $1 — including one that weakens the cite guard or re-bakes its expectations — must also update $3 in the 'Live path:line cites — guard + expectation-table fixture checks' step of .github/workflows/ci.yml, so the change is visible to a reviewer; paste the sha256 above if the edit is intended, otherwise revert it"
              return 1
            fi
            return 0
          }
          verify_guard "$guard_file" "$guard_pin" guard_pin || status=1
          verify_guard "$guard_subject" "$guard_subject_pin" guard_subject_pin || status=1
          verify_guard "$guard_data_file" "$guard_data_pin" guard_data_pin || status=1
          [ "$status" = "0" ] || exit 1
          bash "$guard_file" > "$log" 2>&1 || status=1
          guard_log=$(<"$log")
          printf '%s\n' "$guard_log"
          guard_ok=0
          guard_result=0
          guard_canary_hit=0
          guard_fail=0
          guard_fail_text=''
          while IFS= read -r guard_line; do
            case $guard_line in
              '  ok '*) guard_ok=$((guard_ok + 1)) ;;
              'FAIL'*|'  FAIL'*)
                guard_fail=$((guard_fail + 1))
                guard_fail_text="${guard_fail_text}${guard_line}"$'\n'
                ;;
            esac
            if [ "$guard_line" = "$guard_canary" ]; then
              guard_canary_hit=1
            fi
          done <<< "$guard_log"
          case $guard_log in
            *"RESULT: $guard_exact fixture check(s) hold"*) guard_result=1 ;;
          esac
          [ "$guard_result" = "1" ] || status=1
          [ "$guard_ok" = "$guard_exact" ] || status=1
          [ "$guard_exact" -ge "$guard_floor" ] || status=1
          [ "$guard_canary_hit" = "1" ] || status=1
          [ "$guard_fail" = "0" ] || status=1
          # The real guard against the real tree: the inventory is pinned, and
          # the run must be clean.
          bash "$guard_subject" > "$real_log" 2>&1 || status=1
          guard_real=$(<"$real_log")
          printf '%s\n' "$guard_real"
          guard_real_result=0
          guard_real_fail=0
          while IFS= read -r guard_line; do
            case $guard_line in
              'FAIL'*|'  FAIL'*) guard_real_fail=$((guard_real_fail + 1)) ;;
            esac
          done <<< "$guard_real"
          case $guard_real in
            *"RESULT: $guard_cites cite(s) checked, 0 violation(s)"*) guard_real_result=1 ;;
          esac
          [ "$guard_real_result" = "1" ] || status=1
          [ "$guard_real_fail" = "0" ] || status=1
          [ "$guard_cites" -ge "$guard_cites_floor" ] || status=1
          # Sabotage converse: an expectation table with no record must never
          # read as a clean tree (builtins only — no grep on this path).
          : > "$sabotage_table"
          while IFS= read -r guard_line; do
            case $guard_line in
              '#'*) printf '%s\n' "$guard_line" >> "$sabotage_table" ;;
            esac
          done < "$guard_data_file"
          if bash "$guard_subject" "$PWD" "$sabotage_table" > /dev/null 2>&1; then
            echo "::error::sabotage converse failed: scripts/tests/pathline-cite-guard.sh certified a tree whose expectation table carries no record"
            status=1
          fi
          if [ "$guard_canary_hit" != "1" ]; then
            echo "::error::the cite guard suite did not print its M1 witness ('$guard_canary'); its one-line-insert mutation did not run, or the guard no longer reds on a moved cite"
          fi
          if [ "$guard_fail" != "0" ]; then
            echo "::error::the cite guard fixture suite printed $guard_fail failure line(s); a run that reported a failure cannot be reported as a green step:"
            printf '%s' "$guard_fail_text"
          fi
          if [ "$status" != "0" ]; then
            echo "::error::the cite guard fixture did not report $guard_exact checks, the M1 witness and a clean real-tree run of $guard_cites cites (floor=$guard_floor, exact=$guard_exact, cites=$guard_cites)"
            echo "::error::scripts/tests/pathline-cite-fixtures.sh must print $guard_exact '  ok' lines, end with 'RESULT: $guard_exact fixture check(s) hold', print 'witness M1: one-line insert reddened notes.md:1', and must not print a 'FAIL' line, while scripts/tests/pathline-cite-guard.sh prints 'RESULT: $guard_cites cite(s) checked, 0 violation(s)' on this tree; a smaller total, a missing witness, a failure line, no output at all (an \`exec\`), a regeneration that laundered a rotten cite, or a shrunken live inventory means the guard stopped biting — repair the cites by content and restore the checks rather than lowering these literals"
            exit 1
          fi
          echo "cite guard fixtures ok: $guard_exact checks hold (floor $guard_floor), M1 witness present, guard/table/subject pins verified, real tree $guard_cites cites 0 violations, sabotage converse red"
