      # 13 → 15 with the typeless legacy `.ini` proxy default (Go's `tcp`): +1
      # (`typeless_legacy_ini_proxy_verifies_in_both_modes`), then +1 for the
      # regression it introduced, the phantom-proxy steal of a typeless
      # camelCase `[webServer]`
      # (`typeless_camelcase_web_server_ini_is_not_a_proxy`). Both are plain
