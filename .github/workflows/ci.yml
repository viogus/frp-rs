name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # ---- Check: format + clippy ----
  check:
    name: Check (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show || rustup default stable

      - name: Install clippy
        run: rustup component add clippy rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # ---- Build & test ----
  build:
    name: Build (${{ matrix.os }})
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show || rustup default stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (all targets)
        run: cargo build --all --verbose

      - name: Run tests
        run: cargo test --all --verbose

      - name: Build release
        run: cargo build --release --all --verbose

      - name: Upload release artifacts (non-Windows)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: frp-rs-${{ matrix.target }}
          path: |
            target/release/frps
            target/release/frpc
          retention-days: 7

      - name: Upload release artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: frp-rs-${{ matrix.target }}
          path: |
            target/release/frps.exe
            target/release/frpc.exe
          retention-days: 7

  # ---- Release (triggered by GitHub Release) ----
  release:
    name: Release
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc

      - name: Build for Linux x86_64
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Build for macOS ARM64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build for Windows x86_64
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package release
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/frps dist/frps-linux-amd64
          cp target/x86_64-unknown-linux-gnu/release/frpc dist/frpc-linux-amd64
          cp target/aarch64-apple-darwin/release/frps dist/frps-darwin-arm64
          cp target/aarch64-apple-darwin/release/frpc dist/frpc-darwin-arm64
          cp target/x86_64-pc-windows-msvc/release/frps.exe dist/frps-windows-amd64.exe
          cp target/x86_64-pc-windows-msvc/release/frpc.exe dist/frpc-windows-amd64.exe
          cp frps.toml dist/frps.toml.example
          cp frpc.toml dist/frpc.toml.example

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
