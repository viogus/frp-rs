            echo "::error::an edit to the cite-gate fixture suite must also update guard_pin in the 'TODO.md citation gate — fixture checks (canary)' step of .github/workflows/ci.yml, so the change is visible to a reviewer; paste the sha256 above if the edit is intended, otherwise revert it"
