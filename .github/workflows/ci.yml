          grep -q "Running tests/warn_delivery.rs" "$log.plain" || status=1
          grep -q "test result: ok. 32 passed; 0 failed" "$log.plain" || status=1
          [ "$n" = "32" ] || status=1
          [ "$n" -ge "$n_floor" ] || status=1
          if [ "$status" != "0" ]; then
            echo "::error::frps warning-delivery guard failed (status=$status, file=$n, log=$log)"
            if [ -n "$n" ] && [ "$n" != "32" ]; then
              if [ "$n" -lt "32" ]; then
                echo "::error::frps/tests/warn_delivery.rs lists $n tests, this step expects 32 — tests were deleted or the file was disabled; restore them rather than lowering this literal"
              else
                echo "::error::frps/tests/warn_delivery.rs lists $n tests, this step expects 32: move the single literal in this shell step from 32 to $n"
              fi
