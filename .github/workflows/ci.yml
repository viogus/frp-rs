      # `cargo test -p frps --test cli_exit_codes -- --list`.
      # 43 → 44 with #427's `--vhost-http-timeout` int64 rows split out of
      # `verify_accepts_vhost_http_timeout_both_spellings_and_prints_go_line`
      # into their own `verify_handles_vhost_http_timeout_go_signed_int64_range`:
      # +1, so this count guard can see those rows (it counts test functions, not
      # assertions). Re-derived on this tree with
      # `cargo test -p frps --test cli_exit_codes -- --list`.
      # 44 → 45 with the `-l`-shorthand refusal pin
      # `short_l_is_not_a_frps_shorthand_and_the_refusal_is_pinned`
      # (`TODO.md:8954`): +1. Re-derived with the same `--list` command.
      FRPS_CLI_TESTS: "45"
      # frpc/tests/cli_exit_codes.rs, `--no-default-features --features tiny` —
      # "Run frpc's CLI exit-code tests under `tiny` (tier runtime half)"
      # 11 → 13 with the one `auth.method` policy: +2
      # (`verify_and_run_refuse_a_non_exact_auth_method_like_go`,
      # `empty_auth_method_completes_to_token_on_both_client_paths`). This lane
      # runs `frpc-tiny`, so it is also the only *spawn-level* witness that an
