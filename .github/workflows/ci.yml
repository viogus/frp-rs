          # sibling step.
          n_run=$(sed -n -e 's/^test result: ok\. \([0-9][0-9]*\) passed; 0 failed.*$/\1/p' "$log.plain" | tail -n 1)
          status=0
          grep -q "Running tests/web_server_tls_enable_warning.rs" "$log.plain" || status=1
          grep -q "test result: ok. 6 passed; 0 failed" "$log.plain" || status=1
          [ -n "$n_run" ] || status=1
          [ "$n_run" = "$n" ] || status=1
          [ "$n" = "6" ] || status=1
          [ "$n" -ge "$n_floor" ] || status=1
          [ "$named" = "1" ] || status=1
          # Converse run: see the sibling step. Without it, deleting the
          # witness's own assertion reads as `6 tests listed (expected 6),
          # 0 failed` and exits 0.
          sabotage=/tmp/frp-core-web-server-tls-enable-warning-tests-sabotaged.log
          FRP_WARNING_PIN_SABOTAGE=1 \
            cargo test -p frp-core --test web_server_tls_enable_warning --color never \
            -- --exact "$witness" --nocapture > "$sabotage" 2>&1 || true
          sed -e 's/\x1b\[[0-9;]*m//g' "$sabotage" > "$sabotage.plain"
          sabotaged=$(grep -E -c "^test ${witness} \.\.\. FAILED$" "$sabotage.plain" || true)
          [ "$sabotaged" = "1" ] || status=1
          if [ "$status" != "0" ]; then
            echo "::error::frp-core web-server tls_enable warning guard failed (status=$status, file=$n, run=$n_run, named=$named, log=$log, sabotage=$sabotage)"
            if [ -n "$n" ] && [ "$n" != "6" ]; then
              if [ "$n" -lt "6" ]; then
                echo "::error::frp-core/tests/web_server_tls_enable_warning.rs lists $n tests, this step expects 6 — tests were deleted or the file was disabled; restore them rather than lowering this literal"
              else
                echo "::error::frp-core/tests/web_server_tls_enable_warning.rs lists $n tests, this step expects 6: move the single literal in this shell step from 6 to $n"
              fi
            fi
            if [ -n "$n_run" ] && [ "$n_run" != "$n" ]; then
              echo "::error::frp-core/tests/web_server_tls_enable_warning.rs completed $n_run tests but its -- --list reports $n — a listed test did not run or reported nothing; restore it rather than re-pointing this literal"
            fi
            if [ "$named" != "1" ]; then
              echo "::error::frp-core/tests/web_server_tls_enable_warning.rs does not list ${witness} — the witness pin was renamed, deleted, or cfg'd out; restore it rather than re-pointing this name"
            fi
            if [ "$sabotaged" != "1" ]; then
              echo "::error::the sabotaged run (FRP_WARNING_PIN_SABOTAGE=1) did not fail ${witness} — this pin cannot be made to fail, so a body that deletes its assertions, or returns before them, passes while still reporting $n passed; restore its assertions"
            fi
            cat "$log.plain"
            exit 1
          fi
          echo "frp-core web-server tls_enable warning guard ok: $n tests listed (expected 6, floor 6), $n_run passed, 0 failed, sabotage reds it"
      - name: Run frpc CLI tests (admin address resolution)
        # No lane ran a `cargo test` target of the `frpc` package before this
        # step (`ab-matrix.yml` only *builds* `-p frpc`; the two `--lib` steps —
        # `Run all-features lib tests` (`cargo test --workspace --all-features
        # --lib`) and `Run vnet unit tests` (`cargo test -p frp-server --features
        # vnet --lib`) — restrict to lib targets, and `frpc` has no lib). The
        # package's tests were therefore compiled by the
        # `Lint` lane (`cargo clippy --workspace --all-targets --all-features`,
        # which satisfies the bin's `required-features = ["full"]`) and executed
        # by nothing. That mattered: `frpc/src/main.rs`'s inline unit tests
        # pinned the old `127.0.0.1:7400` fallback that let
        # `frpc reload`/`status` silently ignore a config that fails to load.
        # This step executes them (8 unit tests — `cargo test -p frpc --bin frpc
        # -- --list`) plus the package's 8 integration files (103 tests —
        # `cargo test -p frpc -- --list`), which spawn the `frpc` binary with
        # crafted configs. It used to name `frpc/tests/admin_cli.rs`'s 25 tests
        # as "a snapshot figure, since no lane counts that file and nothing
        # reddens when it moves"; the step now counts the whole package
        # (`env.FRPC_CLI_TESTS`, floor `env.FRPC_CLI_TESTS_FLOOR`) and requires a
        # `Running …` witness for each of the 9 targets, so a deleted file or a
        # lowered literal both red.
        #
        # What the `TcpListener` oracle does and does not prove. The listener is
        # bound to a port that is then written into the bad config's
        # `webServer.port`, so it covers *that* port only and cannot observe the
        # historical `127.0.0.1:7400` fallback by itself. Measured with a second
        # listener on 7400: the pre-fix binary leaves **0** connections on the
        # config's port and **1** on 7400; this branch's binary leaves 0 on
        # both. What catches a 7400 fallback is the output assertion, and it
        # takes two shapes: the two `*_port_zero_*` tests compare stdout exactly
        # (`assert_eq!(stdout.trim_end(), GO_NO_PORT_MSG)`), while the
        # load-error tests check a stdout substring
        # (`stdout_of(&out).contains("unknown field \"notAKnownFrpKey\"")`, e.g.
        # `frpc/tests/admin_cli.rs:278`; also `:310`, `:521`, `:663`) plus a
        # stderr check that no `connect` was attempted. Pre-fix those fail with
        # empty stdout and stderr
        # `reload failed: connect 127.0.0.1:7400: Connection refused (os error
        # 61)`. Measured against `main` @ `9c1b291`'s frpc, **9 of the 14 fail**
        # (5 passed; 9 failed), and 14/14 pass against this branch's binary.
        #
        # It belongs to the unit lane: the tests need no `frps`, and
        # `cargo test` builds the default-feature `frpc` bin they resolve via
        # `CARGO_BIN_EXE_frpc`. It sits immediately *before* the `frp-client`
        # no-features step on purpose: that step is documented-flaky on this
        # host (see its own comment), and with no `if: always()` a red run of it
        # would silently skip this one — the "compiled but never executed"
        # failure this step exists to fix. `frpc/tests/admin_cli.rs` is
        # `#![cfg(feature = "full")]`-gated for the no-default-features lanes
        # (`cargo test -p frpc --no-default-features` compiles it to 0 tests).
        #
        # Measured warm, macOS arm64: `cargo test -p frpc` 1.6 s wall (8 unit
        # tests in 0.00 s + 14 spawn-based tests in ~1.4 s, each waiting out a
        # 300 ms post-exit oracle window); `--no-default-features` 11.1 s from a
        # cold no-feature graph, with the integration file compiled to 0 tests.
        # The runner was not measured.
        #
        # The count guard (the reason this is no longer a one-line `run:`). The
        # lane ran `cargo test -p frpc` and asserted nothing about what it ran:
        # `cargo test` exits 0 when a target compiles to 0 tests, so deleting
        # `frpc/tests/warn_delivery.rs`, or gating any of the 8 files behind a
        # false `#[cfg]`, left the lane green. Three independent pins close
        # that: the `-- --list` total, the *sum* of the per-target
        # `test result: ok. N passed; 0 failed` lines (a target that ran nothing
        # prints `0 passed`, so a partial execution cannot pass the sum even
        # when the list count matches), and one `Running …` witness per target.
        # `env.FRPC_CLI_TESTS` is the declared total and
        # `env.FRPC_CLI_TESTS_FLOOR` the independent floor, so a test deleted
        # together with the literal still reds until both are moved in one
        # deliberate records edit.
        shell: bash
        run: |
          set -eo pipefail
          case "${FRPC_CLI_TESTS_FLOOR}" in
            ''|*[!0-9]*)
              echo "::error::frpc CLI-lane guard: env.FRPC_CLI_TESTS_FLOOR must be a non-negative integer (got '${FRPC_CLI_TESTS_FLOOR}')"
              exit 1
              ;;
          esac
          case "$FRPC_CLI_TESTS" in
            ''|*[!0-9]*)
              echo "::error::frpc CLI-lane guard: env.FRPC_CLI_TESTS must be a non-negative integer (got '$FRPC_CLI_TESTS')"
              exit 1
              ;;
          esac
          log=/tmp/frpc-cli-tests.log
          run_status=0
          cargo test -p frpc --color never 2>&1 | tee "$log" || run_status=$?
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"
          n=$(cargo test -p frpc --color never -- --list 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' | grep -E -c '^[^ ].*: test$' || true)
          log_n=$(grep -E -o 'test result: ok\. [0-9]+ passed; 0 failed' "$log.plain" | awk '{s += $4} END {print s + 0}' || true)
          witness_missing=""
          for witness in \
            "Running unittests src/main.rs" \
            "Running tests/admin_cli.rs" \
            "Running tests/admin_config_get_warning.rs" \
            "Running tests/cli_exit_codes.rs" \
            "Running tests/cli_inputs.rs" \
            "Running tests/cli_persistent_flags.rs" \
            "Running tests/legacy_ini_fixture.rs" \
            "Running tests/log_completion.rs" \
            "Running tests/warn_delivery.rs"
          do
            grep -q -F "$witness" "$log.plain" || witness_missing="$witness_missing [$witness]"
          done
          status=0
          [ "$run_status" = "0" ] || status=1
          [ -z "$witness_missing" ] || status=1
          [ "$n" = "$FRPC_CLI_TESTS" ] || status=1
          [ "$log_n" = "$FRPC_CLI_TESTS" ] || status=1
          [ "$FRPC_CLI_TESTS" -ge "$FRPC_CLI_TESTS_FLOOR" ] || status=1
          if [ "$status" != "0" ]; then
            echo "::error::frpc CLI-lane guard failed (status=$status, cargo=$run_status, env=$FRPC_CLI_TESTS, listed=$n, ran=$log_n, log=$log)"
            if [ -n "$witness_missing" ]; then
              echo "::error::frpc CLI-lane guard: the run printed no 'Running' line for$witness_missing — that target did not execute, so nothing in it can red. A missing target means the file was deleted, renamed, or compiled out by a false #[cfg]; restore it rather than moving the literal."
            fi
            if [ "$FRPC_CLI_TESTS" -lt "$FRPC_CLI_TESTS_FLOOR" ]; then
              echo "::error::env.FRPC_CLI_TESTS is $FRPC_CLI_TESTS, below the absolute floor env.FRPC_CLI_TESTS_FLOOR=$FRPC_CLI_TESTS_FLOOR — a count literal lowered to match a deleted test is the exact edit this floor exists to stop. Restore the test; if the removal is intended, record it in TODO.md and lower *both* literals in the same edit, because either one alone leaves this guard red."
            fi
            if [ -n "$log_n" ] && [ "$n" = "$FRPC_CLI_TESTS" ] && [ "$log_n" != "$n" ]; then
              echo "::error::the frpc package lists $n tests but the run executed $log_n — at least one target compiled to 0 tests (a false #[cfg]) or did not run to completion; restore the target or its gate rather than moving the literal"
            fi
            if [ "$n" = "$log_n" ] && [ "$n" != "$FRPC_CLI_TESTS" ]; then
              if [ "$n" -gt "$FRPC_CLI_TESTS" ]; then
                echo "::error::the frpc package lists $n tests, env.FRPC_CLI_TESTS is $FRPC_CLI_TESTS: move env.FRPC_CLI_TESTS on the tests-unit job in .github/workflows/ci.yml from $FRPC_CLI_TESTS to $n. The floor stays where it is when the count rises — only a literal that FALLS has to move both."
              else
                echo "::error::the frpc package lists $n tests, env.FRPC_CLI_TESTS is $FRPC_CLI_TESTS — the listed count DECREASED: if you deleted tests, restore them; do not lower this value"
              fi
            fi
            cat "$log.plain"
            exit 1
          fi
          echo "frpc CLI-lane guard ok: $n tests listed and $log_n executed across 9 targets (expected $FRPC_CLI_TESTS), 0 failed"
      - name: Run frpc's log-completion spawn test (the client control)
        # `frpc/tests/log_completion.rs` is the **control** for the empty-CLI-value
        # rule the `frps` log-completion step below pins. The client has never
        # overlaid its flags onto the loaded config — `frpc/src/main.rs:367-371`
        # passes `cli.log_level` straight to `resolve_log_level` — so "an empty
        # `--log-level` leaves the file's `[log] level` alone" is the outcome it
        # has always had, on both the `-c` and the `--config-dir` lane. The file
        # makes that an executable contract: a future "alignment" that gives
        # `frpc` the `frps` overlay goes red rather than silently agreeing.
        #
        # Why this is its own step: the plain `cargo test -p frpc` step above
        # **does** execute the file, but nothing there notices if the file stops
        # running. It is `#![cfg(feature = "full")]` (the `frpc` bin requires
        # `full`), so a `--no-default-features` invocation — or any edit that
        # neuters the gate — compiles it to 0 tests, prints
        # `test result: ok. 0 passed; 0 failed` and exits **0**. Measured: the
        # bare invocation cannot tell "1 passed" from "0 ran". That is exactly
        # the hole `ci.yml`'s `frps` log-completion guard closes for its own
        # file, and the same `#![cfg(feature = "full")]` note the step above
        # carries for `frpc/tests/admin_cli.rs`.
        #
        # The literal is a property of the *file* (one `#[test]`), not a shared
        # env value: `env.FRPC_TINY_CLI_TESTS` counts `frpc/tests/cli_exit_codes.rs`
        # and must not be moved for this target.
        shell: bash
        run: |
          set -eo pipefail
          expected=1
          expected_floor=1
          log=/tmp/frpc-log-completion-tests.log
          cargo test -p frpc --test log_completion --color never 2>&1 | tee "$log"
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"
          n=$(cargo test -p frpc --test log_completion --color never -- --list 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' | grep -E -c '^[^ ].*: test$' || true)
          status=0
          grep -q "Running tests/log_completion.rs" "$log.plain" || status=1
          grep -q "test result: ok. $expected passed; 0 failed" "$log.plain" || status=1
          [ "$n" = "$expected" ] || status=1
          [ "$expected" -ge "$expected_floor" ] || status=1
          if [ "$status" != "0" ]; then
            echo "::error::frpc log-completion guard failed (status=$status, file=$n, expected=$expected, log=$log)"
            if [ -n "$n" ] && [ "$n" != "$expected" ]; then
              if [ "$n" -lt "$expected" ]; then
                echo "::error::frpc/tests/log_completion.rs lists $n tests, *fewer* than the expected $expected — the file was disabled or tests were deleted (it is \`#![cfg(feature = \"full\")]\`-gated, so a feature change compiles it to 0 tests); restore them rather than lowering this literal"
              else
                echo "::error::frpc/tests/log_completion.rs lists $n tests, *more* than the expected $expected — tests were added: move the single literal in this shell step from $expected to $n"
              fi
            fi
            cat "$log.plain"
            exit 1
          fi
          echo "frpc log-completion guard ok: $n tests listed (expected $expected, floor $expected_floor), 0 failed"
      - name: Run frps CLI tests (config-failure exit codes)
        # The `frps` sibling of the step above. No lane ran the
        # `frps/tests/cli_exit_codes.rs` *integration* target before this step:
        # the two `--lib` steps restrict to lib targets, `frps` has no lib (its
        # bin-target unit tests are covered by `Run frps bin unit tests` above),
        # and the `Lint` lane only *compiles* the test targets (`cargo clippy
        # --workspace --all-targets --all-features`). So that file — added with
        # the CLI config-failure fix (`TODO.md:3182`) — executed in no lane, and
        # the frps half of that fix had no executing pin.
        #
        # Measured warm, macOS arm64: 2.47 s wall for the package (4 tests, the
        # SIGTERM positive control dominating) when this step was added; 5 after
        # the `--strict-config` space-form lane added
        # `space_form_strict_config_warns_on_stderr` (the warning assertion, a
        # fast `--help`-free parse); then 4 more from the bool-flag `=value` lanes
        # — `version_flag_value_spelling_decides_what_happens` (three fast
        # exits), `version_short_shorthand_clusters_and_equals_spelling_match_go`
        # (the `-v` shorthand grammar, seven fast exits),
        # `tls_only_false_value_starts_and_listens` (a SIGTERM positive control)
        # and `disable_log_color_value_spelling_is_applied` (two spawns, each
        # waiting out a listener). The current count is not repeated here: it is
        # `env.FRPS_CLI_TESTS` on this job. The runner was not measured for wall
        # time either way.
        #
        # Fail closed, target-specifically, and colour-proof. `--test
        # cli_exit_codes` makes the integration file the only target, and
        # `-- --list` prints every test name plus `N tests, 0 benchmarks`, so the
        # expected count is asserted from the test list itself, not only from
        # cargo's human-readable summary.
        #
        # The failure text is direction-aware: it names the single value to move
        # only when the log's summary count and the `-- --list` count agree and
        # the file lists more tests than the value; a *decrease* says to restore
        # the deleted tests instead of lowering the value. A malformed or missing
        # value is rejected before cargo runs.
        #
        # Colour — the one thing here with *runner* evidence. This job sets
        # `CARGO_TERM_COLOR: always`, and cargo colours its `Running tests/…`
        # line: the first runner run of this step failed on exactly that literal
        # grep while `test result: ok. 4 passed` matched (the tests had in fact
        # passed), i.e. it failed closed, not open. That run also shows the step's
        # shell as `/usr/bin/bash --noprofile --norc -e -o pipefail`, which is
        # what this step's `shell: bash` + `set -eo pipefail` ask for. `--color
        # never` makes the captured log plain by construction and the `sed` strip
        # is a belt-and-braces pass over the same file, so the step still fails
        # *closed* if the log loses the summary or the count.
        #
        # `cargo test` exits 0 when a `#[cfg]` or target change compiles the file
        # to zero tests ("0 passed") — proven with a mutation (`full` →
        # `not(full)` in the file's crate-level cfg): the run printed
        # `test result: ok. 0 passed` and exited 0, and the list/count checks
        # rejected it. `-o pipefail` (with the explicit bash shell, since the
        # default `run:` shell is `bash -e` without pipefail) is what makes a
        # cargo failure after a matched line fail the step rather than being
        # masked by `tee`'s exit status.
        shell: bash
        run: |
          set -eo pipefail
          case "${FRPS_CLI_TESTS_FLOOR}" in
            ''|*[!0-9]*)
              echo "::error::frps CLI exit-code guard: env.FRPS_CLI_TESTS_FLOOR must be a non-negative integer (got '${FRPS_CLI_TESTS_FLOOR}')"
              exit 1
              ;;
          esac
          case "$FRPS_CLI_TESTS" in
            ''|*[!0-9]*)
              echo "::error::frps CLI exit-code guard: env.FRPS_CLI_TESTS must be a non-negative integer (got '$FRPS_CLI_TESTS')"
              exit 1
              ;;
          esac
          log=/tmp/frps-cli-tests.log
          cargo test -p frps --test cli_exit_codes --color never 2>&1 | tee "$log"
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"
          n=$(cargo test -p frps --test cli_exit_codes --color never -- --list 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' | grep -E -c '^[^ ].*: test$' || true)
          log_n=$(grep -E -o 'test result: ok\. [0-9]+ passed; 0 failed' "$log.plain" | head -1 | sed -E 's/^test result: ok\. ([0-9]+) passed; 0 failed$/\1/' || true)
          status=0
          grep -q "Running tests/cli_exit_codes.rs" "$log.plain" || status=1
          grep -q "test result: ok. $FRPS_CLI_TESTS passed; 0 failed" "$log.plain" || status=1
          [ "$n" = "$FRPS_CLI_TESTS" ] || status=1
          [ "$FRPS_CLI_TESTS" -ge "$FRPS_CLI_TESTS_FLOOR" ] || status=1
          if [ "$status" != "0" ]; then
            echo "::error::frps CLI exit-code guard failed (status=$status, env=$FRPS_CLI_TESTS, file=$n, log=$log_n)"
            if [ "$FRPS_CLI_TESTS" -lt "$FRPS_CLI_TESTS_FLOOR" ]; then
              echo "::error::env.FRPS_CLI_TESTS is $FRPS_CLI_TESTS, below the absolute floor env.FRPS_CLI_TESTS_FLOOR=$FRPS_CLI_TESTS_FLOOR — a count literal lowered to match a deleted test is the exact edit this floor exists to stop. Restore the test; if the removal is intended, record it in TODO.md and lower *both* literals in the same edit, because either one alone leaves this guard red."
            fi
            if [ -n "$log_n" ] && [ "$log_n" = "$n" ] && [ "$n" != "$FRPS_CLI_TESTS" ]; then
              if [ "$n" -gt "$FRPS_CLI_TESTS" ]; then
                echo "::error::frps/tests/cli_exit_codes.rs lists $n tests, env.FRPS_CLI_TESTS is $FRPS_CLI_TESTS: move env.FRPS_CLI_TESTS on the tests-unit job in .github/workflows/ci.yml from $FRPS_CLI_TESTS to $n. The floor stays where it is when the count rises — only a literal that FALLS has to move both."
              else
                echo "::error::frps/tests/cli_exit_codes.rs lists $n tests, env.FRPS_CLI_TESTS is $FRPS_CLI_TESTS — the listed count DECREASED: if you deleted tests, restore them; do not lower this value"
              fi
            fi
            cat "$log.plain"
            exit 1
          fi
          echo "frps CLI exit-code guard ok: $n tests listed (expected $FRPS_CLI_TESTS), 0 failed"
      - name: Run frps CLI completion tests (merged-config completion order)
        # `frps/tests/cli_completion.rs` pins the CLI-override completion order
        # (TODO.md "The rest of the server-side completion is not Go's"): an
        # empty `--bind-addr`/`--dashboard-addr` must pass through
        # `ServerConfig::complete` exactly as Go completes its merged struct.
        # Before this step the file executed in no lane. Of the `frps` package's
        # targets, the only one any lane ran was `--test cli_exit_codes`
        # (the step above); `frps` declares no library target at all
        # (`cargo test -p frps --lib` is `error: no library targets found`) and
        # its `src/` carries no `#[test]`/`#[tokio::test]`, while `frps/tests/`
        # holds only these two files — so this file was genuinely the one **test**
        # target the job had never executed. (The `frps` *bin* target **is**
        # executed — by that step, and by the server-integration job through
        # `FRPS_BIN`; the tiers this job never runs are `frps-tiny` and
        # `frps-micro`.) The other `cargo test` steps in this workflow are other
        # packages (`-p frp-core`, `-p frpc`, `-p frp-client`, `-p frp-server`,
        # and the `--workspace --lib` step, whose `--lib` restricts it to library
        # targets).
        #
        # `--features dashboard` is load-bearing: the dashboard regression (an
        # empty `--dashboard-addr` handed to the listener as `:<port>`) is only
        # covered when the dashboard is compiled in. In the no-dashboard build
        # the file's dashboard shapes take their documented inert branch (and are
        # not red pre-fix — see that file). `--bind-port 0` is the deliberate
        # exception: `:7000` may be occupied on the runner, so that shape asserts
        # the **pre-bind** `frps starting on …:7000` line and has no connect leg,
        # on purpose.
        #
        # Cost: one `frps --features dashboard` rebuild. The `Tests (server
        # integration)` job restores the same `target/` cache key and builds the
        # same artifact (it builds `frpc` first, then `frps --features
        # dashboard`), so the compiled object files are shared through the cache.
        # Jobs run on separate runners: this step does not hand an artifact to
        # that job within a run. It is a different *target* from the guarded
        # `cli_exit_codes`, so `env.FRPS_CLI_TESTS` does not move.
        #
        # The feature flag also decides what this step leaves at
        # `target/debug/frps`. Measured here (macOS, warm, marker =
        # `grep -ac "Dashboard listening on" target/debug/frps`): after
        # `cargo test -p frps` the marker is 0; after this step's
        # `cargo test -p frps --features dashboard --test cli_completion` it is 1,
        # stable on a repeat; a later plain `cargo build -p frps` resets it to 0
        # and a later `cargo build -p frps --features dashboard` sets it back to
        # 1. So the step leaves a **dashboard** artifact behind, the safe
        # direction for any later consumer; and even if it did not, the test file
        # re-checks the marker in the binary it resolves at run time and would
        # take the documented inert branch rather than silently pass as dashboard
        # coverage. (The binary it resolves is `CARGO_BIN_EXE_frps`, which *is*
        # `<target>/debug/frps`, so it is not insulated from a swap. What the
        # run-time marker check buys is that a swapped artifact is not *mistaken
        # for* dashboard coverage: the dashboard shapes then take their documented
        # inert branch, quietly — the check does not itself raise an alarm.)
        run: cargo test -p frps --features dashboard --test cli_completion
      - name: Run frps's log-completion spawn tests
        # `frps/tests/log_completion.rs` pins Go's `LogConfig.Complete()`
        # (`pkg/config/v1/common.go:119-123`, called at
        # `pkg/config/v1/server.go:105`): an explicit `--log-level ""` /
        # `--log-file ""` / `--log-max-days 0`, or the same values in the config
        # file, must be filled rather than silencing the server while its
        # listener still binds. No other lane executes this file: the `frps`
        # package declares no library target and its `src/` carries no tests, so
        # `cargo test --workspace --lib` cannot see it, and the steps above
        # select `--test cli_exit_codes` / `--test cli_completion` explicitly. A
        # separate step (rather than extending the one above) keeps the guarded
        # `env.FRPS_CLI_TESTS` count untouched — this file adds the fourth `frps`
        # *target* (its third **test** target, after `cli_exit_codes` and
        # `cli_completion`; the bin unit target is the fourth), not a test inside
        # a counted one.
        #
        # `--features dashboard` matches the step above, so the same cached
        # `frps --features dashboard` artifact is reused (warm: no extra
        # rebuild). The file does not depend on the dashboard and also passes
        # against the default build; matching the sibling keeps this job from
        # swapping the artifact back and forth, and leaves the dashboard-bearing
        # binary behind — the safe direction the note above measures.
        #
        # The file removes `RUST_LOG` from its children on purpose (the variable
        # outranks `--log-level`, so leaving it set would mask the shape being
        # pinned); this step does not set it.
        #
        # **This step asserts the count, because a bare `cargo test --test <f>`
        # cannot tell "9 passed" from "0 ran".** Measured: with the file's
        # cfg gate mutated to a feature that does not exist (the disable
        # mutation), the plain invocation prints `running 0 tests` /
        # `test result: ok. 0 passed; 0 failed` and exits **0** — a gate quieter
        # than the `cli_exit_codes` step beside it, which is why this one repeats
        # that step's three checks (the target ran; the summary says
        # `ok. 10 passed; 0 failed`; `-- --list` counts 10). The literal is a
        # property of the *file*, not a shared env value: it lives here, next to
        # the invariant it guards, because `env.FRPS_CLI_TESTS` counts a
        # different target and must not be moved for this one.
        #
        # The literal moved 6 → 7 when the empty-`--log-level` pin landed,
        # 7 → 9 with the two sibling zero-value pins (`--log-file ""` and
        # `--log-max-days 0`, both arbited by Go's `-c` lane — see the file's own
        # section comments), and 9 → 10 with the `-c`-lane non-empty-flag pin
        # `cli_nonempty_log_level_flag_does_not_override_the_config_file`
        # (`TODO.md:10926`). It is the count of `#[test]`s in that one file, and
        # it lives in exactly one place in this step — the `expected=` line — so
        # a new pin means editing one number, not hunting a duplicated one.
        #
        # 10 → 11 with
        # `cli_file_retention_and_format_flags_do_not_override_the_config_file`,
        # which closes the coverage hole the four-value `-c` mask left: the
        # `--log-level` pin alone let a mutant that unmasked `log_file`,
        # `log_max_days` or `log_format` survive (measured: 10 passed / 0 failed),
        # so each of the other three withheld values now has its own arm.
        shell: bash
        run: |
          set -eo pipefail
          expected=11
          expected_floor=11
          log=/tmp/frps-log-completion-tests.log
          cargo test -p frps --features dashboard --test log_completion --color never 2>&1 | tee "$log"
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"
          n=$(cargo test -p frps --features dashboard --test log_completion --color never -- --list 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' | grep -E -c '^[^ ].*: test$' || true)
          status=0
          grep -q "Running tests/log_completion.rs" "$log.plain" || status=1
          grep -q "test result: ok. $expected passed; 0 failed" "$log.plain" || status=1
          [ "$n" = "$expected" ] || status=1
          [ "$expected" -ge "$expected_floor" ] || status=1
          if [ "$status" != "0" ]; then
            echo "::error::frps log-completion guard failed (status=$status, file=$n, expected=$expected, log=$log)"
            if [ -n "$n" ] && [ "$n" != "$expected" ]; then
              if [ "$n" -lt "$expected" ]; then
                echo "::error::frps/tests/log_completion.rs lists $n tests, *fewer* than the expected $expected — tests were deleted or the file was disabled; restore them rather than lowering the \`expected=\` line of this step"
              else
                echo "::error::frps/tests/log_completion.rs lists $n tests, *more* than the expected $expected — tests were added: bump the single \`expected=\` line of this step from $expected to $n"
              fi
            fi
            cat "$log.plain"
            exit 1
          fi
          echo "frps log-completion guard ok: $n tests listed (expected $expected, floor $expected_floor), 0 failed"
      - name: Run frps's `web_server.tls.enable` warning-delivery spawn tests
        # `frps/tests/warn_delivery.rs` pins what a **user** sees when a config
