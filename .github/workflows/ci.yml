        # covered when the dashboard is compiled in. In the no-dashboard build
        # the file's dashboard shapes take their documented inert branch (and are
        # not red pre-fix — see that file). `--bind-port 0` is the deliberate
        # exception: `:7000` may be occupied on the runner, so that shape asserts
        # the **pre-bind** `frps starting on …:7000` line and has no connect leg,
        # on purpose.
        #
        # Cost: one `frps --features dashboard` rebuild. The `Tests (server
