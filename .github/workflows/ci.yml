name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# The former single Check job ran clippy, tests, bench and feature checks
# sequentially (25m wall). Split into independent lanes that share the same
# cargo cache key: only the tests-server lane SAVES the cache (the others
# restore-only, so parallel lanes never race the cache write); on a warm
# cache the wall time drops to the slowest tests lane (e2e-runtime-bound).
# The tests job itself is further split into unit / server-integration /
# client-integration: each runs on its own runner, so the wall clock is the
# max of the three instead of a single job paying compile + full `-j 1` e2e
# serially (which timed out at 35m on cold caches). On a cache miss every
# lane pays its own cold dep compile, so a split run is slower in total CPU
# than the old single job — acceptable, misses are rare and wall clock wins.
jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Compiler from `rust-toolchain.toml` at the repo root (see
      # `docs/developing.md` § Toolchain pinning). `rustup toolchain install` with no
      # argument resolves that file's channel; the image's `stable` does not satisfy
      # a version pin, so this installs a second copy — the cost of the pin.
      - name: Install pinned Rust toolchain (`rust-toolchain.toml`)
        run: rustup toolchain install --no-self-update
      - name: Assert the lint compiler is the pinned one
        # Derived from the file, never hardcoded, so the pin and this check cannot
        # drift apart. The install step above says what was *requested*; this one
        # fails the job if the compiler that will actually run is not it, instead
        # of leaving a green lint result that a reader must trace to a log line.
        # The `channel` read mirrors the gate in `scripts/repo-health.sh`: scoped
        # to the `[toolchain]` table (a stray `channel` outside it is not the pin),
        # single- or double-quoted, tolerant of a trailing TOML comment. Keep the
        # two in step when either changes.
        run: |
          channel=$(awk '
            /^[[:space:]]*\[/ { in_table = ($0 ~ /^[[:space:]]*\[toolchain\][[:space:]]*(#.*)?$/); next }
            in_table && /^[[:space:]]*channel[[:space:]]*=/ { print; exit }
          ' rust-toolchain.toml)
          raw=$(printf '%s' "${channel#*=}" | sed -E 's/^[[:space:]]+//')
          case "$raw" in
            \"*\"*) expected=${raw#\"}; expected=${expected%%\"*} ;;
            \'*\'*) expected=${raw#\'}; expected=${expected%%\'*} ;;
            *)      expected=$(printf '%s' "$raw" | sed -E 's/[[:space:]]*#.*$//; s/[[:space:]]//g') ;;
          esac
          if [ -z "$expected" ]; then
            echo "::error::could not parse a [toolchain] channel value from rust-toolchain.toml"
            exit 1
          fi
          ver=$(rustc --version)
          case "$ver" in
            "rustc $expected "*) echo "lint compiler: $ver — matches the pinned channel $expected" ;;
            *) echo "::error::lint compiler is '$ver', which does not start with 'rustc $expected ' from rust-toolchain.toml"; exit 1 ;;
          esac
      - name: Record the toolchain this lint result came from
        # The pin states which version is *requested*; this line states which one
        # actually ran, so a future red or green Lint log is self-describing.
        run: |
          rustc --version
          cargo clippy --version
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Cheapest job in the matrix (~seconds: no Rust toolchain, no cache, reads
  # files with grep/find only). It turns a rule that was previously enforced by
  # memory into a machine gate: frp-rs versions must stay aligned with the Go frp
  # release number across 5 crates + the VERSION constant + the download script +
  # the README (see "Versioning (mandatory)" in CLAUDE.md).
  # scripts/repo-health.sh exits 1 on drift, and also prints the repo stats that
  # CLAUDE.md's Current Health table points at, so those numbers stop being
  # hand-maintained (the table once claimed 17 unsafe blocks in frp-core when the
  # tree had 21).
  health:
    name: Health (version alignment + repo stats)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Repo health — gates version alignment
        run: bash scripts/repo-health.sh

  tests-unit:
    name: Tests (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Compiler from `rust-toolchain.toml` at the repo root (see
      # `docs/developing.md` § Toolchain pinning). `rustup toolchain install` with no
      # argument resolves that file's channel; the image's `stable` does not satisfy
      # a version pin, so this installs a second copy — the cost of the pin.
      - name: Install pinned Rust toolchain (`rust-toolchain.toml`)
        run: rustup toolchain install --no-self-update
      - name: Run all-features lib tests (QUIC admission and feature combos)
        run: cargo test --workspace --all-features --lib
      - name: Run vnet unit tests (nathole membership/cap guards)
        # frps/frpc default features exclude `vnet`, so the default-feature
        # `cargo test --workspace` steps never compile the nathole.rs vnet
        # tests (round-14 HIGH: default-net membership guard, proxy-less
        # host-route admission, 64-route cap). The all-features lib step
        # above covers them only incidentally; pin `--features vnet`
        # explicitly so a future default/all-features change cannot
        # silently drop the gate. --lib: the vnet-gated tests are unit
        # tests in nathole.rs (no vnet-gated integration bins exist).
        run: cargo test -p frp-server --features vnet --lib
      - name: Run frp-core lib + integration tests (kcp/mux/xtcp_p2p/yamux_rst)
        # frp-core's tests/ are pure Rust<->Rust (no frps/frpc binaries), so
        # they belong with the unit lane and don't need the integration build.
        run: cargo test -p frp-core
      - name: Run frp-core's tests and benches with no features (runtime half of frp-core's tier gate)
        # The `verify` lane's `cargo check -p frp-core --no-default-features
        # --all-targets` is compile-only: it type-checks the test targets but
        # does not link or run them, so it cannot see a runtime failure in a
        # test or bench that still compiles. This step is the runtime half **for
        # frp-core**; the sibling runtime steps are `Run frp-client's tests with
        # no features` (this lane, below) and `Run frp-server's tests with no
        # features` (the Tests (server integration) lane, which already builds
        # the frps binary the oidc_integration tests spawn).
        #
        # For frp-core this step is the only gate for two measured classes:
        #   - eight frp-core lib tests (all in the compression path) failed with
        #     `"compression not compiled"` while compiling clean — 597 passed /
        #     8 failed;
        #   - `frp-core/benches/crypto_bridge.rs` had no compression gate and
        #     `bench_compression` unwraps `encryption::compress` at registration
        #     time (outside `b.iter`), panicking the whole bench binary:
        #     `thread 'main' panicked at frp-core/benches/crypto_bridge.rs:60:64:
        #     called `Result::unwrap()` on an `Err` value: "compression not
        #     compiled"`.
        # Both now carry their `#[cfg(feature = ...)]` gates; this step keeps
        # them gated. It lives in the unit lane rather than `verify` because
        # that lane already pays the test-harness cost (it links and runs the
        # same targets) and has a 25-minute budget.
        #
        # Measured after the gates: exits 0 with 609 tests passed / 0 failed and
        # 124 criterion bench cases run (default features: 903 tests / 130 bench
        # cases; --all-features: 917 / 130). Wall clock, macOS arm64: 5.39 s /
        # 5.42 s / 5.51 s warm on three runs, 19.84 s with frp-core's lib, its
        # 10 test targets and the bench touched (forced rebuild). The runner's
        # cost — Linux, cold cache — was not measured.
        run: cargo test -p frp-core --no-default-features --all-targets
      - name: Run frpc CLI tests (admin address resolution)
        # No lane ran a `cargo test` target of the `frpc` package before this
        # step (`ab-matrix.yml` only *builds* `-p frpc`; the two `--lib` steps —
        # `Run all-features lib tests` (`cargo test --workspace --all-features
        # --lib`) and `Run vnet unit tests` (`cargo test -p frp-server --features
        # vnet --lib`) — restrict to lib targets, and `frpc` has no lib). The
        # package's tests were therefore compiled by the
        # `Lint` lane (`cargo clippy --workspace --all-targets --all-features`,
        # which satisfies the bin's `required-features = ["full"]`) and executed
        # by nothing. That mattered: `frpc/src/main.rs`'s inline unit tests
        # pinned the old `127.0.0.1:7400` fallback that let
        # `frpc reload`/`status` silently ignore a config that fails to load.
        # This step executes them (8 unit tests) plus `frpc/tests/admin_cli.rs`
        # (14 tests), which spawns the `frpc` binary with crafted configs.
        #
        # What the `TcpListener` oracle does and does not prove. The listener is
        # bound to a port that is then written into the bad config's
        # `webServer.port`, so it covers *that* port only and cannot observe the
        # historical `127.0.0.1:7400` fallback by itself. Measured with a second
        # listener on 7400: the pre-fix binary leaves **0** connections on the
        # config's port and **1** on 7400; this branch's binary leaves 0 on
        # both. What catches a 7400 fallback is the output assertion, and it
        # takes two shapes: the two `*_port_zero_*` tests compare stdout exactly
        # (`assert_eq!(stdout.trim_end(), GO_NO_PORT_MSG)`), while the
        # load-error tests check a stdout substring
        # (`stdout.contains("unknown field \"notAKnownFrpKey\"")`, e.g.
        # `frpc/tests/admin_cli.rs:228`) plus a stderr check that no `connect`
        # was attempted. Pre-fix those fail with empty stdout and stderr
        # `reload failed: connect 127.0.0.1:7400: Connection refused (os error
        # 61)`. Measured against `main` @ `9c1b291`'s frpc, **9 of the 14 fail**
        # (5 passed; 9 failed), and 14/14 pass against this branch's binary.
        #
        # It belongs to the unit lane: the tests need no `frps`, and
        # `cargo test` builds the default-feature `frpc` bin they resolve via
        # `CARGO_BIN_EXE_frpc`. It sits immediately *before* the `frp-client`
        # no-features step on purpose: that step is documented-flaky on this
        # host (see its own comment), and with no `if: always()` a red run of it
        # would silently skip this one — the "compiled but never executed"
        # failure this step exists to fix. `frpc/tests/admin_cli.rs` is
        # `#![cfg(feature = "full")]`-gated for the no-default-features lanes
        # (`cargo test -p frpc --no-default-features` compiles it to 0 tests).
        #
        # Measured warm, macOS arm64: `cargo test -p frpc` 1.6 s wall (8 unit
        # tests in 0.00 s + 14 spawn-based tests in ~1.4 s, each waiting out a
        # 300 ms post-exit oracle window); `--no-default-features` 11.1 s from a
        # cold no-feature graph, with the integration file compiled to 0 tests.
        # The runner was not measured.
        run: cargo test -p frpc
      - name: Run frp-client's tests with no features (runtime half of frp-client's tier gate)
        # The `verify` lane's `cargo check -p frp-client --no-default-features
        # --all-targets` is compile-only: it type-checks the test targets but
        # does not link or run them, so it cannot see a missing #[cfg] on a test
        # that still compiles. This is the runtime half for frp-client, in the
        # same no-features configuration as its compile sibling.
        #
        # What it closes (TODO.md): exactly one frp-client target failed at
        # runtime in this configuration without a gate —
        # `test_e2e_tcp_proxy_over_websocket` (frp-client/tests/end_to_end.rs)
        # builds a client with `transport_protocol: "websocket"` and waits for
        # the proxy port; it now carries `#[cfg(feature = "websocket")]`.
        # Measured with the gate removed:
        #   cargo test -p frp-client --no-default-features --test end_to_end
        #     test_e2e_tcp_proxy_over_websocket   -> exit 101, panicking at that
        # test's `await.expect("proxy port ready")`. After the gate, that target
        # is 6 passed / 0 failed with no features, 7 passed / 0 failed with
        # `--no-default-features --features websocket`, and 7 passed / 0 failed
        # with default features — so no test was lost.
        #
        # It lives in the unit lane because frp-client's test targets need no
        # frps/frpc binary: they drive in-process services (nothing under
        # frp-client/ references FRPS_BIN/FRPC_BIN), so no env is set here.
        #
        # Caveat, measured on macOS arm64 and NOT on the runner: this whole
        # command also fails one pre-existing, timing/platform-sensitive lib
        # test that is not this class and carries its own TODO.md entry —
        # `plugin::http::tests::http_proxy_head_read_absolute_window_releases_trickler`
        # (6 of 10 isolated no-features runs failed; 3 of 3 with default
        # features); in one
        # sample the two `plugin::https2http/https2https` `start_paused`
        # handshake-deadline tests failed too. Every one of them is also run by
        # the existing default-features `Tests (client integration)` lane
        # (`cargo test -p frp-client --features admin -j 1`), measured red on
        # this host in the same way, so nothing here is introduced by this step.
        #
        # The set is one smaller than when this step was written:
        # `plugin::static_file::tests::test_static_file_e2e_non_ascii_round_trip`
        # no longer fails. It writes a file name containing byte 0xFF, which
        # this host's filesystem rejects with `Os { code: 92, kind:
        # Uncategorized, message: "Illegal byte sequence" }`, and now skips
        # only that half at runtime for EILSEQ; the name→bytes hop and the
        # bytes→path hop it would have exercised are pinned instead by the pure,
        # filesystem-independent `render_listing` / `join_components` unit tests
        # in the same module. (Two different directions: `render_listing` is the
        # name→bytes hop, `join_components` is the bytes→path hop.)
        #
        # Wall clock, macOS arm64 warm build: 1m12s to 3m07s on four runs (the
        # shortest aborted at the first failing lib target). `--no-fail-fast`
        # keeps every later target running when an unrelated lib test fails.
        run: cargo test -p frp-client --no-default-features --all-targets -j 1 --no-fail-fast
  tests-server:
    name: Tests (server integration)
    runs-on: ubuntu-latest
    # Heavy e2e lane: builds frps (dashboard) + frpc, then runs every
    # frp-server integration bin serially. This is the only lane that SAVES
    # the cargo cache (a second saver would race the write + double the
    # ~5 GB post-run upload).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Compiler from `rust-toolchain.toml` at the repo root (see
      # `docs/developing.md` § Toolchain pinning). `rustup toolchain install` with no
      # argument resolves that file's channel; the image's `stable` does not satisfy
      # a version pin, so this installs a second copy — the cost of the pin.
      - name: Install pinned Rust toolchain (`rust-toolchain.toml`)
        run: rustup toolchain install --no-self-update
      - name: Build frpc (server integration tests spawn it as the bridge end)
        run: cargo build --bin frpc
      - name: Build frps with dashboard feature
        # The dashboard-enabled frps also serves plain proxies (dashboard is
        # additive), so one binary covers both the dashboard integration tests
        # and the rest of the server integration suite.
        run: cargo build --bin frps --features dashboard
      - name: Run frp-server integration + dashboard tests
        # `--features dashboard` also enables the cfg-gated
        # dashboard_integration.rs / dashboard_v2_integration.rs so the only
        # opt-in business feature keeps CI coverage.
        # -j 1: each test bin binds ephemeral 127.0.0.1 ports as a separate
        # process; parallel bins can grab the same port and flake. The
        # common::allocate_port flock lock narrows the window; -j 1 removes it.
        run: cargo test -p frp-server --features dashboard -j 1
        env:
          FRPS_BIN: ${{ github.workspace }}/target/debug/frps
          FRPC_BIN: ${{ github.workspace }}/target/debug/frpc
      - name: Run frp-server's tests with no features (runtime half of frp-server's tier gate)
        # The `verify` lane's `cargo check -p frp-server --no-default-features
        # --all-targets` is compile-only, so it cannot see a missing #[cfg] on a
        # test that still compiles. This is the runtime half for frp-server, in
        # the same no-features configuration as its compile sibling.
        #
        # It lives in this lane because it needs the frps binary: the five
        # frp-server/tests/oidc_integration.rs tests spawn frps
        # (frp-server/tests/common/mod.rs resolves FRPS_BIN, then
        # CARGO_BIN_EXE_frps, then ../frps, then ../target/{debug,release}/frps),
        # and without one they fail with `failed to start frps: Os { code: 2,
        # kind: NotFound }`. The two build steps above already pay that cost, so
        # FRPS_BIN/FRPC_BIN are set here exactly as in the step above.
        #
        # What it closes (TODO.md): 34 deterministic frp-server failures in this
        # configuration, all missing feature gates, closed by
        #   - `#![cfg(feature = "http-proxy")]` on frp-server/tests/http_plugin.rs
        #     and frp-server/tests/http_plugin_ping.rs (each file then runs
        #     0 tests here and 23 / 5 with `--features http-proxy`); the
        #     `#[cfg(not(feature = "http-proxy"))]` stub at
        #     frp-server/src/plugin/mod.rs makes `notify` return `Ok(None)` and
        #     `record_login_user` a no-op, so 22 of 23 and 4 of 5 of those tests
        #     failed without the gate;
        #   - `#[cfg(feature = "http-proxy")]` on
        #     `control::proxy_ops::unregister_generation_tests::
        #     stale_unregister_keeps_fresh_user_record`
        #     (frp-server/src/control/proxy_ops.rs) — measured without it:
        #     `48 passed; 1 failed`, `left: None`, `right: Some("fresh")`;
        #   - `#[cfg(feature = "websocket")]` on `test_login_via_websocket` and
        #     `#[cfg(feature = "tls")]` on `test_login_via_tls`
        #     (frp-server/tests/server_protocol.rs), the two `tls` dial cases in
        #     frp-server/tests/slowloris.rs, and the three e2e cases in
        #     frp-server/tests/vhost_https_sni.rs. Without the gate each dial
        #     fails (`WS dial: Transport(Other("WS raw connect read: Connection
        #     reset by peer (os error 54)"))`, `TLS dial: ... (os error 54)`)
        #     or the https vhost port refuses the connection. The gates are on
        #     **frp-server's own** features: frp-core's websocket/tls are ON in
        #     this graph (the frp-client dev-dependency's default features
        #     forward them), which is
        #     exactly why the server-side gate is the one that matters.
        #     `vhost_https_sni.rs` keeps its one no-feature test
        #     (`test_hello_construction_extracts_sni`, per item, not per file).
        #
        # Measured after the gates, with `target/debug/frps` present and
        # `-j 1 --no-fail-fast`: three of five samples exited 0 with 436 passed /
        # 0 failed (2m08s warm on macOS arm64 — the runner was not measured); the
        # other two were 435 passed / 1 failed, the single failure being the
        # pre-existing, feature-independent
        # `test_tcpmux_proxy_auth_interior_space_rejected_407` flake, since
        # fixed (it has its own TODO.md entry); it also failed with default
        # features and was the only measured pre-existing failure in those five
        # samples. Measured
        # without an frps binary, the same command adds 5 environmental
        # `oidc_integration` failures; that is why it is not in the unit lane.
        #
        # Caveat: the runner (Linux, cache restored from a default-feature
        # build) was not measured; the restored cache does not contain this
        # feature set, so the step pays a fresh compile of the no-features graph.
        run: cargo test -p frp-server --no-default-features --all-targets -j 1 --no-fail-fast
        env:
          FRPS_BIN: ${{ github.workspace }}/target/debug/frps
          FRPC_BIN: ${{ github.workspace }}/target/debug/frpc

  tests-client:
    name: Tests (client integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Compiler from `rust-toolchain.toml` at the repo root (see
      # `docs/developing.md` § Toolchain pinning). `rustup toolchain install` with no
      # argument resolves that file's channel; the image's `stable` does not satisfy
      # a version pin, so this installs a second copy — the cost of the pin.
      - name: Install pinned Rust toolchain (`rust-toolchain.toml`)
        run: rustup toolchain install --no-self-update
      - name: Build binaries (needed for integration tests)
        run: cargo build --bin frps --bin frpc
      - name: Run frp-client integration tests
        # `--features admin`: admin is opt-in, so frp-client's default
        # features exclude it. These admin-gated tests are COMPILED in CI
        # (Lint lane: clippy --workspace --all-targets --all-features) but
        # were never EXECUTED: this lane's default-feature `cargo test`
        # skipped them, and the all-features test lane is `--lib` only
        # (integration bins excluded). Pin the feature here so they run.
        # NB: they cover the admin handler (body-less GET /api/reload,
        # `?strictConfig=` ParseBool parity, malformed-body 400), not the
        # `frpc reload` CLI path.
        # -j 1: same ephemeral-port collision rationale as the server lane;
        # client-side only here (frp-server bins run on their own runner, so
        # cross-crate port collision is gone).
        run: cargo test -p frp-client --features admin -j 1
        env:
          FRPS_BIN: ${{ github.workspace }}/target/debug/frps
          FRPC_BIN: ${{ github.workspace }}/target/debug/frpc

  verify:
    name: Verify (bench + feature sets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Compiler from `rust-toolchain.toml` at the repo root (see
      # `docs/developing.md` § Toolchain pinning). `rustup toolchain install` with no
      # argument resolves that file's channel; the image's `stable` does not satisfy
      # a version pin, so this installs a second copy — the cost of the pin.
      - name: Install pinned Rust toolchain (`rust-toolchain.toml`)
        run: rustup toolchain install --no-self-update
      - name: Check benchmarks compile
        run: cargo bench --workspace --no-run
      - name: Check tiny feature set compiles
        # RUSTFLAGS is part of the compiler fingerprint, so the restored
        # target/ cache (built without it) is not reused for these two steps;
        # they recompile the tier graphs. That cost is the point: the tier
        # builds must not warn, and these steps are what enforce it.
        #
        # NO --all-targets here, deliberately. On a --workspace invocation every
        # member is a root, so all dev-dependency edges enter the graph, and
        # frp-server's dev-dependency on frp-client (default features,
        # frp-server/Cargo.toml:67) plus frp-client's on frp-server re-enable
        # both crates' `default` sets. Measured with --all-targets: the micro
        # step compiles frp-client as
        # chacha20,compression,default,http2http,kcp,oidc,quic,tcp-mux,tls,websocket
        # instead of [], and frp-server as
        # chacha20,compression,default,http-proxy,kcp,oidc,quic,ssh,tcp-mux,tls,websocket
        # instead of [] — so --all-targets would silently drop the tier check for
        # those two crates, not extend it. The tier *test* targets are covered by
        # the three isolated steps below instead.
        run: cargo check --workspace --no-default-features --features tiny
        env:
          RUSTFLAGS: "-D warnings"
      - name: Check micro feature set compiles
        run: cargo check --workspace --no-default-features --features micro
        env:
          RUSTFLAGS: "-D warnings"
      - name: Check tier test targets compile (isolated, tls OFF)
        # `-p frp-client` makes frp-client the only root, so the sibling
        # dev-dependency edge that re-enables its `default` features is out of
        # the graph and the crate is genuinely compiled with tls OFF. This is
        # the run that compiles frp-client's test targets — all 40 of
        # frp-client/tests/*.rs — with -D warnings and tls OFF, so a missing
        # #[cfg(feature = "tls")] gate on a tls-only item is a compile error
        # here instead of a warning nothing promotes.
        #
        # Caveat, measured: 4 of those 40 targets are whole-file-cfg'd *empty*
        # in this configuration, so nothing inside them is checked —
        # plugin_h2.rs (#![cfg(feature = "http2http")], which is off here),
        # peer_xff_registry_e2e.rs (#![cfg(feature = "tls")]),
        # xtcp_pair_e2e.rs and xtcp_visitor_failure_e2e.rs
        # (#![cfg(all(feature = "quic", feature = "kcp"))]). `cargo test
        # -p frp-client --no-default-features --test <t> -- --list` reports 0
        # tests for each of the four, versus 38 for plugin_http. A missing gate
        # *inside* those four would not be caught here — which is exactly how
        # plugin_h2's tls-vs-http2http bug hid (TODO.md).
        #
        # The rationale for why the two --workspace tier steps above cannot
        # carry --all-targets is recorded there, not duplicated here.
        run: cargo check -p frp-client --no-default-features --all-targets
        env:
          RUSTFLAGS: "-D warnings"
      - name: Check frp-client tiny test targets compile (isolated, tls+tcp-mux)
        # frp-client's tiny tier is exactly `tls,tcp-mux` (frpc/Cargo.toml:23
        # `tiny = ["frp-client/tls", "frp-client/tcp-mux"]`), so `http2http` is
        # OFF here while `tls` is ON. Any test target whose imports come from
        # `http2http` but whose gate only names `tls` therefore fails to compile
        # in this configuration — which is how plugin_h2.rs (gated
        # `#![cfg(feature = "tls")]`, importing `h2`/`http`) broke: 5 errors,
        # E0433 `h2`/`http` plus E0277. It is now gated on `http2http`, and this
        # step is what keeps the next such target from hiding: without it the
        # tiny test targets are checked nowhere, because the `--workspace` tiny
        # step above does not carry --all-targets (see its comment for why).
        run: cargo check -p frp-client --no-default-features --features tls,tcp-mux --all-targets
        env:
          RUSTFLAGS: "-D warnings"
      - name: Check frp-server tier test targets compile (isolated, tls OFF)
        # The frp-server sibling of the step above: `-p frp-server` makes it
        # the only root, so frp-server's own features are at the micro set
        # (none) and its test targets are compiled with tls/websocket/ssh/...
        # OFF under -D warnings — a missing #[cfg(feature = ...)] gate on an
        # optional item is a compile error here.
        #
        # Caveat, measured — the bound is on the code that is *compiled*, not on
        # the targets. A whole-file-cfg'd target compiles to nothing, and inside
        # a target that does compile, any #[cfg]-excluded item is unchecked the
        # same way. 9 of frp-server's 35 `tests/*.rs` targets are
        # whole-file-cfg'd *empty* here: dashboard_integration.rs and
        # dashboard_v2_integration.rs (#![cfg(feature = "dashboard")]),
        # ssh_gateway.rs (#![cfg(feature = "ssh")]), transport_e2e_kcp.rs
        # (#![cfg(feature = "kcp")]), transport_e2e_quic.rs and v2_quic_r2r.rs
        # (#![cfg(feature = "quic")]), vhost_h2c.rs,
        # http_plugin.rs and http_plugin_ping.rs (#![cfg(feature =
        # "http-proxy")] — the last two are the pair this change gated).
        # `cargo test -p frp-server --no-default-features --test <t> --
        # --list` reports 0 tests for each. Item-by-item escapes exist too:
        # vhost_audit_fixes.rs declares 21 tests, 2 tls-gated per item, so 19 are
        # compiled and those 2 are not. (mock_oidc.rs also reports 0 tests but is
        # not whole-file-cfg'd empty — no inner #[cfg], compiled as its own test
        # target, simply declaring no tests.)
        #
        # Note that frp-core is *not* feature-off in this graph: frp-server's
        # dev-dependency on frp-client (default features, frp-server/Cargo.toml)
        # pulls frp-client's defaults, which forward frp-core/websocket, tls,
        # kcp, ... — measured, frp-core has 10 features on here (chacha20,
        # compression, http-client, kcp, oidc, quic, stun, tcp-mux, tls,
        # websocket), six further features off (vnet, admin-auth, mem-profile,
        # profiling, debug-logs, otel), and `default` itself off too (both
        # frp-server and frp-client take frp-core with default-features = false).
        # That is precisely why it is a useful gate for *frp-server's own*
        # #[cfg] gates: frp-core can hand frp-server a type/variant that
        # frp-server's matching feature does not know about, so every `match`
        # on such a type must stay exhaustive by construction rather than by
        # feature coincidence (see ConnectionType::WebSocket in
        # frp-core/src/transport/mod.rs). websocket is the one that bit because
        # it is the only frp-core feature that gated a ConnectionType variant
        # (the WebSocket variant was the enum's only #[cfg] item before this
        # change); the other nine features frp-core has on here disagree with
        # frp-server's empty set just as much, but cannot change
        # `ConnectionType`'s shape.
        run: cargo check -p frp-server --no-default-features --all-targets
        env:
          RUSTFLAGS: "-D warnings"
      - name: Check frp-server tiny test targets compile (isolated, tls+http-proxy+tcp-mux)
        # The frp-server sibling of the frp-client tiny step above. frps's tiny
        # tier is `["frp-server/tls", "frp-server/http-proxy",
        # "frp-server/tcp-mux"]` (frps/Cargo.toml:24), a non-empty feature set
        # that no other step compiles frp-server's test targets with — the step
        # immediately above is tls OFF and http-proxy OFF. Without this, a future
        # frp-server test whose gate names one of these three but whose imports
        # come from a feature that is off here (dashboard, ssh, quic, kcp,
        # websocket) would hide exactly as frp-client's plugin_h2 did. Measured
        # clean when added (exit 0 with -D warnings); it is a gate, not a fix.
        run: cargo check -p frp-server --no-default-features --features tls,http-proxy,tcp-mux --all-targets
        env:
          RUSTFLAGS: "-D warnings"
      - name: Check frp-server dashboard test targets compile (isolated, dashboard only)
        # The dashboard tier is opt-in (`dashboard = ["dep:prometheus",
        # "dep:axum", "frp-core/admin-auth"]`, frp-server/Cargo.toml) and no
        # other step compiles frp-server's test targets with it ON. `-p
        # frp-server` keeps frp-server's own features at just `dashboard`, so
        # frp-server/oidc is OFF while frp-core/oidc is ON — frp-server's
        # dev-dependency on frp-client pulls frp-client's defaults, which
        # forward frp-core/oidc. That unification is the gate's point: a
        # frp-core item that exists only feature-on must not make an
        # frp-server `match` non-exhaustive, and an frp-server #[cfg] gate
        # naming a feature that is off here (tls) must not hide an item that
        # is actually used. Measured before the fix:
        #   RUSTFLAGS="-D warnings" cargo check -p frp-server \
        #     --no-default-features --features dashboard --all-targets
        # exited 101 with E0004 `AuthMethod::Oidc` not covered
        # (dashboard.rs, frp-server/oidc off), E0425 `TcpListener` and
        # `TcpStream`, E0433 `io` (NoDelayListener serves the plain-HTTP
        # dashboard path with tls off, but its imports were tls-gated) and
        # unused-import `AtomicU64` (only the tls-gated handshake throttle uses
        # it). After the fix: exit 0 with -D warnings.
        run: cargo check -p frp-server --no-default-features --features dashboard --all-targets
        env:
          RUSTFLAGS: "-D warnings"
      - name: Check frp-core tier test targets compile (isolated, no features)
        # The frp-core sibling of the two steps above: `-p frp-core` makes it
        # the only root and frp-core's own features are at the micro set
        # (none). Measured with `cargo check -p frp-core --no-default-features
        # --all-targets -v`: every frp-core rustc invocation (the lib, the lib
        # test, all 10 frp-core/tests/*.rs targets, and the
        # frp-core/benches/crypto_bridge.rs bench) carries zero
        # `--cfg feature=` flags, so nothing in this graph re-enables a
        # frp-core feature. frp-core's dev-dependencies are all external
        # crates (tokio with `test-util`, tower, criterion, proptest,
        # tempfile — frp-core/Cargo.toml) and none depends back on frp-core,
        # which is why `--all-targets` is safe here but not on the two
        # `--workspace` tier steps above.
        #
        # What it proves: a feature-gated item referenced from frp-core's lib
        # or test targets without its gate is a hard error under -D warnings —
        # E0432/E0425 when the item is absent, unused_imports/dead_code when
        # it is only conditionally used, and unused_mut for a binding whose
        # only mutation is gated. Before this change the run exited 101 with 4
        # failing units (lib test, kcp, xtcp_p2p, protocol_round14). What
        # closes it: per-item `websocket` gates on the two `connect_ws_raw`
        # lib tests (frp-core/src/transport/mod.rs), `oidc` on
        # `TokenEndpointCapture` (frp-core/src/auth.rs), `compression` on
        # `TEST_KEY` (frp-core/src/snappy_stream.rs), whole-file `kcp` gates on
        # frp-core/tests/kcp.rs and frp-core/tests/xtcp_p2p.rs, and a
        # restructured `all_message_variants` binding in
        # frp-core/tests/protocol_round14.rs.
        #
        # Caveat, measured — the bound is on the code that is *compiled*, not
        # on the targets. A whole-file-cfg'd target compiles to nothing: 6 of
        # frp-core's 10 test targets are empty here — kcp.rs and xtcp_p2p.rs
        # (#![cfg(feature = "kcp")]), mux.rs and yamux_rst.rs
        # (#![cfg(feature = "tcp-mux")]), xtcp_quic_sni.rs
        # (#![cfg(feature = "tls")]), ws_tls_stall.rs (#![cfg(all(feature =
        # "tls", feature = "websocket"))]). `cargo test -p frp-core
        # --no-default-features --test <t> -- --list` reports 0 tests for each,
        # versus 4/12/13/3/2/1 with default features. A missing gate *inside*
        # those six is not caught here; the other 4 targets (config_round14.rs
        # 2 tests, protocol_round14.rs 4, proxy_auth.rs 3,
        # v2_handshake_round14.rs 3) are compiled and checked in full.
        run: cargo check -p frp-core --no-default-features --all-targets
        env:
          RUSTFLAGS: "-D warnings"
      - name: Check the four measured-red intra-crate feature combinations (curated list, NOT the full 2^N space)
        # A CURATED, CLOSED list — these four `-p`-isolated configurations were
        # measured red under -D warnings at `846c1b9` and fixed in the change
        # that added this step (TODO.md: "Measured `-p` configurations that are
        # red under `-D warnings`"). It is NOT the 2^N intra-crate feature
        # space: a combination that is not spelled out below is unchecked by
        # this step and by every other step in this lane. Extend the list when
        # the next one is measured red, and keep the count in this step name in
        # sync with the number of lines.
        #
        # Every line carries `-p`, so the named crate is the only root and gets
        # exactly the features listed. `cargo check --workspace` cannot see any
        # of these failures: feature unification across members re-enables each
        # crate's `default` set (rationale on the two --workspace tier steps
        # above), which is precisely how these four combinations stayed
        # unmeasured until a manual `-p` sweep found them.
        #
        # `set -e` short-circuits, so the first red configuration fails the
        # step and prints its own compiler output.
        run: |
          set -e
          cargo check -p frp-server --no-default-features --features vnet --all-targets
          cargo check -p frp-client --no-default-features --features quic
          cargo check -p frp-client --no-default-features --features vnet --all-targets
          cargo check -p frp-core --no-default-features --features kcp --all-targets
        env:
          RUSTFLAGS: "-D warnings"

  build:
    name: Build (release)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [lint, tests-unit, tests-server, tests-client, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Compiler from `rust-toolchain.toml` at the repo root (see
      # `docs/developing.md` § Toolchain pinning). `rustup toolchain install` with no
      # argument resolves that file's channel; the image's `stable` does not satisfy
      # a version pin, so this installs a second copy — the cost of the pin.
      - name: Install pinned Rust toolchain (`rust-toolchain.toml`)
        run: rustup toolchain install --no-self-update
      - name: Build release (LTO disabled for CI speed)
        run: |
          mkdir -p .cargo
          printf '[profile.release]\nlto = false\nopt-level = 2\n' >> .cargo/config.toml
          cargo build --release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frp-rs-linux-x86_64
          path: |
            target/release/frps
            target/release/frpc
          retention-days: 7

  security:
    name: Security (cargo-audit + cargo-deny)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Restore-only, registry/git only: cargo-audit + cargo-deny never build
      # the workspace, so target/ is dead weight here. Saving it made the
      # post-run upload ~5.1 GB and it hung at "Sent 0 of ... (0.0%)" until
      # GitHub cancelled the job (observed twice 2026-09-01: this job and the
      # tests job at the 25m limit) — restore-only removes the upload entirely.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-security-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Compiler from `rust-toolchain.toml` at the repo root (see
      # `docs/developing.md` § Toolchain pinning). `rustup toolchain install` with no
      # argument resolves that file's channel; the image's `stable` does not satisfy
      # a version pin, so this installs a second copy — the cost of the pin.
      - name: Install pinned Rust toolchain (`rust-toolchain.toml`)
        run: rustup toolchain install --no-self-update
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo audit (dependency vulnerability scan)
        # RUSTSEC-2026-0194/0195 (quick-xml via the opt-in pprof profiling
        # path) and RUSTSEC-2023-0071 (rsa Marvin sidechannel, unreachable —
        # frp-rs only verifies RSA signatures, never private-key ops) are
        # documented pre-existing issues with no upstream fix. Full rationale
        # in CLAUDE.md "Security audit" and deny.toml [advisories].
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2023-0071
      - name: cargo deny check (advisories + licenses + bans + sources)
        # --all-features so the graph matches Cargo.lock (which cargo audit
        # scans): opt-in deps like pprof -> inferno -> quick-xml are otherwise
        # invisible to the license/advisory checks.
        run: cargo deny --all-features check
