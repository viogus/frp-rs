name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# The former single Check job ran clippy, tests, bench and feature checks
# sequentially (25m wall). Split into three independent lanes that share the
# same cargo cache key: only the tests lane SAVES the cache (the others
# restore-only, so parallel lanes never race the cache write); on a warm
# cache the wall time drops to the tests lane (~15m, e2e-runtime-bound).
# On a cache miss every lane pays its own cold dep compile, so a split run
# is slower than the old single job — acceptable, misses are rare.
jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Rust stable
        run: rustup default stable
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  tests:
    name: Tests (lib + integration + dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Rust stable
        run: rustup default stable
      - name: Run all-features lib tests (QUIC admission and feature combos)
        run: cargo test --workspace --all-features --lib
      - name: Run vnet unit tests (nathole membership/cap guards)
        # frps/frpc default features exclude `vnet`, so the default-feature
        # `cargo test --workspace` steps never compile the nathole.rs vnet
        # tests (round-14 HIGH: default-net membership guard, proxy-less
        # host-route admission, 64-route cap). The all-features lib step
        # above covers them only incidentally; pin `--features vnet`
        # explicitly so a future default/all-features change cannot
        # silently drop the gate. --lib: the vnet-gated tests are unit
        # tests in nathole.rs (no vnet-gated integration bins exist).
        run: cargo test -p frp-server --features vnet --lib
      - name: Build binaries (needed for integration tests)
        run: cargo build --bin frps --bin frpc
      - name: Build frps with dashboard feature (for dashboard integration tests)
        run: cargo build --bin frps --features dashboard
      - name: Run dashboard integration tests
        # dashboard_integration.rs / dashboard_v2_integration.rs are cfg-gated
        # on the `dashboard` feature and never compile under default features;
        # run them here so the only opt-in business feature has CI coverage.
        # -j 1: both bins bind ephemeral ports and parallel execution lets the
        # two *processes* collide on the same 127.0.0.1 port (each test bin is
        # a separate process with its own port bookkeeping), flaking as
        # "dashboard_port not ready". Serialize them. The common::allocate_port
        # flock lock narrows the window; -j 1 removes it entirely.
        run: cargo test -p frp-server --features dashboard --test dashboard_integration --test dashboard_v2_integration -j 1
        env:
          FRPS_BIN: ${{ github.workspace }}/target/debug/frps
      - name: Run tests
        # -j 1: frp-server/frp-client integration bins each spawn their own
        # frps/frpc and bind ephemeral 127.0.0.1 ports. Cargo runs test *bins*
        # as separate processes in parallel, and each process re-allocates
        # ports independently, so parallel bins can grab the same port and
        # flake (observed reload_integration / dashboard_integration). The
        # common::allocate_port flock lock narrows the window; `-j 1` runs the
        # bins one at a time and removes it entirely.
        run: cargo test --workspace -j 1
        env:
          FRPS_BIN: ${{ github.workspace }}/target/debug/frps
          FRPC_BIN: ${{ github.workspace }}/target/debug/frpc

  verify:
    name: Verify (bench + feature sets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Rust stable
        run: rustup default stable
      - name: Check benchmarks compile
        run: cargo bench --workspace --no-run
      - name: Check tiny feature set compiles
        run: cargo check --workspace --no-default-features --features tiny
      - name: Check micro feature set compiles
        run: cargo check --workspace --no-default-features --features micro

  build:
    name: Build (release)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [lint, tests, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Rust stable
        run: rustup default stable
      - name: Build release (LTO disabled for CI speed)
        run: |
          mkdir -p .cargo
          printf '[profile.release]\nlto = false\nopt-level = 2\n' >> .cargo/config.toml
          cargo build --release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frp-rs-linux-x86_64
          path: |
            target/release/frps
            target/release/frpc
          retention-days: 7

  security:
    name: Security (cargo-audit + cargo-deny)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-security-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Rust stable
        run: rustup default stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo audit (dependency vulnerability scan)
        # RUSTSEC-2026-0194/0195 (quick-xml via the opt-in pprof profiling
        # path) and RUSTSEC-2023-0071 (rsa Marvin sidechannel, unreachable —
        # frp-rs only verifies RSA signatures, never private-key ops) are
        # documented pre-existing issues with no upstream fix. Full rationale
        # in CLAUDE.md "Security audit" and deny.toml [advisories].
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2023-0071
      - name: cargo deny check (advisories + licenses + bans + sources)
        # --all-features so the graph matches Cargo.lock (which cargo audit
        # scans): opt-in deps like pprof -> inferno -> quick-xml are otherwise
        # invisible to the license/advisory checks.
        run: cargo deny --all-features check
