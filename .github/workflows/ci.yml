      # cli_exit_codes -- --list`.
      # 22 → 24 with rounds 4-5: +2
      # (`config_dir_exits_the_first_files_code_when_a_later_file_fails_to_load`,
      # the sort-removal discriminator — a *later* file's load failure plus an
      # *earlier* file's run failure — and round 5's mirror
      # `config_dir_exits_the_first_files_code_when_a_load_failure_precedes_a_run_failure`,
      # which pins the sort **key**: a load failure at index 0 (code 2) plus a run
      # failure at index 1 (code 1), so `failures.reverse()` and
      # `sort_by_key(|(_, code)| *code)` both exit 1 where file order requires 2).
      # Both are ungated, so `frpc-tiny` reaches them. Re-derived with
