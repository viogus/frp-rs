      # 18 → 19 with the `--allow-unsafe` gate on the load path (#422): +1
      # (`verify_runs_the_post_load_allow_unsafe_gate_like_go`) — the file is
      # `#![cfg(any(feature = "full", feature = "tiny"))]` and the test is not
      # further gated, so both client lanes gain it. Measured with
      # `cargo test -p frpc --no-default-features --features tiny --test
      # cli_exit_codes -- --list`.
      # 18 → 19 with the `--config-dir` residue round: +1
      # (`config_dir_where_every_service_fails_to_run_exits_like_dash_c`), which
      # is deliberately ungated so it also runs in this `tiny` lane.
      # Re-derived after the rebase onto `3f66d823` (#422): 18 + 1 + 1 = 20 —
      # 20 is the **pre-rebase chain**'s declared literal, the value `b49adaf0`
      # carries; the post-rebase tree that becomes `32a0e8d2` lists 21 (below).
      # 19 → 20 in that pre-rebase chain with round 3 of the same round: +1
      # (`config_dir_where_one_service_fails_keeps_retrying_and_exits_zero`),
      # the converse pin — one file's service stops at run time, the other keeps
      # retrying (`loginFailExit = false`, honoured by `frpc-tiny`) and the lane
