        # The `admin`-on half of `frpc/tests/cli_inputs.rs`, and the only lane
        # that ever ran that file with `admin` on: `Run frpc CLI tests (admin
        # address resolution)` above runs the package with the default (`full`)
        # features, and the two admin steps above this one run a single
        # *different* file each, so
        # `a_config_file_named_after_a_subcommand_stays_a_config_file` was
        # invisible in this configuration. That hid a red: it read run mode's own
        # admin bind line (`frpc admin server starting on 127.0.0.1:<port>`,
        # `frp-client/src/service.rs:4414`) as a dial of the config's
        # `[webServer]` port.
        #
        # Scoped to the one target that needs the flag rather than the whole
        # package: `frpc`'s default feature set is already `full`, so
        # `--features admin` is the same set as `--features full,admin` for this
        # target, and a whole-package run would re-run 77 tests the steps above
        # already execute in this job while doubling the per-run exposure to
        # `frpc/tests/admin_cli.rs`'s timing flake (`frpc/tests/admin_cli.rs:178`,
        # 5 s `EXIT_TIMEOUT` against a 1 s `--api-timeout`).
        #
        # Exposure this scoping gives up, stated plainly: no lane runs
        # `frpc/tests/admin_cli.rs` (25 tests) with `admin` on any more. It runs
        # in `Run frpc CLI tests (admin address resolution)` above, under the
        # default (`full`) features. That file's own gate is
        # `#![cfg(feature = "full")]` (`frpc/tests/admin_cli.rs:50`), so `admin`
        # never selected a different set of its tests — the flag would only
        # change which `frp-client` feature set they compile against. Accepted
        # knowingly: the alternative, the whole-package run, re-runs those same
        # 25 tests and doubles this job's exposure to the flake named above.
        #
        # Count-guarded like the `cli_exit_codes` step below, and for the same
        # reason: `cargo test` exits 0 when a `#[cfg]` change compiles this file
        # to zero tests (measured: with the file's gate changed `full` → `tiny`
        # it prints `running 0 tests` and exits 0), so "cargo exited 0" is not a
        # guard. The single literal lives in
        # `env.FRPC_ADMIN_CLI_INPUTS_TESTS` on this job, and it must be at least
        # 1: a literal of `0` would be satisfied by the very zero-test state this
        # guard exists to catch (measured: `0` + the broken gate listed 0 tests,
        # passed 0 and exited 0 before this check was added). With the literal
        # rejected below and `n` required to equal it, `n >= 1` follows — no
        # separate check on `n` is needed, and one that could never fire alone is
        # not written.
        shell: bash
        run: |
          set -eo pipefail
          case "$FRPC_ADMIN_CLI_INPUTS_TESTS" in
            ''|*[!0-9]*|0)
              echo "::error::frpc admin CLI-input guard: env.FRPC_ADMIN_CLI_INPUTS_TESTS must be a positive integer (got '$FRPC_ADMIN_CLI_INPUTS_TESTS')"
              exit 1
              ;;
          esac
          log=/tmp/frpc-admin-cli-inputs-tests.log
          cargo test -p frpc --features admin --test cli_inputs --color never 2>&1 | tee "$log"
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"
          n=$(cargo test -p frpc --features admin --test cli_inputs --color never -- --list 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' | grep -E -c '^[^ ].*: test$' || true)
          log_n=$(grep -E -o 'test result: ok\. [0-9]+ passed; 0 failed' "$log.plain" | head -1 | sed -E 's/^test result: ok\. ([0-9]+) passed; 0 failed$/\1/' || true)
          status=0
          grep -q "Running tests/cli_inputs.rs" "$log.plain" || status=1
          grep -q "test result: ok. $FRPC_ADMIN_CLI_INPUTS_TESTS passed; 0 failed" "$log.plain" || status=1
          [ "$n" = "$FRPC_ADMIN_CLI_INPUTS_TESTS" ] || status=1
          if [ "$status" != "0" ]; then
            echo "::error::frpc admin CLI-input guard failed (status=$status, env=$FRPC_ADMIN_CLI_INPUTS_TESTS, file=$n, log=$log_n)"
            if [ -n "$log_n" ] && [ "$log_n" = "$n" ] && [ "$n" != "$FRPC_ADMIN_CLI_INPUTS_TESTS" ]; then
              if [ "$n" -gt "$FRPC_ADMIN_CLI_INPUTS_TESTS" ]; then
                echo "::error::frpc/tests/cli_inputs.rs lists $n tests, env.FRPC_ADMIN_CLI_INPUTS_TESTS is $FRPC_ADMIN_CLI_INPUTS_TESTS: move the single env.FRPC_ADMIN_CLI_INPUTS_TESTS value on the tests-unit job in .github/workflows/ci.yml from $FRPC_ADMIN_CLI_INPUTS_TESTS to $n"
              else
                echo "::error::frpc/tests/cli_inputs.rs lists $n tests, env.FRPC_ADMIN_CLI_INPUTS_TESTS is $FRPC_ADMIN_CLI_INPUTS_TESTS — the listed count DECREASED: if you deleted tests, restore them; do not lower this value"
              fi
            fi
            cat "$log.plain"
            exit 1
          fi
          echo "frpc admin CLI-input guard ok: $n tests listed (expected $FRPC_ADMIN_CLI_INPUTS_TESTS), 0 failed"
      - name: Run frpc's CLI exit-code tests under `tiny` (tier runtime half)
        # `frpc/src/main-tiny.rs` is `include!("main.rs")`, so the config/flag
        # exit-code fix has to hold in the no-default-features build too — but
        # the `full`-gated tests in the step above cannot see that binary (the
        # `frpc` bin is `required-features = ["full"]`) and the tier lane only
        # `cargo check`s (`Check tiny feature set compiles`), which compiles no
        # test target at all. This runs `frpc/tests/cli_exit_codes.rs` against
        # `CARGO_BIN_EXE_frpc-tiny`; its crate-level cfg admits `tiny` for
        # exactly this lane.
        #
        # Measured warm, macOS arm64: 1.00 s wall for the 9 tests this lane listed
        # when the step was added (the 7 `full`-tier assertions plus the 2
        # `tiny`-gated ones) before the bool-flag `=value` lane added its own pair
        # of ungated `frpc` tests. The current count is not repeated here: it is
        # `env.FRPC_TINY_CLI_TESTS` on this job. The runner was not measured for
        # wall time.
        #
        # Evidence for this lane's colour fix is *inferred*, not measured on the
        # runner: the run that exposed the `frps` failure never reached this step
        # (GitHub skips the remaining steps of a job after one fails, and this
        # step's status was `skipped`, not `failure`). What is measured is that
        # this step carried the identical literal grep until this commit, plus
        # the local `CARGO_TERM_COLOR=always` reproduction of that grep failing
        # and passing after the fix. The next runner run measures it for real.
        #
        # Same three checks as the step above (the target ran; the log says
        # `ok. N passed; 0 failed` and `-- --list` counts that same N, both
        # against this job's expected-count env value), same colour handling,
        # same fail-closed exit. The `frps` step is the one with runner
        # evidence: its log shows cargo's coloured `Running …` line and the
        # guard's exit 1.
        shell: bash
        run: |
          set -eo pipefail
          case "$FRPC_TINY_CLI_TESTS" in
            ''|*[!0-9]*)
              echo "::error::frpc tiny CLI exit-code guard: env.FRPC_TINY_CLI_TESTS must be a non-negative integer (got '$FRPC_TINY_CLI_TESTS')"
              exit 1
              ;;
          esac
          log=/tmp/frpc-tiny-cli-tests.log
          cargo test -p frpc --no-default-features --features tiny --test cli_exit_codes --color never 2>&1 | tee "$log"
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"
          n=$(cargo test -p frpc --no-default-features --features tiny --test cli_exit_codes --color never -- --list 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' | grep -E -c '^[^ ].*: test$' || true)
          log_n=$(grep -E -o 'test result: ok\. [0-9]+ passed; 0 failed' "$log.plain" | head -1 | sed -E 's/^test result: ok\. ([0-9]+) passed; 0 failed$/\1/' || true)
          status=0
          grep -q "Running tests/cli_exit_codes.rs" "$log.plain" || status=1
          grep -q "test result: ok. $FRPC_TINY_CLI_TESTS passed; 0 failed" "$log.plain" || status=1
          [ "$n" = "$FRPC_TINY_CLI_TESTS" ] || status=1
          if [ "$status" != "0" ]; then
            echo "::error::frpc tiny CLI exit-code guard failed (status=$status, env=$FRPC_TINY_CLI_TESTS, file=$n, log=$log_n)"
            if [ -n "$log_n" ] && [ "$log_n" = "$n" ] && [ "$n" != "$FRPC_TINY_CLI_TESTS" ]; then
              if [ "$n" -gt "$FRPC_TINY_CLI_TESTS" ]; then
                echo "::error::frpc/tests/cli_exit_codes.rs lists $n tests, env.FRPC_TINY_CLI_TESTS is $FRPC_TINY_CLI_TESTS: move the single env.FRPC_TINY_CLI_TESTS value on the tests-unit job in .github/workflows/ci.yml from $FRPC_TINY_CLI_TESTS to $n"
              else
                echo "::error::frpc/tests/cli_exit_codes.rs lists $n tests, env.FRPC_TINY_CLI_TESTS is $FRPC_TINY_CLI_TESTS — the listed count DECREASED: if you deleted tests, restore them; do not lower this value"
              fi
            fi
            cat "$log.plain"
            exit 1
          fi
          echo "frpc tiny CLI exit-code guard ok: $n tests listed (expected $FRPC_TINY_CLI_TESTS), 0 failed"
      - name: Run frp-client's tests with no features (runtime half of frp-client's tier gate)
        # The `verify` lane's `cargo check -p frp-client --no-default-features
        # --all-targets` is compile-only: it type-checks the test targets but
        # does not link or run them, so it cannot see a missing #[cfg] on a test
        # that still compiles. This is the runtime half for frp-client, in the
        # same no-features configuration as its compile sibling.
        #
        # What it closes (TODO.md): exactly one frp-client target failed at
        # runtime in this configuration without a gate —
        # `test_e2e_tcp_proxy_over_websocket` (frp-client/tests/end_to_end.rs)
        # builds a client with `transport_protocol: "websocket"` and waits for
        # the proxy port; it now carries `#[cfg(feature = "websocket")]`.
        # Measured with the gate removed:
        #   cargo test -p frp-client --no-default-features --test end_to_end
        #     test_e2e_tcp_proxy_over_websocket   -> exit 101, panicking at that
        # test's `await.expect("proxy port ready")`. After the gate, that target
        # is 6 passed / 0 failed with no features, 7 passed / 0 failed with
        # `--no-default-features --features websocket`, and 7 passed / 0 failed
        # with default features — so no test was lost.
        #
        # It lives in the unit lane because frp-client's test targets need no
        # frps/frpc binary: they drive in-process services (nothing under
        # frp-client/ references FRPS_BIN/FRPC_BIN), so no env is set here.
        #
        # Caveat, measured on macOS arm64 and NOT on the runner: this whole
        # command also fails one pre-existing, timing/platform-sensitive lib
        # test that is not this class and carries its own TODO.md entry —
        # `plugin::http::tests::http_proxy_head_read_absolute_window_releases_trickler`
        # (6 of 10 isolated no-features runs failed; 3 of 3 with default
        # features); in one
        # sample the two `plugin::https2http/https2https` `start_paused`
        # handshake-deadline tests failed too. Every one of them is also run by
        # the existing default-features `Tests (client integration)` lane
        # (`cargo test -p frp-client --features admin -j 1`), measured red on
        # this host in the same way, so nothing here is introduced by this step.
        #
        # The set is one smaller than when this step was written:
        # `plugin::static_file::tests::test_static_file_e2e_non_ascii_round_trip`
        # no longer fails. It writes a file name containing byte 0xFF, which
        # this host's filesystem rejects with `Os { code: 92, kind:
        # Uncategorized, message: "Illegal byte sequence" }`, and now skips
        # only that half at runtime for EILSEQ; the name→bytes hop and the
        # bytes→path hop it would have exercised are pinned instead by the pure,
        # filesystem-independent `render_listing` / `join_components` unit tests
        # in the same module. (Two different directions: `render_listing` is the
        # name→bytes hop, `join_components` is the bytes→path hop.)
        #
        # Wall clock, macOS arm64 warm build: 1m12s to 3m07s on four runs (the
        # shortest aborted at the first failing lib target). `--no-fail-fast`
        # keeps every later target running when an unrelated lib test fails.
        run: cargo test -p frp-client --no-default-features --all-targets -j 1 --no-fail-fast
  # The release-profile CLI lane. `cargo test --release -p frps --test
  # cli_exit_codes` used to be red in every release build (41 passed / 3 failed)
  # because three pins drive `#[cfg(debug_assertions)]` hooks in
  # `frps/src/main.rs` (`:650`, `:727`, `:771`) that a release binary does not
  # compile. Those three tests now carry
  # `#[cfg_attr(not(debug_assertions), ignore = "<reason>")]`; `ignore` (not
  # `#[cfg]`) is what keeps them compiled and *counted* in both profiles, and
  # `FRPS_RELEASE_CLI_TESTS` below is the same 45 as the tests-unit lane's
  # `FRPS_CLI_TESTS` on purpose.
  #
  # This job is what makes the skip observable: it asserts the exact summary
  # line (42 passed; 0 failed; 3 ignored) and the exact three ignored names, so
  # the release lane cannot widen its own skip set, drop a test, or lose the
  # target and still pass.
  #
  # What this lane does *not* defend: turning those three attributes into an
  # unconditional `#[ignore]`. That yields byte-identical release output, so the
  # guard below exits 0 by design. Blanket ignoring is caught by the
  # pre-existing debug lane in `tests-unit` instead: `FRPS_CLI_TESTS: "45"`
  # (`:282`) requires `test result: ok. 45 passed; 0 failed` (`:935`), so an
  # unconditional `#[ignore]` fails hard there. The two guards cover different
  # axes and neither makes the other redundant.
  #
  # Deliberately absent from `build`'s `needs` list: a cold release build costs
  # ~5m at `-j 2` and must not serialize the artifact job. A red lane here
  # blocks a merge only if branch protection names it ("Tests (release
  # profile)").
  release-tests:
    name: Tests (release profile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRPS_RELEASE_CLI_TESTS: "45"
      # Exactly these three and no more: the test function names, in file order
      # (the guard sorts both sides), that carry the release-only skip in
      # `frps/tests/cli_exit_codes.rs`.
      FRPS_RELEASE_CLI_IGNORED: "config_dir_sigterm_inside_the_registration_window_exits_0_through_the_recorded_request config_dir_recorded_signal_fans_out_to_an_already_registered_service config_dir_where_every_task_panics_exits_nonzero"
    steps:
      - uses: actions/checkout@v4
      # Restore only. Two lanes SAVE this cache, each under its own key
      # namespace — `tests-server` (`${os}-cargo-…`) and `build`
      # (`${os}-cargo-release-…`) — so a third saver here would only race them.
      # The `-cargo-release-` restore-key picks up `build`'s release artifacts
      # when they exist (main/tag pushes); otherwise this falls back to the
      # shared cache and pays a cold, LTO-free release build.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-release-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-
      # Compiler from `rust-toolchain.toml` (see `docs/developing.md` § Toolchain
      # pinning); `rustup toolchain install` with no argument resolves that file's
      # channel, while the image's `stable` would not satisfy a version pin.
      - name: Install pinned Rust toolchain (`rust-toolchain.toml`)
        run: rustup toolchain install --no-self-update
      # Same profile the `build` job uses, so its release artifacts come back from
      # the cache and the binary under test is built exactly as this lane
      # describes. The one axis left untested is fat-LTO codegen; `debug_assertions`
      # — the axis these pins depend on — is identical either way.
      - name: Use the CI release profile (LTO disabled for CI speed)
        run: |
          mkdir -p .cargo
          printf '[profile.release]\nlto = false\nopt-level = 2\n' >> .cargo/config.toml
      - name: Run frps CLI exit-code pins in the release profile
        shell: bash
        run: |
          set -eo pipefail
          log=/tmp/frps-release-cli-tests.log
          cargo test --release -p frps --test cli_exit_codes --color never 2>&1 | tee "$log"
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"

          expected_ignored=$(printf '%s\n' $FRPS_RELEASE_CLI_IGNORED | wc -l | tr -d ' ')
          expected_passed=$((FRPS_RELEASE_CLI_TESTS - expected_ignored))

          if ! grep -q 'Running tests/cli_exit_codes.rs' "$log.plain"; then
            echo "error: the release run never built tests/cli_exit_codes.rs:" >&2
            cat "$log.plain" >&2
            exit 1
          fi

          if ! grep -q "test result: ok. ${expected_passed} passed; 0 failed; ${expected_ignored} ignored;" "$log.plain"; then
            echo "error: expected 'test result: ok. ${expected_passed} passed; 0 failed; ${expected_ignored} ignored;'." >&2
            echo "       a widened release skip (or a pin that stopped being skipped)" >&2
            echo "       must not pass this lane. Every 'test result' line:" >&2
            grep 'test result' "$log.plain" >&2 || true
            exit 1
          fi

          # Both sides are sorted before comparing: the env var lists the three
          # names in the order the tests appear in the file, not alphabetically.
          expected_ignored_sorted=$(printf '%s\n' $FRPS_RELEASE_CLI_IGNORED \
            | sort | tr '\n' ' ' | sed -E 's/ +$//')
          ignored=$(sed -nE 's/^test (.*) \.\.\. ignored.*$/\1/p' "$log.plain" \
            | sort | tr '\n' ' ' | sed -E 's/ +$//')
          if [[ "$ignored" != "$expected_ignored_sorted" ]]; then
            echo "error: the ignored set is not the three release-only pins." >&2
            echo "       expected: $expected_ignored_sorted" >&2
            echo "       actual:   $ignored" >&2
            exit 1
          fi

          # `ignore` keeps both profiles listing the same tests; assert that
          # rather than trusting the summary line alone.
          n=$(cargo test --release -p frps --test cli_exit_codes --color never -- --list 2>&1 \
            | sed -e 's/\x1b\[[0-9;]*m//g' | grep -E -c '^[^ ].*: test$' || true)
          if [[ "$n" != "$FRPS_RELEASE_CLI_TESTS" ]]; then
            echo "error: release lists $n tests, expected $FRPS_RELEASE_CLI_TESTS (the same set the" >&2
            echo "       debug lane pins with FRPS_CLI_TESTS). Update both literals together." >&2
            exit 1
          fi

          echo "release cli_exit_codes lane ok: $n listed, ${expected_passed} passed, ${expected_ignored} ignored (${ignored// /, }), 0 failed"
  tests-server:
    name: Tests (server integration)
    runs-on: ubuntu-latest
    # Heavy e2e lane: builds frps (dashboard) + frpc, then runs every
    # frp-server integration bin serially. This is the only lane that SAVES
    # the cargo cache (a second saver would race the write + double the
    # ~5 GB post-run upload).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Compiler from `rust-toolchain.toml` at the repo root (see
      # `docs/developing.md` § Toolchain pinning). `rustup toolchain install` with no
      # argument resolves that file's channel; the image's `stable` does not satisfy
      # a version pin, so this installs a second copy — the cost of the pin.
      - name: Install pinned Rust toolchain (`rust-toolchain.toml`)
        run: rustup toolchain install --no-self-update
      - name: Build frpc (server integration tests spawn it as the bridge end)
        run: cargo build --bin frpc
      - name: Build frps with dashboard feature
        # The dashboard-enabled frps also serves plain proxies (dashboard is
        # additive), so one binary covers both the dashboard integration tests
        # and the rest of the server integration suite.
        run: cargo build --bin frps --features dashboard
      - name: Run frp-server integration + dashboard tests
        # `--features dashboard` also enables the cfg-gated
        # dashboard_integration.rs / dashboard_v2_integration.rs so the only
        # opt-in business feature keeps CI coverage.
        # -j 1: each test bin binds ephemeral 127.0.0.1 ports as a separate
        # process; parallel bins can grab the same port and flake. The
        # common::allocate_port flock lock narrows the window; -j 1 removes it.
        run: cargo test -p frp-server --features dashboard -j 1
        env:
          FRPS_BIN: ${{ github.workspace }}/target/debug/frps
          FRPC_BIN: ${{ github.workspace }}/target/debug/frpc
      - name: Run the dedicated-websocket_port e2e target and assert its count
        # This is the only lane that runs
        # frp-server/tests/transport_e2e_websocket_port.rs (the step above's
        # `--features dashboard` sits on frp-server's defaults, websocket +
        # tcp-mux), so this is where its count guard belongs. The file is
        # whole-file `#![cfg(all(feature = "websocket", feature = "tcp-mux"))]`,
        # so dropping either feature from this lane makes it compile to an empty
        # crate and `cargo test` reports "0 passed" without failing; deleting the
        # file makes cargo pick no target at all. Both are caught here: the
        # target name must appear in the run log, the run must be green, and
        # `-- --list` must report the expected count. `expected` is the single
        # literal every comparison below reads.
        shell: bash
        run: |
          set -eo pipefail
          expected=2
          log=/tmp/frp-server-ws-dedicated-port.log
          run_status=0
          cargo test -p frp-server --features dashboard --test transport_e2e_websocket_port --color never 2>&1 | tee "$log" || run_status=$?
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"
          n=$(cargo test -p frp-server --features dashboard --test transport_e2e_websocket_port --color never -- --list 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' | grep -E -c '^[^ ].*: test$' || true)
          status=0
          [ "$run_status" = "0" ] || status=1
          grep -q "Running tests/transport_e2e_websocket_port.rs" "$log.plain" || status=1
          grep -q "test result: ok. $expected passed; 0 failed" "$log.plain" || status=1
          [ "$n" = "$expected" ] || status=1
          if [ "$status" != "0" ]; then
            echo "::error::frp-server dedicated-websocket_port guard failed (status=$status, cargo=$run_status, file=$n, expected=$expected, log=$log)"
            if [ -n "$n" ] && [ "$n" != "$expected" ]; then
              if [ "$n" -lt "$expected" ]; then
                echo "::error::frp-server/tests/transport_e2e_websocket_port.rs lists $n tests, this step expects $expected — the tests were deleted, or the file's #![cfg(all(feature = \"websocket\", feature = \"tcp-mux\"))] gate is false because this lane lost websocket or tcp-mux; restore the tests and the features rather than lowering the literal"
              else
                echo "::error::frp-server/tests/transport_e2e_websocket_port.rs lists $n tests, this step expects $expected: move the single literal in the 'expected=$expected' line at the top of this step to $n"
              fi
            fi
            cat "$log.plain"
            exit 1
          fi
          echo "frp-server dedicated-websocket_port guard ok: $n tests listed (expected $expected), 0 failed"
      - name: Run frp-server's tests with no features (runtime half of frp-server's tier gate)
        # The `verify` lane's `cargo check -p frp-server --no-default-features
        # --all-targets` is compile-only, so it cannot see a missing #[cfg] on a
        # test that still compiles. This is the runtime half for frp-server, in
        # the same no-features configuration as its compile sibling.
        #
        # It lives in this lane because it needs the frps binary: the five
        # frp-server/tests/oidc_integration.rs tests spawn frps
        # (frp-server/tests/common/mod.rs resolves FRPS_BIN, then
        # CARGO_BIN_EXE_frps, then ../frps, then ../target/{debug,release}/frps),
        # and without one they fail with `failed to start frps: Os { code: 2,
        # kind: NotFound }`. The two build steps above already pay that cost, so
        # FRPS_BIN/FRPC_BIN are set here exactly as in the step above.
        #
        # What it closes (TODO.md): 34 deterministic frp-server failures in this
        # configuration, all missing feature gates, closed by
        #   - `#![cfg(feature = "http-proxy")]` on frp-server/tests/http_plugin.rs
        #     and frp-server/tests/http_plugin_ping.rs (each file then runs
        #     0 tests here and 23 / 5 with `--features http-proxy`); the
        #     `#[cfg(not(feature = "http-proxy"))]` stub at
        #     frp-server/src/plugin/mod.rs makes `notify` return `Ok(None)` and
        #     `record_login_user` a no-op, so 22 of 23 and 4 of 5 of those tests
        #     failed without the gate;
        #   - `#[cfg(feature = "http-proxy")]` on
        #     `control::proxy_ops::unregister_generation_tests::
        #     stale_unregister_keeps_fresh_user_record`
        #     (frp-server/src/control/proxy_ops.rs) — measured without it:
        #     `48 passed; 1 failed`, `left: None`, `right: Some("fresh")`;
        #   - `#[cfg(feature = "websocket")]` on `test_login_via_websocket` and
        #     `#[cfg(feature = "tls")]` on `test_login_via_tls`
        #     (frp-server/tests/server_protocol.rs), the two `tls` dial cases in
        #     frp-server/tests/slowloris.rs, and the three e2e cases in
        #     frp-server/tests/vhost_https_sni.rs. Without the gate each dial
        #     fails (`WS dial: Transport(Other("WS raw connect read: Connection
        #     reset by peer (os error 54)"))`, `TLS dial: ... (os error 54)`)
        #     or the https vhost port refuses the connection. The gates are on
        #     **frp-server's own** features: frp-core's websocket/tls are ON in
        #     this graph (the frp-client dev-dependency's default features
        #     forward them), which is
        #     exactly why the server-side gate is the one that matters.
        #     `vhost_https_sni.rs` keeps its one no-feature test
        #     (`test_hello_construction_extracts_sni`, per item, not per file).
        #
        # Measured after the gates, with `target/debug/frps` present and
        # `-j 1 --no-fail-fast`: three of five samples exited 0 with 436 passed /
        # 0 failed (2m08s warm on macOS arm64 — the runner was not measured); the
        # other two were 435 passed / 1 failed, the single failure being the
        # pre-existing, feature-independent
        # `test_tcpmux_proxy_auth_interior_space_rejected_407` flake, since
        # fixed (it has its own TODO.md entry); it also failed with default
        # features and was the only measured pre-existing failure in those five
        # samples. Measured
        # without an frps binary, the same command adds 5 environmental
        # `oidc_integration` failures; that is why it is not in the unit lane.
        #
        # Caveat: the runner (Linux, cache restored from a default-feature
        # build) was not measured; the restored cache does not contain this
        # feature set, so the step pays a fresh compile of the no-features graph.
        run: cargo test -p frp-server --no-default-features --all-targets -j 1 --no-fail-fast
        env:
          FRPS_BIN: ${{ github.workspace }}/target/debug/frps
          FRPC_BIN: ${{ github.workspace }}/target/debug/frpc

  tests-client:
    name: Tests (client integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Compiler from `rust-toolchain.toml` at the repo root (see
      # `docs/developing.md` § Toolchain pinning). `rustup toolchain install` with no
      # argument resolves that file's channel; the image's `stable` does not satisfy
      # a version pin, so this installs a second copy — the cost of the pin.
      - name: Install pinned Rust toolchain (`rust-toolchain.toml`)
        run: rustup toolchain install --no-self-update
      - name: Build binaries (needed for integration tests)
        run: cargo build --bin frps --bin frpc
      - name: Run frp-client integration tests
        # `--features admin`: admin is opt-in, so frp-client's default
        # features exclude it. These admin-gated tests are COMPILED in CI
        # (Lint lane: clippy --workspace --all-targets --all-features) but
        # were never EXECUTED: this lane's default-feature `cargo test`
        # skipped them, and the all-features test lane is `--lib` only
        # (integration bins excluded). Pin the feature here so they run.
        # NB: they cover the admin handler (body-less GET /api/reload,
        # `?strictConfig=` ParseBool parity, malformed-body 400), not the
        # `frpc reload` CLI path.
        # -j 1: same ephemeral-port collision rationale as the server lane;
        # client-side only here (frp-server bins run on their own runner, so
        # cross-crate port collision is gone).
        run: cargo test -p frp-client --features admin -j 1
        env:
          FRPS_BIN: ${{ github.workspace }}/target/debug/frps
          FRPC_BIN: ${{ github.workspace }}/target/debug/frpc
      - name: Run the admin-without-TLS warning-delivery lane
        # The third answer of `WebServerTlsEnableReader::from_features`. `admin`
        # compiles the client's admin server; `tls` gates the acceptor that
        # server builds (`frp-client/src/admin.rs:1149`, with the
        # `not(feature = "tls")` discard arm at `:1164`). The step above
        # (`--features admin`, frp-client's defaults) always has `tls`, and the
        # `--no-default-features --all-targets` lanes have neither feature — so
        # until this step no lane EXECUTED `reload_warning_delivery` in the third
        # shape, admin on with `tls` off. That is the only shape whose record is
        # `WEB_SERVER_TLS_ENABLE_INERT_WARNING_NO_TLS`, so without this step the
        # no-TLS clause text and the `(true, false)` cell of `from_features` are
        # pinned by no lane. `--test reload_warning_delivery` is the narrowest
        # scope: it is the one target that reads that clause, and it asserts the
        # clause this crate's own `cfg!` answer produced, so a call site that
        # hardcodes another answer reds here. The count literal below is this
        # lane's own `-- --list` value, never another lane's.
        shell: bash
        run: |
          set -eo pipefail
          log=/tmp/frp-client-admin-no-tls-warning.log
          cargo test -p frp-client --no-default-features --features admin --test reload_warning_delivery --color never 2>&1 | tee "$log"
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"
          n=$(cargo test -p frp-client --no-default-features --features admin --test reload_warning_delivery --color never -- --list 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' | grep -E -c '^[^ ].*: test$' || true)
          status=0
          grep -q "Running tests/reload_warning_delivery.rs" "$log.plain" || status=1
          grep -q "test result: ok. 1 passed; 0 failed" "$log.plain" || status=1
          [ "$n" = "1" ] || status=1
          if [ "$status" != "0" ]; then
            echo "::error::frp-client admin-without-TLS warning guard failed (status=$status, file=$n, log=$log)"
            if [ -n "$n" ] && [ "$n" != "1" ]; then
              if [ "$n" -lt "1" ]; then
                echo "::error::frp-client/tests/reload_warning_delivery.rs lists $n tests, this step expects 1 — the test was deleted or the file was disabled; restore it rather than lowering this literal"
              else
                echo "::error::frp-client/tests/reload_warning_delivery.rs lists $n tests, this step expects 1: move the single literal in this shell step from 1 to $n"
              fi
            fi
            cat "$log.plain"
            exit 1
          fi
          echo "frp-client admin-without-TLS warning guard ok: $n tests listed (expected 1), 0 failed"

  verify:
    name: Verify (bench + feature sets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Compiler from `rust-toolchain.toml` at the repo root (see
      # `docs/developing.md` § Toolchain pinning). `rustup toolchain install` with no
      # argument resolves that file's channel; the image's `stable` does not satisfy
      # a version pin, so this installs a second copy — the cost of the pin.
      - name: Install pinned Rust toolchain (`rust-toolchain.toml`)
        run: rustup toolchain install --no-self-update
      - name: Check benchmarks compile
        run: cargo bench --workspace --no-run
      - name: Check tiny feature set compiles
        # RUSTFLAGS is part of the compiler fingerprint, so the restored
        # target/ cache (built without it) is not reused for these two steps;
        # they recompile the tier graphs. That cost is the point: the tier
        # builds must not warn, and these steps are what enforce it.
        #
        # NO --all-targets here, deliberately. On a --workspace invocation every
        # member is a root, so all dev-dependency edges enter the graph, and
        # frp-server's dev-dependency on frp-client (default features,
        # frp-server/Cargo.toml:67) plus frp-client's on frp-server re-enable
        # both crates' `default` sets. Measured with --all-targets: the micro
        # step compiles frp-client as
        # chacha20,compression,default,http2http,kcp,oidc,quic,tcp-mux,tls,websocket
        # instead of [], and frp-server as
        # chacha20,compression,default,http-proxy,kcp,oidc,quic,ssh,tcp-mux,tls,websocket
        # instead of [] — so --all-targets would silently drop the tier check for
        # those two crates, not extend it. The tier *test* targets are covered by
        # the three isolated steps below instead.
        run: cargo check --workspace --no-default-features --features tiny
        env:
          RUSTFLAGS: "-D warnings"
      - name: Check micro feature set compiles
        run: cargo check --workspace --no-default-features --features micro
        env:
          RUSTFLAGS: "-D warnings"
      - name: Check tier test targets compile (isolated, tls OFF)
        # `-p frp-client` makes frp-client the only root, so the sibling
        # dev-dependency edge that re-enables its `default` features is out of
        # the graph and the crate is genuinely compiled with tls OFF. This is
        # the run that compiles frp-client's test targets — all 40 of
        # frp-client/tests/*.rs — with -D warnings and tls OFF, so a missing
        # #[cfg(feature = "tls")] gate on a tls-only item is a compile error
        # here instead of a warning nothing promotes.
        #
        # Caveat, measured: 4 of those 40 targets are whole-file-cfg'd *empty*
        # in this configuration, so nothing inside them is checked —
        # plugin_h2.rs (#![cfg(feature = "http2http")], which is off here),
        # peer_xff_registry_e2e.rs (#![cfg(feature = "tls")]),
        # xtcp_pair_e2e.rs and xtcp_visitor_failure_e2e.rs
        # (#![cfg(all(feature = "quic", feature = "kcp"))]). `cargo test
        # -p frp-client --no-default-features --test <t> -- --list` reports 0
        # tests for each of the four, versus 38 for plugin_http. A missing gate
        # *inside* those four would not be caught here — which is exactly how
        # plugin_h2's tls-vs-http2http bug hid (TODO.md).
        #
        # The rationale for why the two --workspace tier steps above cannot
        # carry --all-targets is recorded there, not duplicated here.
        run: cargo check -p frp-client --no-default-features --all-targets
        env:
          RUSTFLAGS: "-D warnings"
      - name: Check frp-client tiny test targets compile (isolated, tls+tcp-mux)
        # frp-client's tiny tier is exactly `tls,tcp-mux` (frpc/Cargo.toml:23
        # `tiny = ["frp-client/tls", "frp-client/tcp-mux"]`), so `http2http` is
        # OFF here while `tls` is ON. Any test target whose imports come from
        # `http2http` but whose gate only names `tls` therefore fails to compile
        # in this configuration — which is how plugin_h2.rs (gated
        # `#![cfg(feature = "tls")]`, importing `h2`/`http`) broke: 5 errors,
        # E0433 `h2`/`http` plus E0277. It is now gated on `http2http`, and this
        # step is what keeps the next such target from hiding: without it the
        # tiny test targets are checked nowhere, because the `--workspace` tiny
        # step above does not carry --all-targets (see its comment for why).
        run: cargo check -p frp-client --no-default-features --features tls,tcp-mux --all-targets
        env:
          RUSTFLAGS: "-D warnings"
      - name: Check frp-server tier test targets compile (isolated, tls OFF)
        # The frp-server sibling of the step above: `-p frp-server` makes it
        # the only root, so frp-server's own features are at the micro set
        # (none) and its test targets are compiled with tls/websocket/ssh/...
        # OFF under -D warnings — a missing #[cfg(feature = ...)] gate on an
        # optional item is a compile error here.
        #
        # Caveat, measured — the bound is on the code that is *compiled*, not on
        # the targets. A whole-file-cfg'd target compiles to nothing, and inside
        # a target that does compile, any #[cfg]-excluded item is unchecked the
        # same way. Two counts, and the rule for each: `M` is every `tests/*.rs`
        # file at the top level of `frp-server/tests/` — Cargo auto-discovers
        # each as its own integration-test target (`frp-server/tests/common/`
        # is a shared module directory, not a target) — and `N` is how many of
        # those files carry a crate-level `#![cfg(...)]` inner attribute that is
        # false in this `--no-default-features` configuration, i.e. compile to
        # an empty crate. Measured at `634a273e`: M = 41, N = 12. The 12, by
        # gate: dashboard_integration.rs, dashboard_v2_integration.rs and
        # frps_binary_guard.rs (#![cfg(feature = "dashboard")]);
        # server_reload_auth.rs (#![cfg(feature = "oidc")]); ssh_gateway.rs
        # (#![cfg(feature = "ssh")]); transport_e2e_kcp.rs (#![cfg(feature =
        # "kcp")]); transport_e2e_quic.rs and v2_quic_r2r.rs (#![cfg(feature =
        # "quic")]); transport_e2e_websocket_port.rs (#![cfg(all(feature =
        # "websocket", feature = "tcp-mux"))]); vhost_h2c.rs, http_plugin.rs and
        # http_plugin_ping.rs (#![cfg(feature = "http-proxy")] — the last two
        # are the pair this change gated). `cargo test -p frp-server
        # --no-default-features --test <t> -- --list` reports 0 tests for each.
        # Item-by-item escapes exist too: vhost_audit_fixes.rs declares 21
        # tests, 2 tls-gated per item, so 19 are compiled and those 2 are not.
        # (mock_oidc.rs also reports 0 tests but is not whole-file-cfg'd empty —
        # no inner #[cfg], compiled as its own test target, simply declaring no
        # tests.)
        #
        # Note that frp-core is *not* feature-off in this graph: frp-server's
        # dev-dependency on frp-client (default features, frp-server/Cargo.toml)
        # pulls frp-client's defaults, which forward frp-core/websocket, tls,
        # kcp, ... — measured, frp-core has 10 features on here (chacha20,
        # compression, http-client, kcp, oidc, quic, stun, tcp-mux, tls,
        # websocket), six further features off (vnet, admin-auth, mem-profile,
        # profiling, debug-logs, otel), and `default` itself off too (both
        # frp-server and frp-client take frp-core with default-features = false).
        # That is precisely why it is a useful gate for *frp-server's own*
        # #[cfg] gates: frp-core can hand frp-server a type/variant that
        # frp-server's matching feature does not know about, so every `match`
        # on such a type must stay exhaustive by construction rather than by
        # feature coincidence (see ConnectionType::WebSocket in
        # frp-core/src/transport/mod.rs). websocket is the one that bit because
        # it is the only frp-core feature that gated a ConnectionType variant
        # (the WebSocket variant was the enum's only #[cfg] item before this
        # change); the other nine features frp-core has on here disagree with
        # frp-server's empty set just as much, but cannot change
        # `ConnectionType`'s shape.
        run: cargo check -p frp-server --no-default-features --all-targets
        env:
          RUSTFLAGS: "-D warnings"
      - name: Check frp-server tiny test targets compile (isolated, tls+http-proxy+tcp-mux)
        # The frp-server sibling of the frp-client tiny step above. frps's tiny
        # tier is `["frp-server/tls", "frp-server/http-proxy",
        # "frp-server/tcp-mux"]` (frps/Cargo.toml:24), a non-empty feature set
        # that no other step compiles frp-server's test targets with — the step
        # immediately above is tls OFF and http-proxy OFF. Without this, a future
        # frp-server test whose gate names one of these three but whose imports
        # come from a feature that is off here (dashboard, ssh, quic, kcp,
        # websocket) would hide exactly as frp-client's plugin_h2 did. Measured
        # clean when added (exit 0 with -D warnings); it is a gate, not a fix.
        run: cargo check -p frp-server --no-default-features --features tls,http-proxy,tcp-mux --all-targets
        env:
          RUSTFLAGS: "-D warnings"
      - name: Lint frp-server dashboard and frp-client oidc-off test targets (isolated)
        # The dashboard tier is opt-in (`dashboard = ["dep:prometheus",
        # "dep:axum", "frp-core/admin-auth"]`, frp-server/Cargo.toml). One other
        # step does compile frp-server's test targets with `dashboard` ON —
        # `cargo test -p frp-server --features dashboard -j 1` above — but that
        # one runs *with frp-server's defaults*, so `oidc` is ON. This step is
        # the only one that lints them with `dashboard` ON **and `oidc` OFF**.
        # `-p frp-server` keeps frp-server's own features at just `dashboard`, so
        # frp-server/oidc is OFF while frp-core/oidc is ON — frp-server's
        # dev-dependency on frp-client pulls frp-client's defaults, which
        # forward frp-core/oidc. That unification is the gate's point: a frp-core
        # item that exists only feature-on must not make an frp-server `match`
        # non-exhaustive, an frp-server #[cfg] gate naming a feature that is off
        # here (tls) must not hide an item that is actually used, and an
        # `auth.method = "oidc"` config must be refused rather than silently
        # downgraded (S1). Measured before the fix:
        #   RUSTFLAGS="-D warnings" cargo check -p frp-server \
        #     --no-default-features --features dashboard --all-targets
        # exited 101 with E0004 `AuthMethod::Oidc` not covered
        # (dashboard.rs, frp-server/oidc off), E0425 `TcpListener` and
        # `TcpStream`, E0433 `io` (NoDelayListener serves the plain-HTTP
        # dashboard path with tls off, but its imports were tls-gated) and
        # unused-import `AtomicU64` (only the tls-gated handshake throttle uses
        # it). After the fix: exit 0 with -D warnings.
        #
        # `clippy`, not `check`, and a second `-p frp-client` invocation: the
        # workspace clippy lane is `--all-features`, which compiles every
        # `#[cfg(not(feature = "oidc"))]` item *out*, so in the 2026-09 round a
        # `clippy::field_reassign_with_default` error in a client test gated
        # exactly that way was invisible to CI and had to be caught locally.
        # `-p frp-server ... --features dashboard` covers frp-server's own
        # targets; `-p frp-client --no-default-features` is the command that
        # caught that lint. Both are needed — frp-client is a dev-dependency of
        # frp-server, so it is only compiled, never linted, by the first.
        run: |
          cargo clippy -p frp-server --no-default-features --features dashboard --all-targets
          cargo clippy -p frp-client --no-default-features --all-targets
        env:
          RUSTFLAGS: "-D warnings"
      - name: Check frp-core tier test targets compile (isolated, no features)
        # The frp-core sibling of the two steps above: `-p frp-core` makes it
        # the only root and frp-core's own features are at the micro set
        # (none). Measured with `cargo check -p frp-core --no-default-features
        # --all-targets -v`: every frp-core rustc invocation (the lib, the lib
        # test, all 10 frp-core/tests/*.rs targets, and the
        # frp-core/benches/crypto_bridge.rs bench) carries zero
        # `--cfg feature=` flags, so nothing in this graph re-enables a
        # frp-core feature. frp-core's dev-dependencies are all external
        # crates (tokio with `test-util`, tower, criterion, proptest,
        # tempfile — frp-core/Cargo.toml) and none depends back on frp-core,
        # which is why `--all-targets` is safe here but not on the two
        # `--workspace` tier steps above.
        #
        # What it proves: a feature-gated item referenced from frp-core's lib
        # or test targets without its gate is a hard error under -D warnings —
        # E0432/E0425 when the item is absent, unused_imports/dead_code when
        # it is only conditionally used, and unused_mut for a binding whose
        # only mutation is gated. Before this change the run exited 101 with 4
        # failing units (lib test, kcp, xtcp_p2p, protocol_round14). What
        # closes it: per-item `websocket` gates on the two `connect_ws_raw`
        # lib tests (frp-core/src/transport/mod.rs), `oidc` on
        # `TokenEndpointCapture` (frp-core/src/auth.rs), `compression` on
        # `TEST_KEY` (frp-core/src/snappy_stream.rs), whole-file `kcp` gates on
        # frp-core/tests/kcp.rs and frp-core/tests/xtcp_p2p.rs, and a
        # restructured `all_message_variants` binding in
        # frp-core/tests/protocol_round14.rs.
        #
        # Caveat, measured — the bound is on the code that is *compiled*, not
        # on the targets. A whole-file-cfg'd target compiles to nothing: 6 of
        # frp-core's 10 test targets are empty here — kcp.rs and xtcp_p2p.rs
        # (#![cfg(feature = "kcp")]), mux.rs and yamux_rst.rs
        # (#![cfg(feature = "tcp-mux")]), xtcp_quic_sni.rs
        # (#![cfg(feature = "tls")]), ws_tls_stall.rs (#![cfg(all(feature =
        # "tls", feature = "websocket"))]). `cargo test -p frp-core
        # --no-default-features --test <t> -- --list` reports 0 tests for each,
        # versus 4/12/13/3/2/1 with default features. A missing gate *inside*
        # those six is not caught here; the other 4 targets (config_round14.rs
        # 2 tests, protocol_round14.rs 4, proxy_auth.rs 3,
        # v2_handshake_round14.rs 3) are compiled and checked in full.
        run: cargo check -p frp-core --no-default-features --all-targets
        env:
          RUSTFLAGS: "-D warnings"
      - name: Lint frp-core tier test targets (isolated, no features)
        # The clippy half of the step directly above. `-D warnings` is per
        # *feature configuration*, and this is the configuration no other lane
        # lints: the workspace lane's `Clippy` step (job `Lint (fmt + clippy)`,
        # `cargo clippy --workspace --all-targets --all-features`) compiles
        # every `cfg(not(feature = …))` item *out*, and the two isolated clippy
        # commands in `Lint frp-server dashboard and frp-client oidc-off test
        # targets (isolated)` are `-p frp-server`/`-p frp-client`. The step above
        # runs `check`, i.e. rustc lints only — which cannot see a `clippy::*`
        # lint at all. Measured before this step existed, at `005ddd8`:
        #   RUSTFLAGS="-D warnings" cargo clippy -p frp-core \
        #     --no-default-features --all-targets
        # exited 101 with exactly two clippy lints inside `cfg(not(…))` code:
        # `clippy::new_without_default` on `SnappyCompressor::new`
        # (frp-core/src/encryption.rs, `#[cfg(not(feature = "compression"))]`)
        # and `clippy::needless_return` on the TCP arm's tls-off refusal
        # (frp-core/src/transport/mod.rs, `#[cfg(not(feature = "tls"))]`). Both
        # were closed by fixing the code; this step is what keeps them closed.
        #
        # `clippy` runs rustc under it, so the rustc-lint coverage the step above
        # documents (E0425/E0432, unused_imports, dead_code, unused_mut) is a
        # strict subset of what this step reports; the `check` step is kept
        # because two files cite its name (`frp-core/src/config/restart_only.rs`,
        # `TODO.md`).
        #
        # NOT covered: every other `-p frp-core` feature combination. The one
        # other measured-red configuration (`--features websocket`, tls off — red
        # on the WSS arm's `needless_return` at `005ddd8`) is gated by the step
        # directly below. `--features kcp`, `tls`, `compression`,
        # `kcp,compression`, `websocket,compression`, `websocket,kcp`, `tcp-mux`,
        # `stun`, `vnet`, `oidc` and `kcp,websocket,tcp-mux,stun` were measured
        # clean after the fix (thirteen configurations in all) but stay ungated,
        # and the 2^N intra-crate space is not enumerated.
        run: cargo clippy -p frp-core --no-default-features --all-targets
        env:
          RUSTFLAGS: "-D warnings"
      - name: Lint frp-core tier test targets with websocket (isolated, no features)
        # The WSS refusal site (frp-core/src/transport/mod.rs, the arm behind
        # `TransportProtocol::Wss`) sits behind `#[cfg(feature = "websocket")]`,
        # so the step above compiles it out — the same class of gap this item is
        # about, one feature flag away. Measured at `005ddd8`:
        #   RUSTFLAGS="-D warnings" cargo clippy -p frp-core \
        #     --no-default-features --features websocket --all-targets
        # exited 101 on three lints — `clippy::new_without_default` for
        # `SnappyCompressor::new` (compression is off in that configuration) and
        # `clippy::needless_return` at both the TCP and this WSS refusal, all
        # fixed in the same change — and exits 0 after it. A `return`
        # reintroduced there fails THIS
        # step, not the one above, which is why it is a sibling step rather than
        # a second command in one step: the step name is the failure attribution.
        #
        # NOT covered: the same residue as the step above — every other
        # `-p frp-core` feature combination, `--features kcp` included.
        run: cargo clippy -p frp-core --no-default-features --features websocket --all-targets
        env:
          RUSTFLAGS: "-D warnings"
      - name: Check the five measured-red intra-crate feature combinations (curated list, NOT the full 2^N space)
        # A CURATED, CLOSED list — these five `-p`-isolated configurations were
        # measured red under -D warnings. The first four at `846c1b9`, fixed in
        # the change that added this step (TODO.md: "Measured `-p`
        # configurations that are red under `-D warnings`"). The frp-server
        # WebSocket one at `78d25166` — the dedicated-`websocket_port` listener
        # extraction, which left the `tokio::io::AsyncReadExt` import gate in
        # frp-server/src/service.rs naming `websocket` with no remaining user in
        # this configuration — and fixed in `049bd092` by narrowing the gate to
        # `kcp`. It is NOT the 2^N intra-crate feature space: a combination that
        # is not spelled out below is unchecked by this step and by every other
        # step in this lane. Extend the list when the next one is measured red,
        # and keep the count in this step name in sync with the number of lines.
        #
        # Every line carries `-p`, so the named crate is the only root and gets
        # exactly the features listed. `cargo check --workspace` cannot see any
        # of these failures: feature unification across members re-enables each
        # crate's `default` set (rationale on the two --workspace tier steps
        # above), which is precisely how these five combinations stayed
        # unmeasured until a manual `-p` sweep found them.
        #
        # The frp-server WebSocket line is the one no other lane reaches:
        # frp-server's websocket-ON lanes all carry kcp as well (its `default`
        # and frps's `full`), and the lanes that turn kcp off also turn
        # websocket off, so `websocket` without `kcp` exists only via `-p`. It
        # also carries `tcp-mux`, because the test target added alongside this
        # line — frp-server/tests/transport_e2e_websocket_port.rs — is
        # `#![cfg(all(feature = "websocket", feature = "tcp-mux"))]`: with
        # tcp-mux off the whole file is cfg'd out and the check sees an empty
        # crate, so a compile error in the test body would be invisible. Same
        # cost class, and `tcp-mux` is not `kcp`, so the property above stands.
        #
        # `set -e` short-circuits, so the first red configuration fails the
        # step and prints its own compiler output.
        run: |
          set -e
          cargo check -p frp-server --no-default-features --features vnet --all-targets
          cargo check -p frp-server --no-default-features --features websocket,tcp-mux --all-targets
          cargo check -p frp-client --no-default-features --features quic
          cargo check -p frp-client --no-default-features --features vnet --all-targets
          cargo check -p frp-core --no-default-features --features kcp --all-targets
        env:
          RUSTFLAGS: "-D warnings"

  build:
    name: Build (release)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [lint, tests-unit, tests-server, tests-client, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Compiler from `rust-toolchain.toml` at the repo root (see
      # `docs/developing.md` § Toolchain pinning). `rustup toolchain install` with no
      # argument resolves that file's channel; the image's `stable` does not satisfy
      # a version pin, so this installs a second copy — the cost of the pin.
      - name: Install pinned Rust toolchain (`rust-toolchain.toml`)
        run: rustup toolchain install --no-self-update
      - name: Build release (LTO disabled for CI speed)
        run: |
          mkdir -p .cargo
          printf '[profile.release]\nlto = false\nopt-level = 2\n' >> .cargo/config.toml
          cargo build --release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frp-rs-linux-x86_64
          path: |
            target/release/frps
            target/release/frpc
          retention-days: 7

  security:
    name: Security (cargo-audit + cargo-deny)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Restore-only, registry/git only: cargo-audit + cargo-deny never build
      # the workspace, so target/ is dead weight here. Saving it made the
      # post-run upload ~5.1 GB and it hung at "Sent 0 of ... (0.0%)" until
      # GitHub cancelled the job (observed twice 2026-09-01: this job and the
      # tests job at the 25m limit) — restore-only removes the upload entirely.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-security-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Compiler from `rust-toolchain.toml` at the repo root (see
      # `docs/developing.md` § Toolchain pinning). `rustup toolchain install` with no
      # argument resolves that file's channel; the image's `stable` does not satisfy
      # a version pin, so this installs a second copy — the cost of the pin.
      - name: Install pinned Rust toolchain (`rust-toolchain.toml`)
        run: rustup toolchain install --no-self-update
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo audit (dependency vulnerability scan)
        # RUSTSEC-2026-0194/0195 (quick-xml via the opt-in pprof profiling
        # path) and RUSTSEC-2023-0071 (rsa Marvin sidechannel, unreachable —
        # frp-rs only verifies RSA signatures, never private-key ops) are
        # documented pre-existing issues with no upstream fix. Full rationale
        # in CLAUDE.md "Security audit" and deny.toml [advisories].
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2023-0071
      - name: cargo deny check (advisories + licenses + bans + sources)
        # --all-features so the graph matches Cargo.lock (which cargo audit
        # scans): opt-in deps like pprof -> inferno -> quick-xml are otherwise
        # invisible to the license/advisory checks.
        run: cargo deny --all-features check
