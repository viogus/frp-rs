      FRPC_ADMIN_CLI_INPUTS_TESTS: "34"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Compiler from `rust-toolchain.toml` at the repo root (see
      # `docs/developing.md` § Toolchain pinning). `rustup toolchain install` with no
      # argument resolves that file's channel; the image's `stable` does not satisfy
      # a version pin, so this installs a second copy — the cost of the pin.
      - name: Install pinned Rust toolchain (`rust-toolchain.toml`)
        run: rustup toolchain install --no-self-update
      - name: Run all-features lib tests (QUIC admission and feature combos)
        run: cargo test --workspace --all-features --lib
      - name: Run frps bin unit tests (the `--lib` sweep cannot see them)
        # `frps` has no lib target, so its `#[cfg(test)] mod` unit tests live in
        # the bin target and the `--lib` sweep above never runs them
        # (`cargo test -p frps --lib` is `error: no library targets found`).
        # They are not decorative: `frps/src/main.rs`'s
        # `dir_registry_tests::lock_dir_registry_recovers_a_poisoned_registry`
        # pins the `--config-dir` SIGUSR1 registry's poisoned-mutex recovery
        # (TODO.md `--config-dir` residue item 7), and until this step existed
        # that pin executed in no CI lane. The count is asserted for the reason
        # the steps below document: a bare `cargo test --bin frps` cannot tell
        # "1 passed" from "0 ran" — with the module's only `#[test]` deleted this
        # step printed `running 0 tests` / `test result: ok. 0 passed; 0 failed`
        # and still exited 0. The literal is this **bin** target's own count, not
        # `FRPS_CLI_TESTS` (that env var counts the integration target
        # `frps/tests/cli_exit_codes.rs`), so adding or removing a test in this
        # inline module moves only the single literal in this step.
        #
        # The guard is not count-only. Round 4 measured two mutants that a count
        # of 1 cannot see: renaming the test (still one test, still green) and
        # returning early as the body's first statement (one test, `1 passed`,
        # zero assertions). So the step also greps the exact list entry and the
        # pin's `--nocapture` completion marker, which is printed only after
        # every assertion has run.
        #
        # Neither is the guard marker-only: a body that prints that marker and
        # returns would satisfy every line above. The step therefore runs the pin
        # a second time with `FRPS_DIR_REGISTRY_TEST_DISCARD=1`, which makes
        # `lock_dir_registry` recover the poisoned registry and then empty it —
        # exactly the mutant the pin asserts against — and requires that run to
        # FAIL. A vacuous pin cannot be made to fail, so it reds this step.
        shell: bash
        run: |
          set -eo pipefail
          log=/tmp/frps-bin-unit-tests.log
          # `--nocapture` puts the pin's own completion marker in the log: a body
          # that returns before its assertions still reports `1 passed`, and only
          # the marker distinguishes "ran the assertions" from "ran early".
          cargo test -p frps --bin frps --all-features --color never -- --nocapture 2>&1 | tee "$log"
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"
          expected="dir_registry_tests::lock_dir_registry_recovers_a_poisoned_registry"
          marker="dir-registry-pin: ok, recovered 3 entries"
          list=/tmp/frps-bin-unit-tests.list
          cargo test -p frps --bin frps --all-features --color never -- --list 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' > "$list"
          n=$(grep -E -c '^[^ ].*: test$' "$list" || true)
          named=$(grep -E -c "^${expected}: test$" "$list" || true)
          status=0
          grep -q "Running unittests src/main.rs" "$log.plain" || status=1
          grep -q "test result: ok. 1 passed; 0 failed" "$log.plain" || status=1
          [ "$n" = "1" ] || status=1
          [ "$named" = "1" ] || status=1
          grep -q "$marker" "$log.plain" || status=1
          # Converse run: the pin must also be *able* to fail, or a body that
          # prints the marker and returns would satisfy every line above. The
          # sabotage empties the registry the pin asserts against, so this run
          # must report FAILED — for this test, not for anything else.
          sabotage=/tmp/frps-bin-unit-tests-sabotaged.log
          FRPS_DIR_REGISTRY_TEST_DISCARD=1 \
            cargo test -p frps --bin frps --all-features --color never -- --nocapture \
            > "$sabotage" 2>&1 || true
          sed -e 's/\x1b\[[0-9;]*m//g' "$sabotage" > "$sabotage.plain"
          grep -q "test result: FAILED" "$sabotage.plain" || status=1
          grep -qE "^test ${expected} \.\.\. FAILED$" "$sabotage.plain" || status=1
          if grep -q "$marker" "$sabotage.plain"; then
            status=1
          fi
          if [ "$status" != "0" ]; then
            echo "::error::frps bin unit-test guard failed (status=$status, file=$n, named=$named, log=$log, sabotage=$sabotage)"
            if [ -n "$n" ] && [ "$n" != "1" ]; then
              if [ "$n" -lt "1" ]; then
                echo "::error::the inline test module in frps/src/main.rs lists $n tests, this step expects 1 — its tests were deleted or the module was disabled; restore them rather than lowering this literal"
              else
                echo "::error::the inline test module in frps/src/main.rs lists $n tests, this step expects 1: move the single literal in this shell step from 1 to $n"
              fi
            fi
            if [ "$named" != "1" ]; then
              echo "::error::the inline test module in frps/src/main.rs does not list ${expected} — the pin was renamed, deleted, or cfg'd out; restore it rather than re-pointing this name"
            fi
            if [ "$(grep -c "$marker" "$log.plain" || true)" = "0" ]; then
              echo "::error::the inline pin did not print its completion marker (\"$marker\") — a body that returns before its assertions passes libtest while asserting nothing; restore the assertions"
            fi
            if [ "$(grep -c "test result: FAILED" "$sabotage.plain" || true)" = "0" ]; then
              echo "::error::the sabotaged run (FRPS_DIR_REGISTRY_TEST_DISCARD=1) passed — the poisoned-registry pin cannot distinguish an emptied registry from the recovered live list, so it asserts nothing; restore its assertions"
            fi
            cat "$log.plain"
            exit 1
          fi
          echo "frps bin unit-test guard ok: $n tests listed (expected 1, ${expected}), marker seen, 0 failed, sabotage reds it"
      - name: Run vnet unit tests (nathole membership/cap guards)
        # frps/frpc default features exclude `vnet`, so the default-feature
        # `cargo test --workspace` steps never compile the nathole.rs vnet
        # tests (round-14 HIGH: default-net membership guard, proxy-less
        # host-route admission, 64-route cap). The all-features lib step
        # above covers them only incidentally; pin `--features vnet`
        # explicitly so a future default/all-features change cannot
        # silently drop the gate. --lib: the vnet-gated tests are unit
        # tests in nathole.rs (no vnet-gated integration bins exist).
        run: cargo test -p frp-server --features vnet --lib
      - name: Run frp-server's `web_server.tls.enable` resolver test without TLS (count guard)
        # `frp-server/src/service.rs`'s `web_server_tls_enable_reader()` picks the
        # emitted warning variant from this crate's own `dashboard` and `tls`
        # features. Every other lane links frp-server with `tls` on (the `full`
        # and `tiny` tiers and the `--all-features` sweeps), so replacing its
        # `cfg!(feature = "tls")` argument with the literal `true` stayed green:
        # in a tls-on build the expected variant is the same either way. This is
        # the one shape that separates them — dashboard on, tls off — which the
        # `verify` lane otherwise only *lints* (`cargo clippy -p frp-server
        # --no-default-features --features dashboard --all-targets`).
        #
        # The name filter keeps this off the rest of the lib tests: this shape
        # cannot run them all, because
        # `dashboard::v2::tests::test_serverinfo_go_shape` reads `kcpBindPort`,
        # which a kcp-less build does not produce. The count guard still pins
        # that exactly one test ran.
        #
        # The guard is not count-only, for the same reason the frps bin unit
        # step above is not: renaming the test (still one test, still green),
        # returning early as the body's first statement, and deleting the
        # `assert_eq!`s while keeping the marker (still `1 passed`, zero
        # assertions) all survive the count. So the step also pins the exact
        # list entry, greps the pin's `--nocapture` completion marker, and —
        # the part a log line cannot fake — runs the pin a second time with
        # `FRP_WARNING_PIN_SABOTAGE=1`, which flips the variant the pin expects,
        # and requires that run to FAIL. A body that skips its assertions cannot
        # be made to fail, so it reds this step; a marker alone cannot tell such
        # a body from a real one. The marker deliberately names no variant (the
        # `assert_eq!` pins it), so a legitimate variant rename does not move it.
        shell: bash
        run: |
          set -eo pipefail
          log=/tmp/frp-server-resolver-no-tls-test.log
          # `--nocapture` puts the pin's own completion marker in the log: a body
          # that returns before its assertions still reports `1 passed`, and only
          # the marker distinguishes "ran the assertions" from "ran early".
          cargo test -p frp-server --no-default-features --features dashboard --lib --color never web_server_tls_enable_reader -- --nocapture 2>&1 | tee "$log"
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"
          expected="service::tests::web_server_tls_enable_reader_answers_from_this_build"
          # No enum-variant spelling: the pin's own `assert_eq!` pins the variant,
          # and embedding its `Debug` text here made a legitimate rename of
          # `WebServerTlsEnableReader` red this step with a misleading message.
          marker="web-server-tls-enable-reader-pin: assertions ran"
          list=/tmp/frp-server-resolver-no-tls-test.list
          cargo test -p frp-server --no-default-features --features dashboard --lib --color never web_server_tls_enable_reader -- --list 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' > "$list"
          n=$(grep -E -c '^[^ ].*: test$' "$list" || true)
          named=$(grep -E -c "^${expected}: test$" "$list" || true)
          status=0
          grep -q "Running unittests src/lib.rs" "$log.plain" || status=1
          grep -q "test result: ok. 1 passed; 0 failed" "$log.plain" || status=1
          [ "$n" = "1" ] || status=1
          [ "$named" = "1" ] || status=1
          # `-x` (whole line): a plain substring grep counted a marker with
          # anything appended — `... assertions ranXYZ` — as the marker.
          grep -q -x -F "$marker" "$log.plain" || status=1
          # Converse run: the pin must be *able* to fail, or a body that prints
          # the marker and returns would satisfy every line above. `--exact` also
          # pins the name: a renamed pin leaves this run with no test to fail.
          sabotage=/tmp/frp-server-resolver-no-tls-test-sabotaged.log
          FRP_WARNING_PIN_SABOTAGE=1 \
            cargo test -p frp-server --no-default-features --features dashboard --lib --color never \
            -- --exact "$expected" --nocapture > "$sabotage" 2>&1 || true
          sed -e 's/\x1b\[[0-9;]*m//g' "$sabotage" > "$sabotage.plain"
          sabotaged=$(grep -E -c "^test ${expected} \.\.\. FAILED$" "$sabotage.plain" || true)
          [ "$sabotaged" = "1" ] || status=1
          sabotage_marker=0
          if grep -q -x -F "$marker" "$sabotage.plain"; then
            sabotage_marker=1
            status=1
          fi
          if [ "$status" != "0" ]; then
            echo "::error::frp-server warning-resolver guard failed (status=$status, file=$n, named=$named, log=$log, sabotage=$sabotage)"
            if [ -n "$n" ] && [ "$n" != "1" ]; then
              if [ "$n" -lt "1" ]; then
                echo "::error::frp-server/src/service.rs lists $n tests matching web_server_tls_enable_reader, this step expects 1 — the resolver pin was deleted or renamed; restore it rather than lowering this literal"
              else
                echo "::error::frp-server/src/service.rs lists $n tests matching web_server_tls_enable_reader, this step expects 1: move the single literal in this shell step from 1 to $n"
              fi
            fi
            if [ "$named" != "1" ]; then
              echo "::error::frp-server/src/service.rs does not list ${expected} — the resolver pin was renamed, deleted, or cfg'd out; restore it rather than re-pointing this name"
            fi
            if [ "$sabotaged" != "1" ]; then
              echo "::error::the sabotaged run (FRP_WARNING_PIN_SABOTAGE=1) did not fail ${expected} — the resolver pin cannot be made to fail, so a body that skips its assertions, or a same-named stub that only prints the marker, passes while asserting nothing; restore the assertions"
            elif [ "$sabotage_marker" = "1" ]; then
              # Only reachable when the sabotaged run *did* fail, so the marker
              # it printed cannot be the pass-path marker of a vacuous pin:
              # the body printed it before the assertion it is meant to follow.
              echo "::error::the sabotaged run printed the completion marker (\"$marker\") while failing ${expected} — the marker is printed before the assertions it is supposed to witness; move it back after them"
            fi
            # `sabotage_marker = 1` means the `elif` above already owns the
            # diagnosis (a marker printed before the assertion it witnesses), so
            # this branch must stay out of that case or the two contradict.
            if [ "$sabotage_marker" = "0" ] && [ "$(grep -c -x -F "$marker" "$log.plain" || true)" = "0" ]; then
              # "No marker" and "no assertions" are different edits, and the
              # sabotaged run tells them apart: it still fails when the
              # assertions are intact, so a marker-only edit is not sent after
              # assertions that were never touched.
              if [ "$sabotaged" = "1" ]; then
                echo "::error::the frp-server resolver pin ran its assertions (the sabotaged run still failed) but printed no completion marker (\"$marker\") — restore the println!; the assertions are intact"
              else
                echo "::error::the frp-server resolver pin printed no completion marker (\"$marker\") and the sabotaged run passed — a body that returns before its assertions passes libtest while asserting nothing; restore the assertions"
              fi
            fi
            cat "$log.plain"
            exit 1
          fi
          echo "frp-server warning-resolver guard ok: $n tests listed (expected 1, ${expected}), marker seen, 0 failed, sabotage reds it"
      - name: Run frp-core lib + integration tests (kcp/mux/xtcp_p2p/yamux_rst)
        # frp-core's tests/ are pure Rust<->Rust (no frps/frpc binaries), so
        # they belong with the unit lane and don't need the integration build.
        run: cargo test -p frp-core
      - name: Run frp-core's tests and benches with no features (runtime half of frp-core's tier gate)
        # The `verify` lane's `cargo check -p frp-core --no-default-features
        # --all-targets` is compile-only: it type-checks the test targets but
        # does not link or run them, so it cannot see a runtime failure in a
        # test or bench that still compiles. This step is the runtime half **for
        # frp-core**; the sibling runtime steps are `Run frp-client's tests with
        # no features` (this lane, below) and `Run frp-server's tests with no
        # features` (the Tests (server integration) lane, which already builds
        # the frps binary the oidc_integration tests spawn).
        #
        # For frp-core this step is the only gate for two measured classes:
        #   - eight frp-core lib tests (all in the compression path) failed with
        #     `"compression not compiled"` while compiling clean — 597 passed /
        #     8 failed;
        #   - `frp-core/benches/crypto_bridge.rs` had no compression gate and
        #     `bench_compression` unwraps `encryption::compress` at registration
        #     time (outside `b.iter`), panicking the whole bench binary:
        #     `thread 'main' panicked at frp-core/benches/crypto_bridge.rs:60:64:
        #     called `Result::unwrap()` on an `Err` value: "compression not
        #     compiled"`.
        # Both now carry their `#[cfg(feature = ...)]` gates; this step keeps
        # them gated. It lives in the unit lane rather than `verify` because
        # that lane already pays the test-harness cost (it links and runs the
        # same targets) and has a 25-minute budget.
        #
        # Measured after the gates: exits 0 with 609 tests passed / 0 failed and
        # 124 criterion bench cases run (default features: 903 tests / 130 bench
        # cases; --all-features: 917 / 130). Wall clock, macOS arm64: 5.39 s /
        # 5.42 s / 5.51 s warm on three runs, 19.84 s with frp-core's lib, its
        # 10 test targets and the bench touched (forced rebuild). The runner's
        # cost — Linux, cold cache — was not measured.
        run: cargo test -p frp-core --no-default-features --all-targets
      - name: Run frp-core's server `tls_enable` warning pin (count guard)
        # `frp-core/tests/server_tls_enable_warning.rs` is executed today only by
        # the two generic frp-core sweeps above, which is why the file is named
        # in neither: a bare `cargo test -p frp-core` cannot tell "8 passed" from
        # "0 ran" or from "7 passed, 1 ignored" — an `#[ignore]`d test still
        # leaves `test result: ok.` and exit 0. This step pins the count from the
        # target's own `-- --list`, like every sibling delivery lane. The count is
        # feature-independent (8 with and without `--no-default-features`), so
        # the one default-feature lane guards both directions.
        #
        # A count is not strength enough on its own: deleting the witness test's
        # own assertion, or making its first statement `return;`, still lists 8
        # and still reports `8 passed`, so the step stayed green. It therefore
        # also reads the count the run itself reports and requires it to equal
        # the `-- --list` count, pins the witness test's name, and runs that one
        # test a second time with `FRP_WARNING_PIN_SABOTAGE=1` — which flips the
        # value its assertion expects — requiring the run to FAIL. A vacuous pin
        # cannot be made to fail, so it reds this step.
        shell: bash
        run: |
          set -eo pipefail
          log=/tmp/frp-core-server-tls-enable-warning-tests.log
          cargo test -p frp-core --test server_tls_enable_warning --color never 2>&1 | tee "$log"
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"
          list=/tmp/frp-core-server-tls-enable-warning-tests.list
          cargo test -p frp-core --test server_tls_enable_warning --color never -- --list 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' > "$list"
          n=$(grep -E -c '^[^ ].*: test$' "$list" || true)
          witness="written_server_tls_enable_warns_once_and_stays_inert"
          named=$(grep -E -c "^${witness}: test$" "$list" || true)
          # The run's *own* summary is the other half of the count: a literal
          # taken only from `-- --list` cannot see a listed test that reported
          # nothing. Read it back instead of trusting the target's list.
          n_run=$(sed -n -e 's/^test result: ok\. \([0-9][0-9]*\) passed; 0 failed.*$/\1/p' "$log.plain" | tail -n 1)
          status=0
          grep -q "Running tests/server_tls_enable_warning.rs" "$log.plain" || status=1
          grep -q "test result: ok. 8 passed; 0 failed" "$log.plain" || status=1
          [ -n "$n_run" ] || status=1
          [ "$n_run" = "$n" ] || status=1
          [ "$n" = "8" ] || status=1
          [ "$named" = "1" ] || status=1
          # Converse run: the witness assertion must be *able* to fail, or a body
          # that deletes it — or returns before it — passes while still reporting
          # `8 passed`. The sabotage flips the value the witness expects; a
          # vacuous pin cannot be made to fail.
          sabotage=/tmp/frp-core-server-tls-enable-warning-tests-sabotaged.log
          FRP_WARNING_PIN_SABOTAGE=1 \
            cargo test -p frp-core --test server_tls_enable_warning --color never \
            -- --exact "$witness" --nocapture > "$sabotage" 2>&1 || true
          sed -e 's/\x1b\[[0-9;]*m//g' "$sabotage" > "$sabotage.plain"
          sabotaged=$(grep -E -c "^test ${witness} \.\.\. FAILED$" "$sabotage.plain" || true)
          [ "$sabotaged" = "1" ] || status=1
          if [ "$status" != "0" ]; then
            echo "::error::frp-core server tls_enable warning guard failed (status=$status, file=$n, run=$n_run, named=$named, log=$log, sabotage=$sabotage)"
            if [ -n "$n" ] && [ "$n" != "8" ]; then
              if [ "$n" -lt "8" ]; then
                echo "::error::frp-core/tests/server_tls_enable_warning.rs lists $n tests, this step expects 8 — tests were deleted or the file was disabled; restore them rather than lowering this literal"
              else
                echo "::error::frp-core/tests/server_tls_enable_warning.rs lists $n tests, this step expects 8: move the single literal in this shell step from 8 to $n"
              fi
            fi
            if [ -n "$n_run" ] && [ "$n_run" != "$n" ]; then
              echo "::error::frp-core/tests/server_tls_enable_warning.rs completed $n_run tests but its -- --list reports $n — a listed test did not run or reported nothing; restore it rather than re-pointing this literal"
            fi
            if [ "$named" != "1" ]; then
              echo "::error::frp-core/tests/server_tls_enable_warning.rs does not list ${witness} — the witness pin was renamed, deleted, or cfg'd out; restore it rather than re-pointing this name"
            fi
            if [ "$sabotaged" != "1" ]; then
              echo "::error::the sabotaged run (FRP_WARNING_PIN_SABOTAGE=1) did not fail ${witness} — this pin cannot be made to fail, so a body that deletes its assertions, or returns before them, passes while still reporting $n passed; restore its assertions"
            fi
            cat "$log.plain"
            exit 1
          fi
          echo "frp-core server tls_enable warning guard ok: $n tests listed (expected 8), $n_run passed, 0 failed, sabotage reds it"
      - name: Run frp-core's web-server `tls_enable` warning pin (count guard)
        # The sibling of the step above, for
        # `frp-core/tests/web_server_tls_enable_warning.rs`: same reason (no
        # guard can see a deleted or `#[ignore]`d test through the generic
        # sweeps), same `-- --list`-derived literal (6 with and without
        # `--no-default-features`), and the same three additions — a run-count
        # cross-check, a pinned witness name, and a `FRP_WARNING_PIN_SABOTAGE=1`
        # converse run of
        # `the_no_dashboard_build_names_no_dashboard_behaviour`, the test whose
        # `assert_eq!(c.expected, expected, ..)` a round-2 adversary deleted while
        # this step stayed green at `6 tests listed (expected 6), 0 failed`.
        shell: bash
        run: |
          set -eo pipefail
          log=/tmp/frp-core-web-server-tls-enable-warning-tests.log
          cargo test -p frp-core --test web_server_tls_enable_warning --color never 2>&1 | tee "$log"
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"
          list=/tmp/frp-core-web-server-tls-enable-warning-tests.list
