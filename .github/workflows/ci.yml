      # counted inside the 21 and 22 below; the 19 → 20 label belongs to the
      # pre-rebase numbering only.
      # 20 → 22 re-derived on this tree: the rebase resolution kept an earlier
      # pre-rebase incarnation of this branch — `b49adaf0`, patch-id
      # `68dc4ccbc6ee…` — whose `ci.yml` **declared this lane's literal as 20**;
      # after the rebase that commit is `32a0e8d2`, patch-id `fbcbecae5df3…`,
      # which declared 20 as well although its own tree already **listed 21**
      # tests, so that intermediate commit's count guard was one stale —
      # `1a56b2c5` then moves the literal by +2 (20 → 22): +1 to catch up with the
      # tree and +1 for round 3's second half. The patch-ids differ, so
      # `b49adaf0` is **not** an ancestor of this branch; both simply carried 20
      # as the declared literal. `59bf2a2c` is the commit that moved this lane
      # 19 → 20 in the pre-rebase chain. `main` `3f66d823` has neither of this
      # branch's rounds and lists 19 — but the rebased tree already lists **21**
      # (the converse pin above is part of it), and
      # round 3's second half adds the **swapped file order** (+1)
      # (`config_dir_where_the_first_service_fails_keeps_retrying_and_exits_zero`) —
      # `a.toml` holds the closed-port service with the default
      # `loginFailExit = true` (it fails first) and `b.toml` the retrying survivor,
