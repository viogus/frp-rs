        #
        # The feature flag also decides what this step leaves at
        # `target/debug/frps`. Measured here (macOS, warm, marker =
        # `grep -ac "Dashboard listening on" target/debug/frps`): after
        # `cargo test -p frps` the marker is 0; after this step's
        # `cargo test -p frps --features dashboard --test cli_completion` it is 1,
        # stable on a repeat; a later plain `cargo build -p frps` resets it to 0
        # and a later `cargo build -p frps --features dashboard` sets it back to
        # 1. So the step leaves a **dashboard** artifact behind, the safe
        # direction for any later consumer; and even if it did not, the test file
