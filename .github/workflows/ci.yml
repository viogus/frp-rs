          # 0 failed` and exits 0.
          sabotage=/tmp/frp-core-web-server-tls-enable-warning-tests-sabotaged.log
          FRP_WARNING_PIN_SABOTAGE=1 \
            cargo test -p frp-core --test web_server_tls_enable_warning --color never \
            -- --exact "$witness" --nocapture > "$sabotage" 2>&1 || true
          sed -e 's/\x1b\[[0-9;]*m//g' "$sabotage" > "$sabotage.plain"
          sabotaged=$(grep -E -c "^test ${witness} \.\.\. FAILED$" "$sabotage.plain" || true)
          [ "$sabotaged" = "1" ] || status=1
          if [ "$status" != "0" ]; then
            echo "::error::frp-core web-server tls_enable warning guard failed (status=$status, file=$n, run=$n_run, named=$named, log=$log, sabotage=$sabotage)"
            if [ -n "$n" ] && [ "$n" != "6" ]; then
              if [ "$n" -lt "6" ]; then
                echo "::error::frp-core/tests/web_server_tls_enable_warning.rs lists $n tests, this step expects 6 — tests were deleted or the file was disabled; restore them rather than lowering this literal"
              else
                echo "::error::frp-core/tests/web_server_tls_enable_warning.rs lists $n tests, this step expects 6: move the single literal in this shell step from 6 to $n"
              fi
            fi
            if [ -n "$n_run" ] && [ "$n_run" != "$n" ]; then
              echo "::error::frp-core/tests/web_server_tls_enable_warning.rs completed $n_run tests but its -- --list reports $n — a listed test did not run or reported nothing; restore it rather than re-pointing this literal"
            fi
            if [ "$named" != "1" ]; then
              echo "::error::frp-core/tests/web_server_tls_enable_warning.rs does not list ${witness} — the witness pin was renamed, deleted, or cfg'd out; restore it rather than re-pointing this name"
            fi
            if [ "$sabotaged" != "1" ]; then
              echo "::error::the sabotaged run (FRP_WARNING_PIN_SABOTAGE=1) did not fail ${witness} — this pin cannot be made to fail, so a body that deletes its assertions, or returns before them, passes while still reporting $n passed; restore its assertions"
            fi
            cat "$log.plain"
            exit 1
          fi
          echo "frp-core web-server tls_enable warning guard ok: $n tests listed (expected 6), $n_run passed, 0 failed, sabotage reds it"
      - name: Run frpc CLI tests (admin address resolution)
        # No lane ran a `cargo test` target of the `frpc` package before this
        # step (`ab-matrix.yml` only *builds* `-p frpc`; the two `--lib` steps —
        # `Run all-features lib tests` (`cargo test --workspace --all-features
        # --lib`) and `Run vnet unit tests` (`cargo test -p frp-server --features
        # vnet --lib`) — restrict to lib targets, and `frpc` has no lib). The
        # package's tests were therefore compiled by the
        # `Lint` lane (`cargo clippy --workspace --all-targets --all-features`,
        # which satisfies the bin's `required-features = ["full"]`) and executed
        # by nothing. That mattered: `frpc/src/main.rs`'s inline unit tests
        # pinned the old `127.0.0.1:7400` fallback that let
        # `frpc reload`/`status` silently ignore a config that fails to load.
        # This step executes them (8 unit tests — `cargo test -p frpc --bin frpc
        # -- --list`) plus `frpc/tests/admin_cli.rs` (25 tests —
        # `cargo test -p frpc --test admin_cli -- --list`; a snapshot figure,
        # since no lane counts that file and nothing reddens when it moves),
        # which spawns the `frpc` binary with crafted configs.
        #
        # What the `TcpListener` oracle does and does not prove. The listener is
        # bound to a port that is then written into the bad config's
        # `webServer.port`, so it covers *that* port only and cannot observe the
        # historical `127.0.0.1:7400` fallback by itself. Measured with a second
        # listener on 7400: the pre-fix binary leaves **0** connections on the
        # config's port and **1** on 7400; this branch's binary leaves 0 on
        # both. What catches a 7400 fallback is the output assertion, and it
        # takes two shapes: the two `*_port_zero_*` tests compare stdout exactly
        # (`assert_eq!(stdout.trim_end(), GO_NO_PORT_MSG)`), while the
        # load-error tests check a stdout substring
        # (`stdout_of(&out).contains("unknown field \"notAKnownFrpKey\"")`, e.g.
        # `frpc/tests/admin_cli.rs:253`; also `:285`, `:496`, `:638`) plus a
        # stderr check that no `connect` was attempted. Pre-fix those fail with
        # empty stdout and stderr
        # `reload failed: connect 127.0.0.1:7400: Connection refused (os error
        # 61)`. Measured against `main` @ `9c1b291`'s frpc, **9 of the 14 fail**
        # (5 passed; 9 failed), and 14/14 pass against this branch's binary.
        #
        # It belongs to the unit lane: the tests need no `frps`, and
        # `cargo test` builds the default-feature `frpc` bin they resolve via
        # `CARGO_BIN_EXE_frpc`. It sits immediately *before* the `frp-client`
        # no-features step on purpose: that step is documented-flaky on this
        # host (see its own comment), and with no `if: always()` a red run of it
        # would silently skip this one — the "compiled but never executed"
        # failure this step exists to fix. `frpc/tests/admin_cli.rs` is
        # `#![cfg(feature = "full")]`-gated for the no-default-features lanes
        # (`cargo test -p frpc --no-default-features` compiles it to 0 tests).
        #
        # Measured warm, macOS arm64: `cargo test -p frpc` 1.6 s wall (8 unit
        # tests in 0.00 s + 14 spawn-based tests in ~1.4 s, each waiting out a
        # 300 ms post-exit oracle window); `--no-default-features` 11.1 s from a
        # cold no-feature graph, with the integration file compiled to 0 tests.
        # The runner was not measured.
        run: cargo test -p frpc
      - name: Run frpc's log-completion spawn test (the client control)
        # `frpc/tests/log_completion.rs` is the **control** for the empty-CLI-value
        # rule the `frps` log-completion step below pins. The client has never
        # overlaid its flags onto the loaded config — `frpc/src/main.rs:367-371`
        # passes `cli.log_level` straight to `resolve_log_level` — so "an empty
        # `--log-level` leaves the file's `[log] level` alone" is the outcome it
        # has always had, on both the `-c` and the `--config-dir` lane. The file
        # makes that an executable contract: a future "alignment" that gives
        # `frpc` the `frps` overlay goes red rather than silently agreeing.
        #
        # Why this is its own step: the plain `cargo test -p frpc` step above
        # **does** execute the file, but nothing there notices if the file stops
        # running. It is `#![cfg(feature = "full")]` (the `frpc` bin requires
        # `full`), so a `--no-default-features` invocation — or any edit that
        # neuters the gate — compiles it to 0 tests, prints
        # `test result: ok. 0 passed; 0 failed` and exits **0**. Measured: the
        # bare invocation cannot tell "1 passed" from "0 ran". That is exactly
        # the hole `ci.yml`'s `frps` log-completion guard closes for its own
        # file, and the same `#![cfg(feature = "full")]` note the step above
        # carries for `frpc/tests/admin_cli.rs`.
        #
        # The literal is a property of the *file* (one `#[test]`), not a shared
        # env value: `env.FRPC_TINY_CLI_TESTS` counts `frpc/tests/cli_exit_codes.rs`
        # and must not be moved for this target.
        shell: bash
        run: |
          set -eo pipefail
          expected=1
          log=/tmp/frpc-log-completion-tests.log
          cargo test -p frpc --test log_completion --color never 2>&1 | tee "$log"
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"
          n=$(cargo test -p frpc --test log_completion --color never -- --list 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' | grep -E -c '^[^ ].*: test$' || true)
          status=0
          grep -q "Running tests/log_completion.rs" "$log.plain" || status=1
          grep -q "test result: ok. $expected passed; 0 failed" "$log.plain" || status=1
          [ "$n" = "$expected" ] || status=1
          if [ "$status" != "0" ]; then
            echo "::error::frpc log-completion guard failed (status=$status, file=$n, expected=$expected, log=$log)"
            if [ -n "$n" ] && [ "$n" != "$expected" ]; then
              if [ "$n" -lt "$expected" ]; then
                echo "::error::frpc/tests/log_completion.rs lists $n tests, *fewer* than the expected $expected — the file was disabled or tests were deleted (it is \`#![cfg(feature = \"full\")]\`-gated, so a feature change compiles it to 0 tests); restore them rather than lowering this literal"
              else
                echo "::error::frpc/tests/log_completion.rs lists $n tests, *more* than the expected $expected — tests were added: move the single literal in this shell step from $expected to $n"
              fi
            fi
            cat "$log.plain"
            exit 1
          fi
          echo "frpc log-completion guard ok: $n tests listed (expected $expected), 0 failed"
      - name: Run frps CLI tests (config-failure exit codes)
        # The `frps` sibling of the step above. No lane ran the
        # `frps/tests/cli_exit_codes.rs` *integration* target before this step:
        # the two `--lib` steps restrict to lib targets, `frps` has no lib (its
        # bin-target unit tests are covered by `Run frps bin unit tests` above),
        # and the `Lint` lane only *compiles* the test targets (`cargo clippy
        # --workspace --all-targets --all-features`). So that file — added with
        # the CLI config-failure fix (`TODO.md:3071`) — executed in no lane, and
        # the frps half of that fix had no executing pin.
        #
        # Measured warm, macOS arm64: 2.47 s wall for the package (4 tests, the
        # SIGTERM positive control dominating) when this step was added; 5 after
        # the `--strict-config` space-form lane added
        # `space_form_strict_config_warns_on_stderr` (the warning assertion, a
        # fast `--help`-free parse); then 4 more from the bool-flag `=value` lanes
        # — `version_flag_value_spelling_decides_what_happens` (three fast
        # exits), `version_short_shorthand_clusters_and_equals_spelling_match_go`
        # (the `-v` shorthand grammar, seven fast exits),
        # `tls_only_false_value_starts_and_listens` (a SIGTERM positive control)
        # and `disable_log_color_value_spelling_is_applied` (two spawns, each
        # waiting out a listener). The current count is not repeated here: it is
        # `env.FRPS_CLI_TESTS` on this job. The runner was not measured for wall
        # time either way.
        #
        # Fail closed, target-specifically, and colour-proof. `--test
        # cli_exit_codes` makes the integration file the only target, and
        # `-- --list` prints every test name plus `N tests, 0 benchmarks`, so the
        # expected count is asserted from the test list itself, not only from
        # cargo's human-readable summary.
        #
        # The failure text is direction-aware: it names the single value to move
        # only when the log's summary count and the `-- --list` count agree and
        # the file lists more tests than the value; a *decrease* says to restore
        # the deleted tests instead of lowering the value. A malformed or missing
        # value is rejected before cargo runs.
        #
        # Colour — the one thing here with *runner* evidence. This job sets
        # `CARGO_TERM_COLOR: always`, and cargo colours its `Running tests/…`
        # line: the first runner run of this step failed on exactly that literal
        # grep while `test result: ok. 4 passed` matched (the tests had in fact
        # passed), i.e. it failed closed, not open. That run also shows the step's
        # shell as `/usr/bin/bash --noprofile --norc -e -o pipefail`, which is
        # what this step's `shell: bash` + `set -eo pipefail` ask for. `--color
        # never` makes the captured log plain by construction and the `sed` strip
        # is a belt-and-braces pass over the same file, so the step still fails
        # *closed* if the log loses the summary or the count.
        #
        # `cargo test` exits 0 when a `#[cfg]` or target change compiles the file
        # to zero tests ("0 passed") — proven with a mutation (`full` →
        # `not(full)` in the file's crate-level cfg): the run printed
        # `test result: ok. 0 passed` and exited 0, and the list/count checks
        # rejected it. `-o pipefail` (with the explicit bash shell, since the
        # default `run:` shell is `bash -e` without pipefail) is what makes a
        # cargo failure after a matched line fail the step rather than being
        # masked by `tee`'s exit status.
        shell: bash
        run: |
          set -eo pipefail
          case "$FRPS_CLI_TESTS" in
            ''|*[!0-9]*)
              echo "::error::frps CLI exit-code guard: env.FRPS_CLI_TESTS must be a non-negative integer (got '$FRPS_CLI_TESTS')"
              exit 1
              ;;
          esac
          log=/tmp/frps-cli-tests.log
          cargo test -p frps --test cli_exit_codes --color never 2>&1 | tee "$log"
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.plain"
