          named=$(grep -E -c "^${witness}: test$" "$list" || true)
          # The run's own summary must agree with the target's list; see the
          # sibling step.
          n_run=$(sed -n -e 's/^test result: ok\. \([0-9][0-9]*\) passed; 0 failed.*$/\1/p' "$log.plain" | tail -n 1)
          status=0
          grep -q "Running tests/web_server_tls_enable_warning.rs" "$log.plain" || status=1
          grep -q "test result: ok. 6 passed; 0 failed" "$log.plain" || status=1
          [ -n "$n_run" ] || status=1
          [ "$n_run" = "$n" ] || status=1
          [ "$n" = "6" ] || status=1
          [ "$named" = "1" ] || status=1
          # Converse run: see the sibling step. Without it, deleting the
