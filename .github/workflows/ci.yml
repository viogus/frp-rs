        # executed — by that step, and by the server-integration job through
        # `FRPS_BIN`; the tiers this job never runs are `frps-tiny` and
        # `frps-micro`.) The other `cargo test` steps in this workflow are other
        # packages (`-p frp-core`, `-p frpc`, `-p frp-client`, `-p frp-server`,
        # and the `--workspace --lib` step, whose `--lib` restricts it to library
        # targets).
