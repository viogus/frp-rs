name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Prepare: freeze tag → commit SHA once. Prevents TOCTOU
  # where a moved tag causes different platforms to build different
  # commits within a single workflow run.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.tag }}
      release_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag to commit SHA
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          # Reject option-like or non-version tags before passing them to gh.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+ ]]; then
            echo "ERROR: invalid release tag: ${TAG}"
            exit 1
          fi
          SHA="$(git rev-parse HEAD)"
          # Verify HEAD is actually a tag (not a branch).
          if ! git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "ERROR: HEAD is not a tag (${TAG} resolved to ${SHA})"
            echo "Refusing to build release from non-tag commit."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG} @ ${SHA}"

  # ── Linux: cross-compile with cargo-zigbuild ──────────
  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - arm-unknown-linux-gnueabihf
          - i686-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout by frozen SHA — all platforms get the same commit.
          ref: ${{ needs.prepare.outputs.release_sha }}

      # Toolchain from the repo-root `rust-toolchain.toml` (no `toolchain:` input).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          # Release binaries must build across all feature tiers; feature-gated
          # unused imports/vars are expected in tiny/micro. Lint enforcement
          # (-D warnings) lives in ci.yml, not the release path.
          rustflags: ''

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install zig
        run: |
          curl -sSfL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            | tar xJ -C /tmp
          echo "/tmp/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"

      - name: Build (default)
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cargo build --target ${{ matrix.target }} --release
          else
            cargo zigbuild --target ${{ matrix.target }} --release
          fi

      - name: Build (tiny)
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cargo build --target ${{ matrix.target }} --release --no-default-features --features tiny
          else
            cargo zigbuild --target ${{ matrix.target }} --release --no-default-features --features tiny
          fi

      - name: Build (micro)
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cargo build --target ${{ matrix.target }} --release --no-default-features --features micro
          else
            cargo zigbuild --target ${{ matrix.target }} --release --no-default-features --features micro
          fi

      - name: Package
        run: |
          mkdir -p dist dist/tiny dist/micro
          cp target/${{ matrix.target }}/release/frps dist/frps
          cp target/${{ matrix.target }}/release/frpc dist/frpc
          tar czf dist/frp-rs_${{ needs.prepare.outputs.release_tag }}_${{ matrix.target }}.tar.gz -C dist frps frpc
          cp target/${{ matrix.target }}/release/frps-tiny dist/tiny/frps
          cp target/${{ matrix.target }}/release/frpc-tiny dist/tiny/frpc
          tar czf dist/frp-rs_${{ needs.prepare.outputs.release_tag }}_${{ matrix.target }}-tiny.tar.gz -C dist/tiny frps frpc
          cp target/${{ matrix.target }}/release/frps-micro dist/micro/frps
          cp target/${{ matrix.target }}/release/frpc-micro dist/micro/frpc
          tar czf dist/frp-rs_${{ needs.prepare.outputs.release_tag }}_${{ matrix.target }}-micro.tar.gz -C dist/micro frps frpc

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: dist/frp-rs_${{ needs.prepare.outputs.release_tag }}_${{ matrix.target }}*.tar.gz

  # ── macOS: native builds ─────────────────────────────
  build-macos:
    needs: prepare
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      # Toolchain from the repo-root `rust-toolchain.toml` (no `toolchain:` input).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          # Release binaries must build across all feature tiers; feature-gated
          # unused imports/vars are expected in tiny/micro. Lint enforcement
          # (-D warnings) lives in ci.yml, not the release path.
          rustflags: ''

      - name: Build (full)
        run: cargo build --target ${{ matrix.target }} --release

      - name: Build (tiny)
        run: cargo build --target ${{ matrix.target }} --release --no-default-features --features tiny

      - name: Build (micro)
        run: cargo build --target ${{ matrix.target }} --release --no-default-features --features micro

      - name: Package
        run: |
          mkdir -p dist dist/tiny dist/micro
          cp target/${{ matrix.target }}/release/frps dist/frps
          cp target/${{ matrix.target }}/release/frpc dist/frpc
          tar czf dist/frp-rs_${{ needs.prepare.outputs.release_tag }}_${{ matrix.target }}.tar.gz -C dist frps frpc
          cp target/${{ matrix.target }}/release/frps-tiny dist/tiny/frps
          cp target/${{ matrix.target }}/release/frpc-tiny dist/tiny/frpc
          tar czf dist/frp-rs_${{ needs.prepare.outputs.release_tag }}_${{ matrix.target }}-tiny.tar.gz -C dist/tiny frps frpc
          cp target/${{ matrix.target }}/release/frps-micro dist/micro/frps
          cp target/${{ matrix.target }}/release/frpc-micro dist/micro/frpc
          tar czf dist/frp-rs_${{ needs.prepare.outputs.release_tag }}_${{ matrix.target }}-micro.tar.gz -C dist/micro frps frpc

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/frp-rs_${{ needs.prepare.outputs.release_tag }}_${{ matrix.target }}*.tar.gz

  # ── Windows: native builds ──────────────────────────
  build-windows:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      # Toolchain from the repo-root `rust-toolchain.toml` (no `toolchain:` input).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          # Release binaries must build across all feature tiers; feature-gated
          # unused imports/vars are expected in tiny/micro. Lint enforcement
          # (-D warnings) lives in ci.yml, not the release path.
          rustflags: ''

      - name: Build (full)
        run: cargo build --target ${{ matrix.target }} --release

      - name: Build (tiny)
        run: cargo build --target ${{ matrix.target }} --release --no-default-features --features tiny

      - name: Build (micro)
        run: cargo build --target ${{ matrix.target }} --release --no-default-features --features micro

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          # Full
          Copy-Item target/${{ matrix.target }}/release/frps.exe dist/
          Copy-Item target/${{ matrix.target }}/release/frpc.exe dist/
          Compress-Archive -Path dist/frps.exe, dist/frpc.exe -DestinationPath dist/frp-rs_${{ needs.prepare.outputs.release_tag }}_${{ matrix.target }}.zip
          # Tiny
          Copy-Item target/${{ matrix.target }}/release/frps-tiny.exe dist/frps.exe -Force
          Copy-Item target/${{ matrix.target }}/release/frpc-tiny.exe dist/frpc.exe -Force
          Compress-Archive -Path dist/frps.exe, dist/frpc.exe -DestinationPath dist/frp-rs_${{ needs.prepare.outputs.release_tag }}_${{ matrix.target }}-tiny.zip
          # Micro
          Copy-Item target/${{ matrix.target }}/release/frps-micro.exe dist/frps.exe -Force
          Copy-Item target/${{ matrix.target }}/release/frpc-micro.exe dist/frpc.exe -Force
          Compress-Archive -Path dist/frps.exe, dist/frpc.exe -DestinationPath dist/frp-rs_${{ needs.prepare.outputs.release_tag }}_${{ matrix.target }}-micro.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: dist/frp-rs_${{ needs.prepare.outputs.release_tag }}_${{ matrix.target }}*.zip

  # ── collect & upload to release ──────────────────────
  publish:
    needs: [prepare, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Validate downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail
          assets_file="${RUNNER_TEMP:-/tmp}/release-assets.list"
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 > "$assets_file"
          asset_count=$(tr -cd '\0' < "$assets_file" | wc -c | tr -d ' ')
          # 13 targets x 3 profiles; keep in sync with build-*-matrix above.
          # 9 Linux x 3 + 2 macOS x 3 + 2 Windows x 3.
          expected_count=39
          if [ "$asset_count" -ne "$expected_count" ]; then
            echo "::error::expected ${expected_count} release archives, found ${asset_count}; refusing to touch the release"
            exit 1
          fi
          echo "Validated ${asset_count} release archives."

      - name: Create release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RELEASE_TAG:?}"
          WAS_PUBLISHED="${RUNNER_TEMP:-/tmp}/release-was-published"
          rm -f "$WAS_PUBLISHED"

          # `gh release view` can also hit transient 502s. A failed view falls
          # through to create, which then fails with "already exists"; retry the
          # view/create pair so that path converges instead of aborting.
          # If the release is already published, convert it to a draft before
          # touching assets so a failed upload cannot leave a mixed public set.
          release_ready=false
          for attempt in 1 2 3 4 5; do
            if is_draft=$(timeout 120 gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
              if [ "$is_draft" != true ]; then
                echo "Release $RELEASE_TAG is published; converting to draft before upload."
                # Record intent before the mutation: a timeout/502 can apply the
                # edit server-side without returning success.
                touch "$WAS_PUBLISHED"
                if ! timeout 120 gh release edit "$RELEASE_TAG" --draft=true; then
                  echo "::error::could not convert ${RELEASE_TAG} to a draft; refusing to clobber a published release"
                  exit 1
                fi
              fi
              echo "Release $RELEASE_TAG is a draft — will upload assets."
              release_ready=true
              break
            fi
            if output=$(timeout 120 gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --draft \
              --verify-tag 2>&1); then
              release_ready=true
              break
            fi
            printf '%s\n' "$output"
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 10))
              echo "::warning::release create/view failed (attempt ${attempt}/5); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          if [ "$release_ready" != true ]; then
            echo "::error::could not create or find release ${RELEASE_TAG}"
            exit 1
          fi

      - name: Upload assets to release
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RELEASE_TAG:?}"
          # Keep the archive loop well below the 45-minute job timeout so the
          # tail (checksums, verification, publish) and cleanup can still run.
          UPLOAD_DEADLINE=$((SECONDS + 1200))
          TOUCHED="${RUNNER_TEMP:-/tmp}/release-assets-touched"
          rm -f "$TOUCHED"

          # GitHub's release-asset endpoint intermittently returns HTTP 502 while
          # an asset is being replaced. Retry transient failures with backoff.
          # --clobber deletes the old asset before uploading, so a persistent
          # failure can still leave that asset missing; the job nevertheless
          # fails, and the stale checksums are removed below.
          upload_asset() {
            local asset="$1" attempt delay output
            for attempt in 1 2 3 4 5; do
              if [ "$SECONDS" -ge "$UPLOAD_DEADLINE" ]; then
                echo "::error::upload deadline exceeded before ${asset}"
                return 1
              fi
              # Mark touched only once an upload is actually attempted; a
              # deadline failure must leave the published release restorable.
              touch "$TOUCHED"
              if output=$(timeout 120 gh release upload "$RELEASE_TAG" "$asset" --clobber 2>&1); then
                return 0
              fi
              printf '%s\n' "$output"
              if [ "$attempt" -lt 5 ]; then
                delay=$((attempt * 10))
                echo "::warning::upload of ${asset} failed (attempt ${attempt}/5); retrying in ${delay}s"
                sleep "$delay"
              fi
            done
            echo "::error::failed to upload ${asset} after 5 attempts"
            return 1
          }

          assets_file="${RUNNER_TEMP:-/tmp}/release-assets.list"
          expected_names=$(mktemp)
          actual_names=$(mktemp)
          trap 'rm -f "$expected_names" "$actual_names" checksums.txt' EXIT

          # The validation step already materialised and counted this list; if
          # it is missing, fail before uploading anything.
          if [ ! -s "$assets_file" ]; then
            echo "::error::validated asset list is missing or empty: ${assets_file}"
            exit 1
          fi
          asset_count=$(tr -cd '\0' < "$assets_file" | wc -c | tr -d ' ')
          if [ "$asset_count" -ne 39 ]; then
            echo "::error::expected 39 archives in the validated list, found ${asset_count}"
            exit 1
          fi

          while IFS= read -r -d '' asset; do
            echo "Uploading: ${asset}"
            upload_asset "$asset"
          done < "$assets_file"

          # sha256 checksums (bare filenames, so `sha256sum -c checksums.txt`
          # works against the downloaded assets in one directory)
          : > checksums.txt
          while IFS= read -r -d '' asset; do
            hash=$(sha256sum "$asset")
            hash=${hash%% *}
            printf '%s  %s\n' "$hash" "${asset##*/}" >> checksums.txt
          done < "$assets_file"
          upload_asset checksums.txt

          # Compare the exact asset-name set, not a length: extra stale assets
          # must not make a partial upload look complete.
          while IFS= read -r -d '' asset; do
            printf '%s\n' "${asset##*/}" >> "$expected_names"
          done < "$assets_file"
          printf '%s\n' checksums.txt >> "$expected_names"
          sort -o "$expected_names" "$expected_names"

          remote_names=""
          remote_listed=false
          for attempt in 1 2 3; do
            if remote_names=$(timeout 120 gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null); then
              remote_listed=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          if [ "$remote_listed" != true ]; then
            echo "::error::could not list assets for ${RELEASE_TAG} after 3 attempts; the release remains a draft"
            exit 1
          fi
          printf '%s\n' "$remote_names" | sed '/^$/d' | sort -u > "$actual_names"
          if ! diff -u "$expected_names" "$actual_names"; then
            echo "::error::release ${RELEASE_TAG} asset set does not match the uploaded set; inspect or remove the draft with 'gh release delete ${RELEASE_TAG} --yes' and re-run"
            exit 1
          fi

          # Everything is present; publish only now. A failed upload leaves the
          # release as a draft, never a mixed public release.
          publish_ok=false
          for attempt in 1 2 3 4 5; do
            if timeout 120 gh release edit "$RELEASE_TAG" --draft=false; then
              publish_ok=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 10))
              echo "::warning::publish failed (attempt ${attempt}/5); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          if [ "$publish_ok" != true ]; then
            echo "::error::could not publish ${RELEASE_TAG} after 5 attempts"
            exit 1
          fi
          published=$(timeout 120 gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')
          if [ "$published" != false ]; then
            echo "::error::release ${RELEASE_TAG} is still a draft after publish"
            exit 1
          fi

      - name: Remove stale checksums or restore the published release
        if: always() && (steps.create.outcome == 'failure' || steps.create.outcome == 'cancelled' || steps.upload.outcome == 'failure' || steps.upload.outcome == 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RELEASE_TAG:?}"
          publish_retry() {
            local attempt delay
            for attempt in 1 2 3 4 5; do
              if timeout 120 gh release edit "$RELEASE_TAG" --draft=false; then
                return 0
              fi
              if [ "$attempt" -lt 5 ]; then
                delay=$((attempt * 10))
                echo "::warning::restore publish failed (attempt ${attempt}/5); retrying in ${delay}s"
                sleep "$delay"
              fi
            done
            return 1
          }
          is_draft_retry() {
            local attempt out
            for attempt in 1 2 3; do
              if out=$(timeout 60 gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
                printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done
            return 1
          }

          # If we converted a published release to a draft but never attempted
          # an upload, restore its published state. If any archive was touched,
          # leave it as a draft rather than exposing a possibly mixed set.
          if [ ! -f "${RUNNER_TEMP:-/tmp}/release-assets-touched" ]; then
            if [ -f "${RUNNER_TEMP:-/tmp}/release-was-published" ]; then
              if ! publish_retry; then
                echo "::error::could not restore published state for ${RELEASE_TAG}"
                exit 1
              fi
              echo "Restored the previously published release after a pre-upload failure."
            else
              echo "No archive upload was attempted; leaving existing checksums untouched."
            fi
            exit 0
          fi
          if ! is_draft=$(is_draft_retry); then
            echo "::error::could not determine draft state for ${RELEASE_TAG}"
            exit 1
          fi
          if [ "$is_draft" != true ]; then
            echo "Release is not a draft; leaving published assets and checksums untouched."
            exit 0
          fi
          timeout 60 gh release delete-asset "$RELEASE_TAG" checksums.txt --yes || true
