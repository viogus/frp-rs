name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux: cross-compile with cargo-zigbuild ──────────
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - arm-unknown-linux-gnueabihf
          - i686-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          # Release binaries must build across all feature tiers; feature-gated
          # unused imports/vars are expected in tiny/micro. Lint enforcement
          # (-D warnings) lives in ci.yml, not the release path.
          rustflags: ''

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install zig
        run: |
          curl -sSfL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            | tar xJ -C /tmp
          echo "/tmp/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"

      - name: Build (full)
        run: cargo zigbuild --target ${{ matrix.target }} --release

      - name: Build (tiny)
        run: cargo zigbuild --target ${{ matrix.target }} --release --no-default-features --features tiny

      - name: Build (micro)
        run: cargo zigbuild --target ${{ matrix.target }} --release --no-default-features --features micro

      - name: Package
        run: |
          mkdir -p dist dist/tiny dist/micro
          cp target/${{ matrix.target }}/release/frps dist/frps
          cp target/${{ matrix.target }}/release/frpc dist/frpc
          tar czf dist/frp-rs_${{ github.ref_name }}_${{ matrix.target }}.tar.gz -C dist frps frpc
          cp target/${{ matrix.target }}/release/frps-tiny dist/tiny/frps
          cp target/${{ matrix.target }}/release/frpc-tiny dist/tiny/frpc
          tar czf dist/frp-rs_${{ github.ref_name }}_${{ matrix.target }}-tiny.tar.gz -C dist/tiny frps frpc
          cp target/${{ matrix.target }}/release/frps-micro dist/micro/frps
          cp target/${{ matrix.target }}/release/frpc-micro dist/micro/frpc
          tar czf dist/frp-rs_${{ github.ref_name }}_${{ matrix.target }}-micro.tar.gz -C dist/micro frps frpc

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: dist/frp-rs_${{ github.ref_name }}_${{ matrix.target }}*.tar.gz

  # ── macOS: native builds ─────────────────────────────
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          # Release binaries must build across all feature tiers; feature-gated
          # unused imports/vars are expected in tiny/micro. Lint enforcement
          # (-D warnings) lives in ci.yml, not the release path.
          rustflags: ''

      - name: Build (full)
        run: cargo build --target ${{ matrix.target }} --release

      - name: Build (tiny)
        run: cargo build --target ${{ matrix.target }} --release --no-default-features --features tiny

      - name: Build (micro)
        run: cargo build --target ${{ matrix.target }} --release --no-default-features --features micro

      - name: Package
        run: |
          mkdir -p dist dist/tiny dist/micro
          cp target/${{ matrix.target }}/release/frps dist/frps
          cp target/${{ matrix.target }}/release/frpc dist/frpc
          tar czf dist/frp-rs_${{ github.ref_name }}_${{ matrix.target }}.tar.gz -C dist frps frpc
          cp target/${{ matrix.target }}/release/frps-tiny dist/tiny/frps
          cp target/${{ matrix.target }}/release/frpc-tiny dist/tiny/frpc
          tar czf dist/frp-rs_${{ github.ref_name }}_${{ matrix.target }}-tiny.tar.gz -C dist/tiny frps frpc
          cp target/${{ matrix.target }}/release/frps-micro dist/micro/frps
          cp target/${{ matrix.target }}/release/frpc-micro dist/micro/frpc
          tar czf dist/frp-rs_${{ github.ref_name }}_${{ matrix.target }}-micro.tar.gz -C dist/micro frps frpc

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/frp-rs_${{ github.ref_name }}_${{ matrix.target }}*.tar.gz

  # ── Windows: native builds ──────────────────────────
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          # Release binaries must build across all feature tiers; feature-gated
          # unused imports/vars are expected in tiny/micro. Lint enforcement
          # (-D warnings) lives in ci.yml, not the release path.
          rustflags: ''

      - name: Build (full)
        run: cargo build --target ${{ matrix.target }} --release

      - name: Build (tiny)
        run: cargo build --target ${{ matrix.target }} --release --no-default-features --features tiny

      - name: Build (micro)
        run: cargo build --target ${{ matrix.target }} --release --no-default-features --features micro

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          # Full
          Copy-Item target/${{ matrix.target }}/release/frps.exe dist/
          Copy-Item target/${{ matrix.target }}/release/frpc.exe dist/
          Compress-Archive -Path dist/frps.exe, dist/frpc.exe -DestinationPath dist/frp-rs_${{ github.ref_name }}_${{ matrix.target }}.zip
          # Tiny
          Copy-Item target/${{ matrix.target }}/release/frps-tiny.exe dist/frps.exe -Force
          Copy-Item target/${{ matrix.target }}/release/frpc-tiny.exe dist/frpc.exe -Force
          Compress-Archive -Path dist/frps.exe, dist/frpc.exe -DestinationPath dist/frp-rs_${{ github.ref_name }}_${{ matrix.target }}-tiny.zip
          # Micro
          Copy-Item target/${{ matrix.target }}/release/frps-micro.exe dist/frps.exe -Force
          Copy-Item target/${{ matrix.target }}/release/frpc-micro.exe dist/frpc.exe -Force
          Compress-Archive -Path dist/frps.exe, dist/frpc.exe -DestinationPath dist/frp-rs_${{ github.ref_name }}_${{ matrix.target }}-micro.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: dist/frp-rs_${{ github.ref_name }}_${{ matrix.target }}*.zip

  # ── collect & upload to release ──────────────────────
  publish:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --verify-tag || true

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | while read asset; do
            echo "Uploading: ${asset}"
            gh release upload "$RELEASE_TAG" "${asset}" --clobber
          done
