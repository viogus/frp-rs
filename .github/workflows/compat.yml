name: Cross-Compat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      go_frp_version:
        description: 'Go frp version (e.g. 0.71.0)'
        required: false
        default: '0.71.0'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false

    env:
      GO_FRP_VERSION: ${{ github.event.inputs.go_frp_version || '0.71.0' }}

    steps:
      - uses: actions/checkout@v4

      # Toolchain from the repo-root `rust-toolchain.toml` (no `toolchain:` input).
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # The Go frp side of the compat run is a *prebuilt* release tarball
      # (`scripts/download-go-frp.sh`), so no Go toolchain is ever invoked here:
      # `git ls-files '*.go'` is empty and no script runs `go build|run`. The
      # former `actions/setup-go@v5` step (and its `go-version: '>=1.22.0'`
      # range) selected a runner-image-cached compiler that nothing consumed.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/release/
          key: ${{ runner.os }}-compat-${{ hashFiles('Cargo.lock') }}-v2
          restore-keys: ${{ runner.os }}-compat-

      - name: Build frp-rs (release, LTO disabled for CI speed)
        run: |
          mkdir -p .cargo
          printf '[profile.release]\nlto = false\nopt-level = 2\n' >> .cargo/config.toml
          cargo build --release --bin frps --bin frpc --features "ssh,quic,dashboard"

      - name: Run Rust unit tests
        run: cargo test --workspace --release --lib

      - name: Download Go frp
        run: bash scripts/download-go-frp.sh "$GO_FRP_VERSION"

      - name: Run compat tests
        run: bash scripts/compat-test.sh --ci --go-version "$GO_FRP_VERSION"

      # `--list` prints `run_test` **function** names (`test_g2r_tcp_plain`)
      # while `--test` selects a scenario's **display** name
      # (`go-to-rust-tcp-plain`), so the value most likely to be pasted — the
      # first one — used to match nothing: the run selected zero scenarios and
      # still printed ` RESULTS: 0 passed, 0 failed` and `All tests passed!`
      # (the TODO.md `--test` selector item). Both controls below are the item's
      # own measured runs.
      # This is the one workflow with the Go and Rust binaries the selector
      # needs, which is why the gate is exercised here and not in the fixture
      # suite (that suite pins the same two runs with no binaries, so they only
      # reach the argument/selection path).
      - name: Selector gate — an unmatched --test fails closed
        run: |
          set -o pipefail
          out=$(mktemp)
          rc=0
          bash scripts/compat-test.sh --ci --go-version "$GO_FRP_VERSION" \
            --test test_g2r_tcp_plain >"$out" 2>&1 || rc=$?
          cat "$out"
          status=0
          if [ "$rc" = "0" ]; then
            echo "::error::--test test_g2r_tcp_plain exited 0; an unmatched selector must fail closed"
            status=1
          fi
          if ! grep -q 'test_g2r_tcp_plain' "$out"; then
            echo "::error::the failure message does not name the unmatched selector"
            status=1
          fi
          if grep -q ' RESULTS:' "$out"; then
            echo "::error::an unmatched selector still printed a ' RESULTS:' summary line"
            status=1
          fi
          if grep -q 'All tests passed!' "$out"; then
            echo "::error::an unmatched selector still printed 'All tests passed!'"
            status=1
          fi
          [ "$status" = "0" ] || exit 1
          echo "selector gate ok: unmatched --test exits $rc and names the selector"

      - name: Selector gate — a matching display name still runs one scenario
        run: |
          set -o pipefail
          out=$(mktemp)
          if ! bash scripts/compat-test.sh --ci --go-version "$GO_FRP_VERSION" \
              --test go-to-rust-tcp-plain >"$out" 2>&1; then
            cat "$out"
            echo "::error::the matching display name go-to-rust-tcp-plain did not pass"
            exit 1
          fi
          tail -5 "$out"
          if ! grep -q ' RESULTS: 1 passed, 0 failed' "$out"; then
            echo "::error::a matching --test must run exactly the one selected scenario"
            exit 1
          fi

      - name: Protocol connectivity matrix
        run: |
          cargo build --release --manifest-path scripts/frp-stress/Cargo.toml
          bash scripts/protocol-matrix.sh
