name: Cross-Compat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      go_frp_version:
        description: 'Go frp version (e.g. 0.70.1)'
        required: false
        default: '0.70.1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false

    env:
      GO_FRP_VERSION: ${{ github.event.inputs.go_frp_version || '0.70.1' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.22.0'

      - name: Cache cargo + go-frp builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/release/
            /tmp/frp-source-build/
          key: ${{ runner.os }}-compat-${{ hashFiles('Cargo.lock') }}-v2
          restore-keys: ${{ runner.os }}-compat-

      - name: Build frp-rs (release, LTO disabled for CI speed)
        run: |
          mkdir -p .cargo
          printf '[profile.release]\nlto = false\nopt-level = 2\n' >> .cargo/config.toml
          cargo build --release --bin frps --bin frpc

      - name: Run Rust unit tests
        run: cargo test --workspace --release --lib

      - name: Download Go frp
        run: bash scripts/download-go-frp.sh "$GO_FRP_VERSION"

      - name: Run compat tests
        env:
          GO_FRP_V2: "1"
        run: bash scripts/compat-test.sh --ci --go-version "$GO_FRP_VERSION"
